<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <!-- 移动端浏览器上下工具栏配色：跟随浅色/深色主题 -->
    <meta name="theme-color" content="#F5F6F8" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0B0F17" media="(prefers-color-scheme: dark)">
    <title>適所 · 技術者・案件マッチングシステム</title>
    <!-- 采用系统字体栈：零外部依赖、离线可用，同时保持日文/中文排版清晰 -->
    <style>
        /* ==========================================================================
   全局变量与主题设计系统 (Design System)
   采用清爽的浅色 SaaS 控制台风格：深色侧栏、白色卡片、蓝色主色、细边框与柔和阴影
   支持标准浅色与深色模式切换
   ========================================================================== */
        :root {
            color-scheme: light;
            --bg: #F5F6F8;
            --surface: #FFFFFF;
            --surface2: #F0F2F6;
            --ink: #1A1D24;
            --ink2: #5B6270;
            --ink3: #667085;
            --line: #E6E8EC;
            --accent: #3568EE;
            --accent-hover: #2C58D8;
            --accent-soft: #EEF3FF;
            --accent-ink: #FFFFFF;
            --accent-shadow: rgba(53, 104, 238, .28);
            --ok: #1F9D6B;
            --ok-soft: #E8F7F0;
            --warn: #B7791F;
            --warn-soft: #FDF6E7;
            --bad: #C0392B;
            --bad-soft: #FDECEB;
            --side: #141821;
            --side-ink: #E7EAF0;
            --side-ink2: #9AA2B5;
            --side-line: #262C3B;
            --side-active: #1C2130;
            --side-accent: #7AA2FF;
            --shadow: 0 1px 2px rgba(20, 24, 33, .04), 0 8px 24px rgba(20, 24, 33, .06);
            --shadow-lg: 0 16px 40px rgba(20, 24, 33, .12);
            --ring-track: #EEF0F3;
            --display: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", "Microsoft YaHei", sans-serif;
            --body: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", "Microsoft YaHei", sans-serif;
            --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                color-scheme: dark;
                --bg: #0B0F17;
                --surface: #141A25;
                --surface2: #1C2331;
                --ink: #EDF0F6;
                --ink2: #A8B0C0;
                --ink3: #8A94B4;
                --line: #252D3C;
                --accent: #7AA2FF;
                --accent-hover: #92B4FF;
                --accent-soft: #1B2A4D;
                --accent-ink: #0B0F17;
                --accent-shadow: rgba(122, 162, 255, .25);
                --ok: #5FD3A0;
                --ok-soft: #12362B;
                --warn: #F0B35E;
                --warn-soft: #3A2A10;
                --bad: #FF8F7C;
                --bad-soft: #3E1B16;
                --side: #0C111A;
                --side-ink: #E7EAF0;
                --side-ink2: #98A2B5;
                --side-line: #232B3A;
                --side-active: #1B2230;
                --side-accent: #7AA2FF;
                --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
                --shadow-lg: 0 16px 40px rgba(0, 0, 0, .5);
                --ring-track: #252D3C;
            }
        }

        :root[data-theme="dark"] {
            color-scheme: dark;
            --bg: #0B0F17;
            --surface: #141A25;
            --surface2: #1C2331;
            --ink: #EDF0F6;
            --ink2: #A8B0C0;
            --ink3: #8A94B4;
            --line: #252D3C;
            --accent: #7AA2FF;
            --accent-hover: #92B4FF;
            --accent-soft: #1B2A4D;
            --accent-ink: #0B0F17;
            --accent-shadow: rgba(122, 162, 255, .25);
            --ok: #5FD3A0;
            --ok-soft: #12362B;
            --warn: #F0B35E;
            --warn-soft: #3A2A10;
            --bad: #FF8F7C;
            --bad-soft: #3E1B16;
            --side: #0C111A;
            --side-ink: #E7EAF0;
            --side-ink2: #98A2B5;
            --side-line: #232B3A;
            --side-active: #1B2230;
            --side-accent: #7AA2FF;
            --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
            --shadow-lg: 0 16px 40px rgba(0, 0, 0, .5);
            --ring-track: #252D3C;
        }

        * {
            box-sizing: border-box;
        }

        /* 移动端基础：防止 iOS 横屏字号自动放大；滚动条占位避免弹窗锁定滚动时页面左右抖动 */
        html {
            -webkit-text-size-adjust: 100%;
            scrollbar-gutter: stable;
        }

        /* 抽屉 / 权重弹窗打开时锁定背景滚动（避免手机上内容在叠层背后滑动） */
        html.no-scroll {
            overflow: hidden;
        }

        html.no-scroll body {
            overflow: hidden;
        }

        /* 触屏元素消除 300ms 延迟与系统点击高亮 */
        button,
        [role="button"],
        label,
        input,
        select,
        textarea {
            touch-action: manipulation;
        }

        button,
        [role="button"] {
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--ink);
            font: 14px/1.6 var(--body);
            -webkit-font-smoothing: antialiased;
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
            color: inherit;
        }

        h1,
        h2,
        h3,
        p {
            margin: 0;
        }

        .num {
            font-variant-numeric: tabular-nums;
        }

        .mono {
            font-family: var(--mono);
        }

        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
            border-radius: 6px;
        }

        /* 页面两栏布局 */
        .shell {
            display: grid;
            grid-template-columns: 236px minmax(0, 1fr);
            min-height: 100vh;
            min-height: 100dvh;
        }

        .rail {
            background: var(--side);
            color: var(--side-ink);
            position: sticky;
            top: 0;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            padding: 22px 14px 18px;
            gap: 18px;
            user-select: none;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 8px;
        }

        .brand-mark {
            width: 34px;
            height: 34px;
            border-radius: 9px;
            border: 0;
            display: grid;
            place-items: center;
            font: 800 18px/1 var(--display);
            background: linear-gradient(135deg, #3568EE, #7AA2FF);
            color: #fff;
            box-shadow: 0 4px 12px var(--accent-shadow);
            flex: none;
        }

        .brand>div:last-child {
            flex: 1;
            min-width: 0;
        }

        .brand b {
            display: block;
            font: 700 14.5px/1.3 var(--display);
            letter-spacing: .01em;
            color: #fff;
        }

        .brand small {
            display: block;
            color: var(--side-ink2);
            font-size: 10.5px;
            letter-spacing: .02em;
            line-height: 1.4;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .nav {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .nav-label {
            font-size: 11px;
            letter-spacing: .14em;
            color: var(--side-ink2);
            padding: 0 10px 6px;
            font-weight: 500;
        }

        .nav button {
            display: flex;
            align-items: center;
            gap: 12px;
            background: none;
            border: 0;
            border-radius: 9px;
            padding: 9px 10px;
            color: var(--side-ink2);
            cursor: pointer;
            text-align: left;
            width: 100%;
            transition: all .15s ease;
        }

        .nav button:hover {
            color: var(--side-ink);
            background: var(--side-active);
        }

        .nav button[aria-current="page"] {
            background: var(--accent);
            color: var(--accent-ink);
            font-weight: 600;
            box-shadow: 0 4px 14px var(--accent-shadow);
        }

        .nav svg {
            width: 18px;
            height: 18px;
            flex: none;
        }

        /* 导航文字：桌面显示完整名称，手机底部栏显示短名称 */
        .nav-txt-short {
            display: none;
        }

        .nav .count {
            margin-left: auto;
            font: 600 10.5px var(--mono);
            background: rgba(255, 255, 255, .12);
            border-radius: 99px;
            padding: 1px 7px;
            color: var(--side-ink);
        }

        .rail-foot {
            margin-top: auto;
            border-top: 1px solid var(--side-line);
            padding: 14px 8px 0;
            font-size: 11.5px;
            line-height: 1.45;
            color: var(--side-ink2);
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .rail-foot b {
            color: var(--side-ink);
            font-weight: 500;
        }

        .dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #27ae60;
            margin-right: 6px;
        }

        .dot.sync {
            background: #e0a34a;
        }

        /* 工作区容器 */
        .main {
            padding: 30px max(20px, env(safe-area-inset-right, 0px)) 80px max(20px, env(safe-area-inset-left, 0px));
            min-width: 0;
        }

        .wrap {
            max-width: 1340px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .page-head {
            display: flex;
            flex-wrap: wrap;
            gap: 16px 24px;
            align-items: flex-end;
            justify-content: space-between;
        }

        .eyebrow {
            font-size: 12px;
            letter-spacing: .16em;
            color: var(--ink3);
            text-transform: uppercase;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .page-head h1 {
            font: 700 26px/1.3 var(--display);
            letter-spacing: -.02em;
        }

        .page-head p {
            color: var(--ink2);
            max-width: 70ch;
            margin-top: 6px;
            font-size: 13px;
        }

        .tools {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        /* 筛选组：微型标题 + 胶囊按钮，明确区分状态与月份维度 */
        .tool-group {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .tool-label {
            font-size: 11.5px;
            font-weight: 600;
            color: var(--ink3);
            white-space: nowrap;
            letter-spacing: .02em;
        }

        /* ---------- 通用工具类（移动端适配复用） ---------- */
        /* 搜索输入框：桌面固定宽度，手机端自适应 */
        .search {
            width: 240px;
            max-width: 100%;
        }

        /* 表单行：左侧说明 + 右侧快捷操作，窄屏自动换行 */
        .form-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* 按钮组：多个按钮并排，窄屏自动换行 */
        .btn-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        /* 仅宽屏可见的内容（手机端隐藏次要说明） */
        .only-wide {
            display: initial;
        }

        /* 右对齐单元格（替代内联 text-align，便于手机端统一左对齐） */
        .ta-r {
            text-align: right;
        }

        /* 页面标题内联计数：使用明确的胶囊计数，避免裸数字歧义 */
        .h-count {
            display: inline-flex;
            align-items: center;
            vertical-align: 2px;
            margin-left: 8px;
            padding: 0 9px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: var(--surface2);
            color: var(--ink3);
            font: 600 12px/1.8 var(--body);
            font-variant-numeric: tabular-nums;
            letter-spacing: 0;
        }

        /* 总览待办项右侧统计区 */
        .todo-side {
            text-align: right;
            flex: none;
        }

        /* 基础通用组件 */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            border: 1px solid var(--line);
            background: var(--surface);
            border-radius: 10px;
            padding: 9px 15px;
            cursor: pointer;
            font-weight: 550;
            white-space: nowrap;
            user-select: none;
            transition: border-color .16s cubic-bezier(0.23, 1, 0.32, 1),
                background .16s cubic-bezier(0.23, 1, 0.32, 1),
                color .16s cubic-bezier(0.23, 1, 0.32, 1),
                transform .16s cubic-bezier(0.23, 1, 0.32, 1),
                box-shadow .16s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .btn:hover {
            border-color: color-mix(in srgb, var(--accent) 45%, var(--line));
            color: var(--accent);
            background: color-mix(in srgb, var(--accent-soft) 45%, var(--surface));
        }

        .btn:active {
            transform: translateY(1px) scale(.99);
        }

        .btn.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--accent-ink);
            font-weight: 600;
            box-shadow: 0 4px 14px var(--accent-shadow);
        }

        .btn.primary:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
            filter: none;
            color: var(--accent-ink);
            box-shadow: 0 6px 18px var(--accent-shadow);
        }

        .btn.ok-light {
            background: var(--ok-soft);
            border-color: color-mix(in srgb, var(--ok) 35%, transparent);
            color: var(--ok);
            font-weight: 600;
        }

        .btn.ok-light:hover {
            background: color-mix(in srgb, var(--ok-soft) 80%, #fff);
            border-color: var(--ok);
        }

        .btn.danger {
            color: var(--bad);
            border-color: color-mix(in srgb, var(--bad) 40%, var(--line));
        }

        .btn.danger:hover {
            background: var(--bad-soft);
        }

        .btn.danger.solid {
            background: var(--bad);
            color: #fff;
            border-color: var(--bad);
        }

        .btn.ghost {
            background: none;
            border-color: transparent;
            color: var(--ink2);
        }

        .btn.ghost:hover {
            background: var(--surface2);
            color: var(--ink);
        }

        .btn.sm {
            padding: 5px 10px;
            font-size: 13px;
            border-radius: 8px;
        }

        .btn svg,
        .btn .ico-svg {
            width: 15px;
            height: 15px;
            display: inline-block;
            vertical-align: -2px;
            flex-shrink: 0;
        }

        .ico-svg {
            width: 14px;
            height: 14px;
            display: inline-block;
            vertical-align: -2px;
            flex-shrink: 0;
            stroke: currentColor;
        }

        .chip svg,
        .chip-out svg {
            width: 12px;
            height: 12px;
            display: inline-block;
            vertical-align: -1.5px;
            flex-shrink: 0;
        }

        .strip-sub svg {
            width: 12px;
            height: 12px;
            display: inline-block;
            vertical-align: -1.5px;
            margin-right: 3px;
        }

        .flt-sum-title {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .flt-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: var(--bad);
        }

        .flt-icon svg {
            width: 16px;
            height: 16px;
        }

        .btn[disabled] {
            opacity: .45;
            cursor: not-allowed;
        }

        .field,
        .sel {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 9px 12px;
            min-width: 0;
            transition: border-color .15s, box-shadow .15s;
        }

        .field:focus,
        .sel:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        .sel {
            appearance: none;
            padding-right: 34px;
            background-image: linear-gradient(45deg, transparent 50%, var(--ink3) 50%), linear-gradient(135deg, var(--ink3) 50%, transparent 50%);
            background-position: calc(100% - 17px) 55%, calc(100% - 12px) 55%;
            background-size: 5px 5px;
            background-repeat: no-repeat;
            cursor: pointer;
        }

        .seg {
            display: inline-flex;
            background: transparent;
            border-radius: 0;
            padding: 0;
            gap: 8px;
        }

        .seg button {
            border: 1px solid var(--line);
            background: var(--surface);
            padding: 6px 13px;
            border-radius: 999px;
            cursor: pointer;
            color: var(--ink2);
            font-weight: 500;
            font-size: 12.5px;
            line-height: 1.5;
            transition: all .15s ease;
        }

        .seg button:hover {
            border-color: color-mix(in srgb, var(--accent) 35%, var(--line));
            color: var(--accent);
        }

        .seg button[aria-pressed="true"] {
            background: var(--accent-soft);
            border-color: color-mix(in srgb, var(--accent) 55%, var(--line));
            color: var(--accent);
            font-weight: 650;
            box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 18%, transparent);
        }

        .panel {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 14px;
            box-shadow: var(--shadow);
            min-width: 0;
        }

        .panel-h {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 18px 20px 14px;
            border-bottom: 1px solid var(--line);
        }

        .panel-h h2 {
            font: 700 15px/1.4 var(--display);
            letter-spacing: -.01em;
        }

        .panel-b {
            padding: 18px 20px;
        }

        .chip {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            border-radius: 99px;
            padding: 1px 10px;
            font-size: 12px;
            font-weight: 500;
            background: var(--surface2);
            color: var(--ink2);
            white-space: nowrap;
            line-height: 1.7;
        }

        .chip.ok {
            background: var(--ok-soft);
            color: var(--ok);
        }

        .chip.warn {
            background: var(--warn-soft);
            color: var(--warn);
        }

        .chip.bad {
            background: var(--bad-soft);
            color: var(--bad);
        }

        .chip.acc {
            background: var(--accent-soft);
            color: var(--accent);
        }

        .chip.line {
            background: none;
            border: 1px solid var(--line);
        }

        .muted {
            color: var(--ink2);
        }

        .faint {
            color: var(--ink3);
        }

        .sm {
            font-size: 12.5px;
        }

        /* ==========================================================================
       统计横幅指标卡片 (升级为独立卡片流式布局与漏斗感)
       ========================================================================== */
        .strip {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 14px;
            margin-bottom: 22px;
            background: none;
            border: 0;
            overflow: visible;
        }

        .strip>div {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 18px 20px;
            box-shadow: var(--shadow);
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform .2s cubic-bezier(0.23, 1, 0.32, 1),
                box-shadow .2s cubic-bezier(0.23, 1, 0.32, 1),
                border-color .2s ease;
            position: relative;
            overflow: hidden;
        }

        .strip>div:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
            border-color: color-mix(in srgb, var(--accent) 35%, var(--line));
        }

        .strip small {
            display: block;
            color: var(--ink3);
            font-size: 12px;
            font-weight: 500;
            letter-spacing: .02em;
            margin-bottom: 4px;
        }

        .strip b {
            font: 700 26px/1.2 var(--body);
            font-variant-numeric: tabular-nums;
            color: var(--ink);
        }

        .strip em {
            font-style: normal;
            font-size: 12px;
            color: var(--ink3);
            margin-left: 5px;
            font-weight: normal;
        }

        .strip .strip-sub {
            font-size: 11.5px;
            color: var(--ink3);
            margin-top: 4px;
        }

        /* ==========================================================================
       匹配网格与两栏工作台布局 (Match Grid & Case Workspace)
       架构：左侧多案件卡片竖排流 (Case Picker) + 右侧案件看板与推荐列表 (Match Workspace)
       ========================================================================== */
        .match-grid {
            display: grid;
            grid-template-columns: 310px minmax(0, 1fr);
            gap: 20px;
            align-items: start;
        }

        @media (max-width: 1080px) {
            .match-grid {
                grid-template-columns: 1fr;
            }
        }

        /* ---------- 左侧多案件卡片竖排选择器 ---------- */
        .case-picker-panel {
            display: flex;
            flex-direction: column;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 14px;
            box-shadow: var(--shadow);
            position: sticky;
            top: 18px;
            max-height: calc(100vh - 36px);
            max-height: calc(100dvh - 36px);
            overflow: hidden;
        }

        .case-picker-head {
            padding: 16px 18px 12px;
            border-bottom: 1px solid var(--line);
            background: var(--surface);
            flex-shrink: 0;
        }

        .case-picker-sub {
            font-size: 12px;
            color: var(--ink3);
            margin-top: 3px;
        }

        .case-picker-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 12px 14px;
            overflow-y: auto;
            flex: 1;
        }

        /* 竖排单个案件卡片 */
        .case-card {
            padding: 13px 14px;
            border-radius: 12px;
            border: 1px solid var(--line);
            background: var(--surface);
            cursor: pointer;
            transition: border-color .18s ease, background .18s ease, transform .18s ease, box-shadow .18s ease;
            position: relative;
            text-align: left;
            user-select: none;
        }

        .case-card:hover {
            border-color: color-mix(in srgb, var(--accent) 40%, var(--line));
            background: color-mix(in srgb, var(--surface) 96%, var(--accent-soft));
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(17, 26, 51, .05);
        }

        .case-card.active {
            border-color: var(--accent);
            background: color-mix(in srgb, var(--accent-soft) 42%, var(--surface));
            box-shadow: 0 0 0 1px var(--accent), 0 4px 16px color-mix(in srgb, var(--accent) 18%, transparent);
        }

        .case-card.active::before {
            content: "";
            position: absolute;
            left: 0;
            top: 10px;
            bottom: 10px;
            width: 3.5px;
            border-radius: 0 3px 3px 0;
            background: var(--accent);
        }

        .case-card-head {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 5px;
        }

        .case-card-title {
            font-size: 13.5px;
            font-weight: 700;
            color: var(--ink);
            line-height: 1.4;
            margin: 0;
            word-break: break-word;
        }

        .case-card-meta {
            font-size: 12px;
            color: var(--ink3);
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 5px;
        }

        .case-card-extra {
            font-size: 11.5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 7px;
        }

        .case-card-price {
            font-weight: 600;
            color: var(--accent);
        }

        .case-card-date {
            color: var(--ink3);
            font-variant-numeric: tabular-nums;
        }

        .case-card-conds {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        .chip-cond {
            display: inline-block;
            padding: 2px 7px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 500;
            background: var(--surface2);
            color: var(--ink2);
            border: 1px solid var(--line);
        }

        .case-card.active .chip-cond {
            background: var(--surface);
            border-color: color-mix(in srgb, var(--accent) 30%, var(--line));
            color: var(--accent);
            font-weight: 600;
        }

        /* ---------- 右侧案件匹配工作台 ---------- */
        .match-workspace {
            display: flex;
            flex-direction: column;
            gap: 16px;
            min-width: 0;
        }

        /* 手机端当前案件切换条（桌面隐藏，App 式单手操作入口） */
        .mobile-case-switch {
            display: none;
        }

        /* 案件切换底部面板内的搜索与列表 */
        .case-sheet-search {
            position: relative;
            width: 100%;
        }

        .case-sheet-search .field {
            width: 100%;
            padding-left: 38px;
        }

        .case-sheet-search .ico-svg {
            position: absolute;
            left: 13px;
            top: 50%;
            width: 16px;
            height: 16px;
            transform: translateY(-50%);
            color: var(--ink3);
            pointer-events: none;
        }

        .case-sheet-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 2px 0 8px;
        }

        .case-sheet-empty {
            padding: 28px 12px;
            text-align: center;
            color: var(--ink3);
            font-size: 13px;
        }

        /* 案件看板头部卡片 */
        .match-case-card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 18px 20px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .match-case-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 14px;
            flex-wrap: wrap;
        }

        .match-case-info h2 {
            font: 700 19px/1.3 var(--display);
            color: var(--ink);
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .match-case-metas {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 12.5px;
            color: var(--ink3);
            flex-wrap: wrap;
        }

        .match-case-metas span {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .match-case-metas b {
            color: var(--ink);
            font-weight: 600;
        }

        /* 硬性门槛与加分项徽章行 */
        .criteria-chips-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            padding-top: 0;
            border-top: 0;
        }

        .crit-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 8px;
            background: var(--surface2);
            border: 1px solid var(--line);
            font-size: 12px;
            color: var(--ink2);
        }

        .crit-badge b {
            color: var(--ink);
            font-weight: 600;
        }

        .crit-lock {
            font-size: 10.5px;
            font-weight: 600;
            color: #334155;
            background: color-mix(in srgb, #334155 8%, var(--surface));
            border: 1px solid color-mix(in srgb, #334155 22%, transparent);
            padding: 1px 5px;
            border-radius: 4px;
        }

        .crit-soft {
            font-size: 10.5px;
            font-weight: 600;
            color: var(--accent);
            background: var(--accent-soft);
            padding: 1px 5px;
            border-radius: 4px;
        }

        /* 案件条件区：标题 + 权重入口，移动端替代整块重复的案件信息 */
        .criteria-block {
            display: flex;
            flex-direction: column;
            gap: 7px;
            padding-top: 10px;
            border-top: 1px dashed var(--line);
        }

        .criteria-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .criteria-head-label {
            font-size: 11.5px;
            font-weight: 600;
            color: var(--ink3);
            letter-spacing: .04em;
        }

        .criteria-head .btn {
            flex: none;
        }

        /* 候选人状态徽章内的“更新提案日”小型图标按钮 */
        .chip-act {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 26px;
            margin: -2px -4px -2px 1px;
            padding: 0;
            border: 0;
            border-radius: 6px;
            background: transparent;
            color: inherit;
            cursor: pointer;
            opacity: .75;
        }

        .chip-act:hover {
            background: color-mix(in srgb, currentColor 12%, transparent);
            opacity: 1;
        }

        .chip-act svg {
            width: 12px;
            height: 12px;
        }

        .btn.ghost.danger-text {
            color: var(--bad);
        }

        .btn.ghost.danger-text:hover {
            background: var(--bad-soft);
            color: var(--bad);
        }

        /* 精炼轻量权重指示条（绝非主体，仅横排微进度指示） */
        .weights-compact {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 9px 14px;
            border-radius: 10px;
            background: var(--surface2);
            border: 1px solid var(--line);
            flex-wrap: wrap;
        }

        .weights-compact-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--ink3);
            display: inline-flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
        }

        .weights-bars-wrap {
            display: flex;
            align-items: center;
            gap: 14px;
            flex: 1;
            flex-wrap: wrap;
        }

        .w-bar-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
        }

        .w-bar-item .w-name {
            color: var(--ink2);
            font-weight: 500;
        }

        .w-bar-item .w-val {
            font-family: var(--mono);
            font-weight: 700;
            color: var(--accent);
        }

        .w-mini-track {
            width: 44px;
            height: 5px;
            border-radius: 99px;
            background: var(--line);
            overflow: hidden;
        }

        .w-mini-track i {
            display: block;
            height: 100%;
            border-radius: 99px;
            background: var(--accent);
        }

        .weights-total-badge {
            margin-left: auto;
            font-size: 11.5px;
            font-family: var(--mono);
            padding: 3px 8px;
            border-radius: 6px;
            background: var(--surface);
            border: 1px solid var(--line);
            color: var(--ok);
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }

        .weights-total-badge.warn {
            color: var(--warn);
            background: var(--warn-soft);
            border-color: transparent;
        }

        /* ---------- 评分权重配置模态弹窗系统 ---------- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(17, 26, 51, .48);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: none;
            place-items: center;
            z-index: 200;
            padding: 20px;
        }

        .modal-overlay.show {
            display: grid;
        }

        .modal-dialog {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 16px;
            width: 100%;
            max-width: 520px;
            max-height: 88vh;
            max-height: 88dvh;
            box-shadow: 0 20px 50px rgba(17, 26, 51, .28);
            display: flex;
            flex-direction: column;
            animation: modalPop .2s cubic-bezier(0.23, 1, 0.32, 1);
            overflow: hidden;
        }

        @keyframes modalPop {
            from {
                opacity: 0;
                transform: scale(.96) translateY(8px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        .modal-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid var(--line);
            background: var(--surface);
        }

        .modal-head h3 {
            font-size: 15.5px;
            font-weight: 700;
            color: var(--ink);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .modal-body {
            padding: 20px;
            overflow-y: auto;
            max-height: calc(88vh - 125px);
        }

        .modal-weight-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .modal-weight-item {
            padding: 11px 0;
            border-bottom: 1px solid var(--line);
        }

        .modal-weight-item:last-child {
            border-bottom: none;
        }

        /* 滑块 + 数值输入：手机端可直接键入精确权重 */
        .w-control {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 72px;
            align-items: center;
            gap: 12px;
            margin-top: 4px;
        }

        .w-control input[type=range] {
            margin: 0;
        }

        .w-num {
            width: 100%;
            text-align: center;
            font-variant-numeric: tabular-nums;
            padding: 7px 8px;
            font-weight: 600;
        }

        .modal-close {
            width: 40px;
            height: 40px;
            padding: 0;
            flex: none;
        }

        .modal-foot {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 10px;
            padding: 14px 20px;
            border-top: 1px solid var(--line);
            background: var(--surface2);
        }

        /* 通用确认弹窗：叠放于抽屉/权重弹窗之上，用于未保存内容守卫 */
        #confirmModal {
            z-index: 230;
        }

        .confirm-dialog {
            max-width: 420px;
        }

        .confirm-body {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 20px;
        }

        .confirm-icon {
            width: 38px;
            height: 38px;
            border-radius: 11px;
            flex: none;
            display: grid;
            place-items: center;
            background: var(--warn-soft);
            color: var(--warn);
        }

        .confirm-icon svg {
            width: 19px;
            height: 19px;
        }

        .confirm-text {
            font-size: 13.5px;
            color: var(--ink2);
            line-height: 1.7;
            min-width: 0;
        }

        .confirm-text b {
            display: block;
            font-size: 14.5px;
            color: var(--ink);
            margin-bottom: 3px;
        }

        .cond {
            display: grid;
            gap: 8px;
            padding: 13px 0;
            border-top: 1px solid var(--line);
        }

        .cond-top {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .cond-top b {
            font-weight: 700;
        }

        /* 权重胶囊徽标 */
        .cond-top .w {
            margin-left: auto;
            font: 700 12.5px/1 var(--mono);
            color: var(--accent);
            background: var(--accent-soft);
            padding: 3px 9px;
            border-radius: 99px;
            border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent);
        }

        /* 自定义现代化高质感 Range 滑块 */
        input[type=range] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            background: var(--surface2);
            border-radius: 99px;
            outline: none;
            margin: 8px 0 4px;
            border: 1px solid var(--line);
            cursor: pointer;
            transition: background .15s ease, border-color .15s ease;
        }

        input[type=range]:hover {
            background: color-mix(in srgb, var(--surface2) 80%, var(--accent-soft));
            border-color: color-mix(in srgb, var(--accent) 30%, var(--line));
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #FFFFFF;
            border: 3.5px solid var(--accent);
            box-shadow: 0 1px 4px rgba(17, 26, 51, .2);
            cursor: pointer;
            transition: transform .16s cubic-bezier(0.23, 1, 0.32, 1),
                box-shadow .16s ease;
        }

        input[type=range]:active::-webkit-slider-thumb {
            transform: scale(1.22);
            box-shadow: 0 0 0 5px var(--accent-soft), 0 2px 8px rgba(17, 26, 51, .25);
        }

        input[type=range]::-moz-range-track {
            width: 100%;
            height: 6px;
            background: var(--surface2);
            border-radius: 99px;
            border: 1px solid var(--line);
        }

        input[type=range]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #FFFFFF;
            border: 3.5px solid var(--accent);
            box-shadow: 0 1px 4px rgba(17, 26, 51, .2);
            cursor: pointer;
            transition: transform .16s cubic-bezier(0.23, 1, 0.32, 1),
                box-shadow .16s ease;
        }

        input[type=range]:active::-moz-range-thumb {
            transform: scale(1.22);
            box-shadow: 0 0 0 5px var(--accent-soft), 0 2px 8px rgba(17, 26, 51, .25);
        }

        .wsum {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            border-radius: 10px;
            background: var(--surface2);
            border: 1px solid var(--line);
            margin-top: 8px;
            font-size: 13px;
        }

        .wsum.bad {
            background: var(--bad-soft);
            border-color: color-mix(in srgb, var(--bad) 30%, transparent);
            color: var(--bad);
        }

        .hint {
            font-size: 12.5px;
            color: var(--ink3);
        }

        /* ==========================================================================
       候选人匹配卡片列表 (Candidate Cards)
       ========================================================================== */
        .cands {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .cand {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 14px;
            box-shadow: var(--shadow);
            overflow: hidden;
            transition: transform .2s cubic-bezier(0.23, 1, 0.32, 1),
                box-shadow .2s cubic-bezier(0.23, 1, 0.32, 1),
                border-color .2s ease;
        }

        .cand:hover {
            border-color: color-mix(in srgb, var(--accent) 35%, var(--line));
            box-shadow: var(--shadow-lg);
            transform: translateY(-2px);
        }

        .cand-main {
            display: grid;
            grid-template-columns: 48px minmax(0, 1fr) 140px 145px;
            gap: 18px;
            padding: 18px 20px;
            align-items: center;
        }

        /* 排名勋章 Badge：沿用同一套蓝色/绿色渐变，减少金属拟物感 */
        .rank-badge {
            width: 42px;
            height: 42px;
            border-radius: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            font: 800 18px/1 var(--body);
            font-variant-numeric: tabular-nums;
            user-select: none;
            flex-shrink: 0;
        }

        .rank-badge.rank-1 {
            background: linear-gradient(135deg, #3568EE, #7AA2FF);
            color: #fff;
            border: 0;
            box-shadow: 0 3px 10px var(--accent-shadow);
        }

        .rank-badge.rank-2 {
            background: linear-gradient(135deg, #1F9D6B, #4FD1A0);
            color: #fff;
            border: 0;
            box-shadow: 0 3px 10px rgba(31, 157, 107, .22);
        }

        .rank-badge.rank-3 {
            background: var(--surface2);
            color: var(--ink2);
            border: 1px solid var(--line);
            box-shadow: none;
        }

        .rank-badge.rank-n {
            background: var(--surface2);
            color: var(--ink3);
            border: 1px solid var(--line);
            font-size: 15px;
            font-weight: 700;
        }

        .who {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 0;
        }

        .who-top {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .who-top b {
            font: 700 17px/1.3 var(--body);
            color: var(--ink);
            letter-spacing: -.01em;
        }

        .sk {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .sk .chip {
            font-family: var(--body);
            font-size: 12px;
            padding: 3px 8px;
            border-radius: 6px;
        }

        .sk .chip i {
            font: normal 600 11px var(--mono);
            opacity: .85;
            margin-left: 2px;
        }

        .sk .full {
            background: var(--accent-soft);
            color: var(--accent);
            border: 1px solid color-mix(in srgb, var(--accent) 20%, transparent);
        }

        .sk .part {
            background: var(--warn-soft);
            color: var(--warn);
            border: 1px solid color-mix(in srgb, var(--warn) 20%, transparent);
        }

        .sk .none {
            background: none;
            border: 1px dashed var(--line);
            color: var(--ink3);
            text-decoration: line-through;
        }

        /* 得分展示区与高质感渐变进度条 */
        .score {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            text-align: right;
        }

        .score-row {
            display: flex;
            align-items: baseline;
            gap: 3px;
        }

        .score b {
            font: 800 32px/1 var(--body);
            font-variant-numeric: tabular-nums;
            letter-spacing: -.02em;
            color: var(--ink);
        }

        .score.score-perfect b {
            color: var(--accent);
        }

        .score.score-high b {
            color: var(--accent);
        }

        .score small {
            color: var(--ink3);
            font-size: 12px;
            font-weight: 500;
        }

        .bar {
            width: 100%;
            height: 7px;
            background: var(--surface2);
            border-radius: 99px;
            margin-top: 8px;
            overflow: hidden;
            border: 1px solid color-mix(in srgb, var(--line) 60%, transparent);
        }

        .bar i {
            display: block;
            height: 100%;
            background: linear-gradient(90deg, var(--accent) 0%, #4FACFE 100%);
            border-radius: 99px;
            transition: width .35s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .score-tag {
            font-size: 11px;
            font-weight: 600;
            color: var(--ink3);
            margin-top: 4px;
            letter-spacing: .02em;
        }

        /* 环形匹配分：更接近控制台 Demo 的评分表达 */
        .score-cell {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .score-ring {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            position: relative;
            flex: none;
        }

        .score-ring svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .score-ring .num {
            position: relative;
            z-index: 1;
            font: 700 13px/1 var(--body);
            letter-spacing: -.03em;
            color: var(--ink);
        }

        .score-ring .ring-track {
            fill: none;
            stroke: var(--surface2);
            stroke-width: 4;
        }

        .score-ring .ring-value {
            fill: none;
            stroke: var(--accent);
            stroke-width: 4;
            stroke-linecap: round;
            transition: stroke-dasharray .35s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .score-ring.tone-ok .ring-value {
            stroke: var(--ok);
        }

        .score-ring.tone-warn .ring-value {
            stroke: var(--warn);
        }

        .score-ring.tone-neutral .ring-value {
            stroke: var(--ink3);
        }

        .score-cell-meta {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }

        .score-cell-meta b {
            font-size: 12px;
            font-weight: 650;
            color: var(--ink);
            white-space: nowrap;
        }

        .score-cell-meta span {
            font-size: 11.5px;
            color: var(--ink3);
            white-space: nowrap;
        }

        .acts {
            display: flex;
            flex-direction: column;
            gap: 7px;
            align-items: stretch;
        }

        .acts .btn {
            width: 100%;
        }

        /* 算法解释可解释表 */
        .explain {
            border-top: 1px solid var(--line);
            background: color-mix(in srgb, var(--surface2) 55%, var(--surface));
            padding: 16px 20px;
            display: grid;
            gap: 16px;
        }

        .explain h3 {
            font: 700 13px var(--body);
            letter-spacing: .06em;
            color: var(--ink2);
            margin-bottom: 8px;
        }

        .tbl-wrap {
            overflow-x: auto;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: var(--surface);
        }

        table {
            border-collapse: collapse;
            width: 100%;
            font-size: 13px;
        }

        th,
        td {
            padding: 10px 13px;
            text-align: left;
            border-bottom: 1px solid var(--line);
            white-space: nowrap;
        }

        th {
            font-weight: 600;
            color: var(--ink3);
            font-size: 11.5px;
            letter-spacing: .04em;
            background: color-mix(in srgb, var(--surface2) 55%, var(--surface));
        }

        tbody tr {
            transition: background .12s ease;
        }

        tbody tr:hover {
            background: color-mix(in srgb, var(--accent-soft) 26%, var(--surface));
        }

        tr:last-child td {
            border-bottom: 0;
        }

        /* 表格合计行（如综合匹配分）加粗强调 */
        .sum-row td {
            font-weight: 700;
        }

        td.r,
        th.r {
            text-align: right;
            font-family: var(--mono);
        }

        .pending-box {
            background: var(--warn-soft);
            color: var(--warn);
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 13px;
        }

        .disc {
            font-size: 12px;
            color: var(--ink3);
        }

        /* 匹配工作台时间快速过滤栏 */
        .match-time-filter-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 16px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 10px;
            margin-bottom: 14px;
            flex-wrap: wrap;
        }

        .time-filter-toggle {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            color: var(--ink);
            user-select: none;
        }

        .time-filter-toggle input[type="checkbox"] {
            cursor: pointer;
            accent-color: var(--accent);
            width: 16px;
            height: 16px;
        }

        .filtered {
            border: 1px dashed var(--line);
            border-radius: 14px;
            background: color-mix(in srgb, var(--surface2) 30%, transparent);
            transition: background .2s ease;
        }

        .filtered:hover {
            background: color-mix(in srgb, var(--surface2) 50%, transparent);
        }

        .filtered summary {
            cursor: pointer;
            padding: 14px 18px;
            color: var(--ink2);
            list-style: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            user-select: none;
        }

        .filtered summary::-webkit-details-marker {
            display: none;
        }

        .filtered ul {
            list-style: none;
            margin: 0;
            padding: 0 18px 16px;
            display: grid;
            gap: 10px;
        }

        .filtered li {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
            border-top: 1px solid var(--line);
            padding-top: 10px;
        }

        .filtered li b {
            min-width: 5.5em;
            font-size: 14px;
            color: var(--ink);
        }

        .filtered-reasons {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .chip-out {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 8px;
            border-radius: 6px;
            background: var(--bad-soft);
            color: var(--bad);
            font-size: 12px;
            font-family: var(--mono);
            border: 1px solid color-mix(in srgb, var(--bad) 25%, transparent);
        }

        /* 卡片排版 */
        /* min-width:0 逐层打断 min-content 传导：完整履历里的宽表格不会再撑破画布 */
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 18px;
            min-width: 0;
            width: 100%;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 18px 20px;
            display: flex;
            flex-direction: column;
            gap: 13px;
            cursor: pointer;
            box-shadow: var(--shadow);
            text-align: left;
            min-width: 0;
            position: relative;
            transition: border-color .18s cubic-bezier(0.23, 1, 0.32, 1),
                box-shadow .18s cubic-bezier(0.23, 1, 0.32, 1),
                transform .18s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .card:hover {
            border-color: color-mix(in srgb, var(--accent) 40%, var(--line));
            box-shadow: var(--shadow-lg);
            transform: translateY(-2px);
        }

        .card:active {
            transform: translateY(0) scale(0.995);
        }

        .card h3 {
            font: 700 17px/1.35 var(--display);
            letter-spacing: .02em;
        }

        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            font: 700 18px/1 var(--display);
            flex: none;
            transition: transform .18s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .card:hover .avatar {
            transform: scale(1.05);
        }

        .card-top {
            display: flex;
            gap: 13px;
            align-items: center;
        }

        /* 技术者姓名 + 角色/学历摘要行：桌面左右分布，手机允许换行 */
        .card-title-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 8px;
        }

        /* 技能标签专精与更多提示 */
        .sk .chip.expert {
            background: color-mix(in srgb, var(--accent) 14%, var(--surface));
            border: 1px solid color-mix(in srgb, var(--accent) 32%, transparent);
            color: var(--accent);
            font-weight: 600;
        }

        .sk .chip.more-tech {
            background: var(--surface2);
            border: 1px dashed var(--line);
            cursor: help;
        }

        .card-foot {
            margin-top: auto;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 8px 10px;
            color: var(--ink3);
            font-size: 12px;
            border-top: 1px solid var(--line);
            padding-top: 12px;
            min-width: 0;
        }

        .card-foot .card-actions {
            margin-left: auto;
        }

        .card-src {
            display: flex;
            align-items: center;
            gap: 6px;
            min-width: 0;
            flex: 1;
            overflow: hidden;
            font-size: 11.5px;
            color: var(--ink3);
        }

        .card-src svg {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
            color: var(--ink3);
        }

        .card-src-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 150px;
        }

        .card-src-tag {
            font-size: 10.5px;
            background: var(--surface2);
            padding: 1px 6px;
            border-radius: 4px;
            flex-shrink: 0;
            color: var(--ink2);
        }

        .card-actions {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-shrink: 0;
        }

        .card-toggle-btn {
            font-size: 12px;
            padding: 5px 10px;
            gap: 5px;
            font-weight: 500;
        }

        .card-edit-btn {
            font-size: 12px;
            padding: 5px 10px;
            gap: 5px;
            font-weight: 500;
        }

        .kv {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 4px 14px;
            font-size: 13px;
        }

        .kv span:nth-child(odd) {
            color: var(--ink3);
        }

        .kv span:nth-child(even) {
            text-align: right;
            overflow-wrap: anywhere;
        }

        /* ==========================================================================
       案件管理卡片专属设计系统 (Case Cards)
       ========================================================================== */
        .case-card {
            display: flex;
            flex-direction: column;
            gap: 13px;
            position: relative;
        }

        .case-card .case-head {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            align-items: flex-start;
        }

        .case-card .case-head h3 {
            font: 700 17px/1.35 var(--display);
            letter-spacing: .02em;
            margin: 0;
            color: var(--ink);
        }

        .case-price-badge {
            font-family: var(--mono);
            font-size: 13px;
            font-weight: 700;
            color: var(--accent);
            background: color-mix(in srgb, var(--accent) 10%, var(--surface));
            border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent);
            border-radius: 6px;
            padding: 2px 7px;
            letter-spacing: -.02em;
            white-space: nowrap;
            justify-self: end;
            width: fit-content;
            display: inline-flex;
            align-items: center;
        }

        /* 硬性门槛规范化专业标签（中性深灰，条件必须与蓝色加分项形成明确区分） */
        .chip.req {
            background: color-mix(in srgb, #334155 8%, var(--surface));
            color: #334155;
            border: 1px solid color-mix(in srgb, #334155 26%, transparent);
            font-weight: 600;
            gap: 4px;
        }

        .chip.req svg {
            width: 11px;
            height: 11px;
            color: #334155;
            vertical-align: -1px;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) .chip.req {
                background: color-mix(in srgb, #CBD5E1 12%, var(--surface));
                color: #CBD5E1;
                border-color: color-mix(in srgb, #CBD5E1 32%, transparent);
            }

            :root:not([data-theme="light"]) .chip.req svg {
                color: #CBD5E1;
            }

            :root:not([data-theme="light"]) .crit-lock {
                color: #CBD5E1;
                background: color-mix(in srgb, #CBD5E1 12%, var(--surface));
                border-color: color-mix(in srgb, #CBD5E1 30%, transparent);
            }
        }

        :root[data-theme="dark"] .chip.req {
            background: color-mix(in srgb, #CBD5E1 12%, var(--surface));
            color: #CBD5E1;
            border-color: color-mix(in srgb, #CBD5E1 32%, transparent);
        }

        :root[data-theme="dark"] .chip.req svg {
            color: #CBD5E1;
        }

        :root[data-theme="dark"] .crit-lock {
            color: #CBD5E1;
            background: color-mix(in srgb, #CBD5E1 12%, var(--surface));
            border-color: color-mix(in srgb, #CBD5E1 30%, transparent);
        }

        .case-match-btn {
            font-weight: 600;
            box-shadow: 0 4px 14px var(--accent-shadow);
        }

        /* ==========================================================================
       推荐记录专属设计系统 (Recommendations Tracker)
       ========================================================================== */
        .rec-strip {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .rec-stat-card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            box-shadow: var(--shadow);
            transition: transform .18s cubic-bezier(0.23, 1, 0.32, 1),
                box-shadow .18s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .rec-stat-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .rec-stat-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--ink3);
            font-size: 12.5px;
            font-weight: 500;
        }

        .rec-stat-val {
            font: 700 28px/1.1 var(--mono);
            color: var(--ink);
            letter-spacing: -.02em;
        }

        .rec-stat-desc {
            font-size: 11.5px;
            color: var(--ink3);
        }

        .rec-tech-cell {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }

        .rec-avatar-sm {
            width: 32px;
            height: 32px;
            border-radius: 9px;
            display: grid;
            place-items: center;
            font: 700 14px/1 var(--display);
            flex-shrink: 0;
        }

        .rec-case-cell {
            display: flex;
            flex-direction: column;
            gap: 3px;
            min-width: 0;
        }

        .rec-case-title {
            font-weight: 600;
            color: var(--ink);
        }

        .rec-case-sub {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11.5px;
            color: var(--ink3);
        }

        /* 抽屉编辑组件 (Drawer) */
        .scrim {
            position: fixed;
            inset: 0;
            /* 覆盖 scrollbar-gutter 预留区，避免窄桌面窗口下右侧出现一条未变暗的窄缝 */
            right: calc(-1 * var(--sbw, 0px));
            background: rgba(6, 10, 24, .5);
            backdrop-filter: blur(2px);
            z-index: 40;
            opacity: 0;
            pointer-events: none;
            transition: opacity .2s;
        }

        .scrim.on {
            opacity: 1;
            pointer-events: auto;
        }

        .drawer {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            width: min(600px, 100%);
            background: var(--surface);
            z-index: 41;
            transform: translateX(102%);
            transition: transform .25s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
            border-left: 1px solid var(--line);
            box-shadow: var(--shadow-lg);
            padding-top: env(safe-area-inset-top, 0px);
            height: 100vh;
            height: 100dvh;
        }

        .drawer.on {
            transform: none;
        }

        .dr-h {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px max(20px, env(safe-area-inset-right, 0px)) 14px 22px;
            border-bottom: 1px solid var(--line);
        }

        .dr-h h2 {
            font: 700 20px var(--display);
        }

        .dr-b {
            flex: 1;
            overflow: auto;
            padding: 20px max(20px, env(safe-area-inset-right, 0px)) 20px 22px;
            display: grid;
            gap: 18px;
            align-content: start;
        }

        .dr-f {
            display: flex;
            gap: 10px;
            justify-content: space-between;
            padding: 14px max(20px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) 22px;
            border-top: 1px solid var(--line);
            flex-wrap: wrap;
            background: var(--surface);
        }

        .lbl {
            display: grid;
            gap: 6px;
            font-size: 13px;
            color: var(--ink2);
            min-width: 0;
        }

        .lbl .field,
        .lbl .sel {
            width: 100%;
            color: var(--ink);
        }

        .grid2 {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 14px;
        }

        .rows {
            display: grid;
            gap: 8px;
        }

        .row {
            display: grid;
            grid-template-columns: minmax(0, 1.6fr) 80px minmax(0, 1fr) 34px;
            gap: 8px;
            align-items: center;
        }

        .row.case {
            grid-template-columns: minmax(0, 1.5fr) 70px 64px 70px 34px;
        }

        /* 桌面端沿用表头；手机端显示每个控件上方的微型字段标签 */
        .mini-field {
            display: contents;
        }

        .mini-lbl {
            display: none;
        }

        .row .field,
        .row .sel {
            padding: 7px 9px;
            width: 100%;
        }

        .rowhead {
            font-size: 12px;
            color: var(--ink3);
            display: grid;
            grid-template-columns: minmax(0, 1.6fr) 80px minmax(0, 1fr) 34px;
            gap: 8px;
        }

        .rowhead.case {
            grid-template-columns: minmax(0, 1.5fr) 70px 64px 70px 34px;
        }

        .x {
            border: 0;
            background: none;
            color: var(--ink3);
            cursor: pointer;
            border-radius: 8px;
            height: 34px;
        }

        .x:hover {
            background: var(--bad-soft);
            color: var(--bad);
        }

        .err {
            color: var(--bad);
            font-size: 12.5px;
            display: grid;
            gap: 2px;
        }

        /* 无校验错误时不占位（避免抽屉里出现多余空行） */
        .err:empty {
            display: none;
        }

        .callout {
            display: flex;
            gap: 12px;
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 13px;
            background: var(--warn-soft);
            color: var(--warn);
        }

        .callout.info {
            background: var(--accent-soft);
            color: var(--accent);
        }

        .callout.bad {
            background: var(--bad-soft);
            color: var(--bad);
        }

        .callout svg {
            width: 18px;
            height: 18px;
            flex: none;
            margin-top: 2px;
        }

        /* 导入流程组件 */
        .steps {
            display: flex;
            gap: 0;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: var(--surface);
            overflow: hidden;
        }

        .steps div {
            flex: 1;
            padding: 12px 16px;
            display: flex;
            gap: 10px;
            align-items: center;
            color: var(--ink3);
            border-left: 1px solid var(--line);
            min-width: 0;
        }

        .steps div:first-child {
            border-left: 0;
        }

        .steps b {
            display: grid;
            place-items: center;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 1px solid var(--line);
            font: 500 12px var(--mono);
            flex: none;
        }

        .steps .on {
            color: var(--ink);
            background: var(--accent-soft);
            font-weight: 600;
        }

        .steps .on b {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--accent-ink);
        }

        .steps .done b {
            background: var(--ok);
            border-color: var(--ok);
            color: #fff;
        }

        .drop {
            border: 2px dashed var(--line);
            border-radius: 16px;
            padding: 50px 24px;
            display: grid;
            gap: 12px;
            place-items: center;
            text-align: center;
            background: var(--surface);
            cursor: pointer;
            transition: all .2s ease;
        }

        .drop:hover,
        .drop.over {
            border-color: var(--accent);
            background: var(--accent-soft);
        }

        .drop svg {
            width: 44px;
            height: 44px;
            color: var(--accent);
        }

        .pf {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 320px);
            gap: 22px;
            align-items: start;
        }

        .pf-row {
            display: grid;
            grid-template-columns: minmax(0, 1.4fr) 90px minmax(0, 1.6fr);
            gap: 10px;
            align-items: center;
            padding: 9px 0;
            border-top: 1px solid var(--line);
        }

        .pf-row:first-child {
            border-top: 0;
        }

        .pf-row .field,
        .pf-row .sel {
            width: 100%;
            padding: 6px 9px;
        }

        .pf-row small {
            color: var(--ink3);
            font-size: 12px;
            line-height: 1.4;
        }

        .pf-row.q .field,
        .pf-row.q .sel {
            border-color: var(--warn);
            background: var(--warn-soft);
        }

        /* 总览看板专属布局 */
        .overview-grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 22px;
        }

        .todo-item {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 14px;
            padding: 12px 14px;
            border: 1px solid var(--line);
            border-radius: 10px;
            margin-bottom: 8px;
            background: var(--surface);
            transition: border-color .15s;
        }

        .todo-item:hover {
            border-color: var(--accent);
        }

        .todo-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
        }

        .todo-info b {
            font-size: 14px;
        }

        @media (max-width: 1060px) {

            .main {
                padding: max(12px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) calc(76px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));

            }

                bottom: calc(68px + env(safe-area-inset-bottom, 0px));
            }

                align-items: stretch;
                gap: 8px 12px;
            }

            .page-head h1 {
                font-size: 20px;
            }

            .tools {
                width: 100%;
                gap: 6px;
            }

            /* 筛选组在手机上各占一行：标题固定、胶囊横向滑动 */
            .tool-group {
                width: 100%;
                gap: 6px;
            }

            .tool-group .seg {
                flex: 1;
                min-width: 0;
            }

            .tool-label {
                font-size: 11px;
                flex: none;
            }

            /* 胶囊筛选组：自身横向滚动，带有渐隐微光遮罩，提示可向右滑动 */
            .seg {
                max-width: 100%;

            }

                flex: 0 0 auto;
                white-space: nowrap;
                padding: 5px 12px;
                min-height: 38px;
                font-size: 12px;
                font-weight: 500;
                border-radius: 8px;
                transition: all .15s ease;
            }

            /* 指标卡升级为2×2网格布局 */
            .strip {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 8px;
                margin-bottom: 6px;
            }

            .score b {
                font-size: 24px;
            }

            .cand-main {
                grid-template-columns: 34px minmax(0, 1fr);
                gap: 8px 10px;
            }

            .cand-main .score-cell {

                justify-content: flex-start;
            }

            }

            .grid2 {
                grid-template-columns: minmax(0, 1fr);
            }

            .pf-row {
                grid-template-columns: minmax(0, 1fr) 80px;
            }

            .pf-row>div {
                grid-column: 1/-1;
            }

            .pf-row small {
                grid-column: 1/-1;
            }

            /* 手机端匹配页：隐藏占屏的案件选择器，改为顶部当前案件切换条 */
            .case-picker-panel {
                display: none;
            }

            .match-grid {
                display: flex;
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }

            .match-workspace {
                display: contents;
            }

            .mobile-case-switch {
                display: flex;
                align-items: center;
                gap: 10px;
                order: 0;
                position: sticky;

                z-index: 18;

                flex-direction: column;
                gap: 1px;
            }

            .mcs-label {
                font-size: 10.5px;

                color: var(--ink3);
                letter-spacing: .04em;
            }

            .mcs-topline {
                display: flex;
                align-items: center;
                gap: 6px;
                min-width: 0;
            }

            .mcs-topline .mcs-label {
                flex: none;
            }

            .mcs-topline .chip {
                flex: none;
                height: 18px;
                padding: 0 6px;

            .mcs-title {
                font-size: 14px;

        /* ---------- その他メニュー：スマホ用ハーフモーダル ---------- */

            from {
                transform: translateY(110%);
            }

            to {
                transform: translateY(0);
            }
        }

        @media (max-width: 820px) {
            .drawer.sheet {
                top: auto;
                left: 0;
                right: 0;
                bottom: 0;
                width: calc(100% + var(--sbw, 0px));

                background-repeat: no-repeat;

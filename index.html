        /**
         * 案件筛选：关键词 + 状态 + 开始月份
         * @returns {Array} 过滤后的案件数组
         */
        function caseFilterList() {
            const q = norm(S.caseQ || '');
            const sf = S.caseStatusFilter || 'すべて';
            const cmf = S.caseMonthFilter || 'すべて';
            const monthKey = monthKeyOf(cmf);
            return S.cases.filter(c => {
                const matchQ = !q || norm(c.title).includes(q) || norm(c.client).includes(q) || norm(c.location).includes(q) || c.skillConditions.some(k => norm(k.skillName).includes(q));
                const matchStatus = sf === 'すべて' || sf === '全部' || c.status === sf || (sf === '募集中' && c.status === '招募中') || (sf === '保留' && c.status === '暂停') || (sf === '終了' && c.status === '结束');
                let matchMonth = true;
                const sd = String(c.startDate || '').trim();
                if (monthKey) {
                    matchMonth = sd.startsWith(monthKey) || sd.startsWith(monthKey.replace('-', '/'));
                } else if (cmf === '2027年開始' || cmf === '2027年开始') {
                    matchMonth = sd.startsWith('2027');
                }
                return matchQ && matchStatus && matchMonth;
            });
        }

        </div>

        <div class="sk" style="min-height:56px">
          ${c.skillConditions.map(k => {
                    if (k.isHard) {
                        return `<span class="chip req" title="必須条件 / 年数要件を満たす必要あり">${ico('lock')}${esc(skillLabel(k.skillName))}${k.minYears ? ' ≥' + k.minYears + '年' : ''}</span>`;
                    }

          })()}

              ${ico('match')}

        </div>
      </article>
    `;
            }).join('')}</div>`;

         * 实时同步案件表单：权重总和、校验提示与保存按钮状态
         * 仅更新局部节点，不重建输入框，避免手机端输入法被打断
         */
        function syncCaseValidation() {
            if (!D || D.kind !== 'case') return;
            const c = D.data;
            const sum = c.skillConditions.reduce((a, k) => a + (+k.weight || 0), 0) + (+c.japaneseWeight || 0);
            const errs = caseErrors(c);

            const sumEl = $('#caseWsum');
            if (sumEl) {
                sumEl.className = 'wsum' + (sum <= 0 ? ' bad' : '');
                sumEl.innerHTML = `<span>重み合計 <b class="num">${sum}</b></span><span class="faint">推奨合計 100（任意）</span>`;
            }

            const errEl = $('#caseErrs');
            if (errEl) errEl.innerHTML = errs.map(x => '· ' + esc(x)).join('<br>');

            const btn = $('#saveCaseBtn');
            if (btn) btn.disabled = errs.length > 0;
        }

        function caseForm() {
            const c = D.data, errs = caseErrors(c);
            const sum = c.skillConditions.reduce((a, k) => a + (+k.weight || 0), 0) + (+c.japaneseWeight || 0);
            const curStatus = c.status === '招募中' ? '募集中' : (c.status === '暂停' ? '保留' : (c.status === '结束' ? '終了' : (c.status || '募集中')));
            const curJlpt = c.jlptRequirement === '不限' ? '不問' : (c.jlptRequirement || '不問');
            const curBiz = c.businessJapaneseRequirement === '不限' ? '不問' : (c.businessJapaneseRequirement === '需商务流畅' ? 'ビジネス流暢必須' : (c.businessJapaneseRequirement || '不問'));

            return `
    <div class="dr-b">
      <label class="lbl">案件名 *<input class="field" data-b="title" value="${esc(c.title)}"></label>
      <div class="grid2">
        <label class="lbl">クライアント / 担当者<input class="field" data-b="client" value="${esc(c.client)}"></label>
        <label class="lbl">勤務地<input class="field" data-b="location" value="${esc(c.location)}"></label>
        <label class="lbl">案件単価 / 予算（円/月、テキスト）<input class="field" data-b="unitPriceText" value="${esc(c.unitPriceText)}"></label>
        <label class="lbl">開始予定日<input class="field" type="date" data-b="startDate" value="${esc(c.startDate)}"></label>
      </div>
      <label class="lbl">案件ステータス<select class="sel" data-b="status">${opts(['募集中', '保留', '終了'], curStatus)}</select></label>
      <div>
        <div class="form-row" style="margin-bottom:8px">
          <b>スキル要件一覧</b>
          <button class="btn sm" data-act="addCond">${ico('plus')}スキル追加</button>
        </div>
        <div class="rows">
          <div class="rowhead case"><span>スキル名</span><span>最低年数</span><span>必須</span><span>重み</span><span></span></div>
          ${c.skillConditions.map((k, i) => `
            <div class="row case">
              <label class="mini-field mf-kn"><span class="mini-lbl">スキル名</span><input class="field" data-b="kn" data-i="${i}" value="${esc(k.skillName)}" aria-label="スキル名" placeholder="スキル名"></label>
              <label class="mini-field mf-km"><span class="mini-lbl">最低年数</span><input class="field num" type="number" inputmode="decimal" min="0" step="0.5" data-b="km" data-i="${i}" value="${k.minYears ?? ''}" aria-label="最低年数" placeholder="最低年数"></label>
              <label class="mf-kh" style="display:flex;gap:6px;align-items:center"><input type="checkbox" data-b="kh" data-i="${i}" ${k.isHard ? 'checked' : ''}>必須</label>
              <label class="mini-field mf-kw"><span class="mini-lbl">重み</span><input class="field num" type="number" inputmode="decimal" min="0" data-b="kw" data-i="${i}" value="${k.weight}" aria-label="重み" placeholder="重み"></label>
              <button class="x" data-act="delCond" data-i="${i}" aria-label="削除">${ico('x')}</button>
            </div>
          `).join('')}
        </div>
      </div>
      <div class="grid2">
        <label class="lbl">最低 JLPT 要件<select class="sel" data-b="jlptRequirement">${opts(['不問', 'N5', 'N4', 'N3', 'N2', 'N1'], curJlpt)}</select></label>
        <label class="lbl">ビジネス日本語要件<select class="sel" data-b="businessJapaneseRequirement">${opts(['不問', 'ビジネス流暢必須'], curBiz)}</select></label>
      </div>
      <label class="lbl">日本語スコア重み<input class="field num" type="number" inputmode="decimal" min="0" data-b="japaneseWeight" value="${c.japaneseWeight}" placeholder="重み"></label>
      ${caseExtBlock(c)}
      <div class="wsum ${sum <= 0 ? 'bad' : ''}" id="caseWsum">
        <span>重み合計 <b class="num">${sum}</b></span>
        <span class="faint">推奨合計 100（任意）</span>
      </div>
      <div class="err" id="caseErrs">${errs.map(x => '· ' + esc(x)).join('<br>')}</div>
    </div>
    <div class="dr-f">
      ${D.isNew ? '' : `<div class="btn-row dr-danger-row">${D.confirmDel ? `<button class="btn danger solid" data-act="delCase">削除確認</button> <button class="btn ghost" data-act="cancelDel">キャンセル</button>` : `<button class="btn danger" data-act="askDel">案件を削除</button>`}</div>`}
      <div class="btn-row">
        <button class="btn" data-act="closeDr">キャンセル</button>
        <button class="btn primary" id="saveCaseBtn" data-act="saveCase" ${errs.length ? 'disabled' : ''}>案件を保存</button>
      </div>
    </div>
  `;
        }

        function showCaseDrawer() {
            openDrawer(D.isNew ? '案件新規登録' : `案件編集 · ${esc(D.data.title)}`, caseForm());
        }

        /* ============================================================================
           案件テキスト自動入力：貼り付け → 解析 → 人が確認 → 案件フォームへ
           ----------------------------------------------------------------------------
           设计原则与全项目保持一致：
             1. 不做「一键全自动」。解析结果必然附带原文证据（高亮）与置信度，
                低置信项以「要確認」形式交还给人判断，与既有的「年数未確認」同一套思路。
             2. 解析只在浏览器内进行，原文不外发（单文件离线运行，零依赖）。
             3. 确认后的结果写进现有 caseForm()，保存/校验/评分全部复用既有逻辑，
                新增的 ext 字段仅作展示，不参与 evaluate() 打分。
           ============================================================================ */

        /** 原文高亮的分类映射：kind → [CSS 类, 说明]（与解析引擎输出的 kind 一一对应） */
        const PC_GROUP = {
            skill: ['g-skill', 'スキル'], phase: ['g-req', '工程・職種'], domain: ['g-req', 'ドメイン'],
            role: ['g-req', '職種'], person: ['g-req', '人物要件'],
            period: ['g-time', '時期・期間'], years: ['g-time', '年数'],
            location: ['g-place', '勤務地'], remote: ['g-place', 'リモート'], commute: ['g-place', '通勤'],
            money: ['g-money', '単価'], settle: ['g-money', '精算'],
            jp: ['g-jp', '日本語'], nat: ['g-jp', '外国籍'], age: ['g-jp', '年齢'],
            interview: ['g-jp', '面談'], commerce: ['g-jp', '商流']
        };

        /** 图例（6 种颜色对应 6 类信息） */
        const PC_LEGEND = [
            ['var(--pc-skill)', 'スキル・工程'], ['var(--pc-req)', '必須・人物要件'],
            ['var(--pc-time)', '時期'], ['var(--pc-place)', '勤務地'],
            ['var(--pc-money)', '単価・精算'], ['var(--pc-jp)', '日本語・国籍']
        ];

        /**
         * 把 ext 里可能出现的各种形状统一成可显示的文本
         * （解析引擎对 commerce 返回对象、其余返回字符串，这里一次性抹平）
         */
        function pcText(v) {
            if (v == null) return '';
            if (typeof v === 'string' || typeof v === 'number') return String(v);
            if (typeof v === 'object') {
                const base = v.value || v.range || v.text || '';
                return base + (v.cond ? `（${v.cond}）` : '');
            }
            return '';
        }

        /** 置信度 → 圆点等级（>=0.85 高 / >=0.6 中 / 其余要確認） */
        function pcDotClass(conf) {
            const c = +conf || 0;
            if (c >= 0.85) return 'hi';
            if (c >= 0.6) return 'mid';
            return 'low';
        }

        /** 现有技术者/案件里出现过的技能表记，用于把解析结果向既有写法对齐 */
        function vocabSkillNames() {
            const set = new Set();
            (S.techs || []).forEach(t => (t.skills || []).forEach(s => { if (s && s.name) set.add(s.name); }));
            (S.cases || []).forEach(c => (c.skillConditions || []).forEach(k => { if (k && k.skillName) set.add(k.skillName); }));
            return [...set];
        }

        /**
         * 原文高亮：span 之间的「包含」关系用嵌套 mark 表达（例：外国籍条件里嵌着日语要求），
         * 交叉的 span 会让标签闭合错乱，因此保留先采用（更长）的一方，丢弃交叉项。
         */
        function pcHighlightHTML(raw, spans) {
            const src = String(raw || '');
            const sorted = (spans || [])
                .filter(s => s && s.start >= 0 && s.end <= src.length && s.end > s.start)
                .sort((a, b) => a.start - b.start || b.end - a.end);

            const kept = [];
            for (const sp of sorted) {
                const cross = kept.some(k =>
                    (k.start < sp.start && sp.start < k.end && k.end < sp.end) ||
                    (sp.start < k.start && k.start < sp.end && sp.end < k.end));
                if (!cross) kept.push(sp);
            }

            const evs = [];
            kept.forEach(sp => {
                evs.push({ p: sp.start, t: 'open', sp });
                evs.push({ p: sp.end, t: 'close', sp });
            });
            // 同一位置先闭合再开启，避免出现空标签
            evs.sort((a, b) => a.p - b.p || (a.t === 'close' ? -1 : 1));

            let html = '', pos = 0;
            for (const ev of evs) {
                if (ev.p > pos) { html += esc(src.slice(pos, ev.p)); pos = ev.p; }
                if (ev.t === 'open') {
                    const g = PC_GROUP[ev.sp.kind] || ['g-skill', ev.sp.label || ''];
                    html += `<mark class="${g[0]}" title="${esc(ev.sp.label || g[1])}">`;
                } else {
                    html += '</mark>';
                }
            }
            html += esc(src.slice(pos));
            return html;
        }

        function pcLegendHTML() {
            return `<span class="pc-legend">${PC_LEGEND.map(([color, label]) =>
                `<span><i style="background:${color}"></i>${label}</span>`).join('')}</span>`;
        }

        /** 解析结果 → 字段卡片（核心项总是显示；可选项抽到了才显示，避免「未抽出」刷屏） */
        function pcFieldsHTML(res) {
            const c = res.case || {}, e = res.ext || {};
            const jpVal = [e.jlpt, e.biz].filter(x => x && x !== '不問').join(' / ');
            // core=true：即使是空的也显示「未抽出」，因为这几项决定案件能不能用
            const items = [
                ['開始・期間', e.periodText || '', e.startConf, true],
                ['勤務地', c.location || '', null, true],
                ['リモート', pcText(e.remote), null, true],
                ['単価・予算', (e.budgetText || '') + (e.budgetLevel ? '（低予算）' : ''), null, true],
                ['精算', (e.settlement || '') + (e.settleRange ? `（${e.settleRange}）` : ''), null, true],
                ['日本語', jpVal || (e.jlpt === '不問' && e.biz === '不問' ? '不問' : ''), e.jpConf, true],
                ['外国籍', [e.nationality, e.nationalityCond].filter(Boolean).join(' / '), null, true],
                ['通勤', pcText(e.commute), null, false],
                ['年齢', pcText(e.ageLimit), null, false],
                ['面談', pcText(e.interview), null, false],
                ['商流', pcText(e.commerce), null, false],
                ['職種', (e.roles || []).join('・'), null, false],
                ['全体経験', e.totalYears ? `${e.totalYears} 年` : '', null, false],
                ['工程', (e.phases || []).join('・'), null, false],
                ['ドメイン', (e.domains || []).join('・'), null, false],
                ['人物要件', (e.personReqs || []).join('・'), null, false]
            ];

            return items.filter(([, v, , core]) => core || String(v == null ? '' : v).trim()).map(([k, v, conf]) => {
                const val = String(v == null ? '' : v).trim();
                const dot = conf
                    ? `<i class="pc-dot ${pcDotClass(conf)}" title="信頼度 ${Math.round((+conf || 0) * 100)}%"></i>`
                    : `<i class="pc-dot none"></i>`;
                return `<div class="pc-f">${dot}<span class="pc-fk">${esc(k)}</span>
                    <span class="pc-fv ${val ? '' : 'miss'}">${val ? esc(val) : '未抽出'}</span></div>`;
            }).join('');
        }

        /** 技能表（可在解析结果上直接改，改完再交给案件表单） */
        function pcSkillsHTML() {
            const list = (P && P.skills) || [];
            if (!list.length) {
                return `<div class="empty" style="padding:16px">スキルを抽出できませんでした。下の未認識語から追加するか、手動で追加してください。</div>`;
            }
            return `
                <div class="rowhead case"><span>スキル名</span><span>最低年数</span><span>必須</span><span>重み</span><span></span></div>
                ${list.map((s, i) => `
                  <div class="row case" data-si="${i}">
                    <label class="mini-field mf-kn"><span class="mini-lbl">スキル名</span>
                      <input class="field" data-pk="skillName" value="${esc(s.skillName)}" aria-label="スキル名" placeholder="スキル名"
                        title="${esc(s.evidence || '')}${s.alignedFrom ? `\n原文表記: ${esc(s.alignedFrom)}` : ''}"></label>
                    <label class="mini-field mf-km"><span class="mini-lbl">最低年数</span>
                      <input class="field num" type="number" inputmode="decimal" min="0" step="0.5" data-pk="minYears"
                        value="${s.minYears == null ? '' : s.minYears}" aria-label="最低年数" placeholder="最低年数"></label>
                    <label class="mf-kh" style="display:flex;gap:6px;align-items:center">
                      <input type="checkbox" data-pk="isHard" ${s.isHard ? 'checked' : ''}>必須</label>
                    <label class="mini-field mf-kw"><span class="mini-lbl">重み</span>
                      <input class="field num" type="number" inputmode="decimal" min="0" data-pk="weight"
                        value="${s.weight}" aria-label="重み" placeholder="重み"></label>
                    <button class="x" data-act="delPasteSkill" data-i="${i}" aria-label="削除">${ico('x')}</button>
                  </div>`).join('')}`;
        }

        /** 必须技能缺少年数时的即时提示（不阻塞，登记时自动补 1 年） */
        function syncPasteSkillWarn() {
            const el = $('#pcSkWarn');
            if (!el) return;
            const bad = ((P && P.skills) || []).filter(s => s.isHard && !(s.minYears > 0));
            el.style.display = bad.length ? '' : 'none';
            el.textContent = bad.length ? `必須スキル ${bad.length} 件に年数がありません（登録時に 1 年として補正されます）` : '';
        }

        /** 警告列表（bad / warn / info 三档） */
        function pcWarnsHTML(warnings) {
            const list = warnings || [];
            if (!list.length) return '';
            return `<div class="pc-warns">${list.map(w => {
                const lv = w.level === 'bad' ? 'bad' : (w.level === 'info' ? 'info' : 'warn');
                const icon = lv === 'info' ? ico('info') : ico('warn');
                return `<div class="pc-w ${lv}">${icon}<span>${esc(w.text)}</span></div>`;
            }).join('')}</div>`;
        }

        /** 未认识词：点一下即升级为技能（词典外的专有名词主要靠这里补） */
        function pcUnknownHTML() {
            const words = (P && P.result && P.result.unknown) || [];
            return words.map(w => `<button class="chip line pc-unknown" data-act="addPasteSkill" data-w="${esc(w)}">${ico('plus')}${esc(w)}</button>`).join('');
        }

        /** 贴纸解析抽屉的主体 HTML（输入态 / 确认态两段式） */
        function pasteBody() {
            if (!P) return '';
            const confirmed = P.step === 'confirm' && P.result;
            const res = P.result;
            const stale = confirmed && P.text !== P.parsedText;

            const srcBlock = confirmed
                ? `<details class="pc-src">
                     <summary>原文を表示・編集（<span id="pcSrcCount">${P.text.length}</span> 文字）</summary>
                     <textarea class="field pc-ta" id="pcTa" rows="7" spellcheck="false">${esc(P.text)}</textarea>
                   </details>`
                : `<textarea class="field pc-ta" id="pcTa" rows="11" spellcheck="false"
                     placeholder="例）&#10;11月～中長期&#10;川崎駅　※リモート有&#10;◆必須&#10;・Java開発経験3年以上&#10;精算無し"></textarea>`;

            return `
    <div class="dr-b">
      <div class="pc-sec">
        <div class="pc-sec-h">
          <b>案件テキストを貼り付け</b>
          <span class="faint sm">メール・DM・チャットの文面をそのまま貼り付けてください</span>
        </div>
        ${srcBlock}
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <button class="btn ${confirmed ? '' : 'primary'}" data-act="runParse">${ico('zap')}${confirmed ? '再解析' : '解析する'}</button>
          ${confirmed ? `<button class="btn ghost sm" data-act="pasteReset">クリア</button>` : ''}
          <span class="faint sm">原文はブラウザ内でのみ処理され、外部送信はありません</span>
        </div>
      </div>
      ${confirmed ? `
      <div class="pc-sec">
        <div class="pc-sec-h">
          <b>抽出結果</b>
          <span class="faint sm">${res.stats.chars} 文字 / ${res.stats.skillCount} スキル / ${res.stats.ms}ms</span>
        </div>
        <div class="pc-fields">${pcFieldsHTML(res)}</div>
        ${pcWarnsHTML(res.warnings)}
      </div>
      <div class="pc-sec">
        <div class="pc-sec-h"><b>原文のどこを拾ったか</b>${pcLegendHTML()}</div>
        <div class="pc-hl">${pcHighlightHTML(P.parsedText, res.spans)}</div>
      </div>
      <div class="pc-sec">
        <div class="pc-sec-h">
          <b>スキル要件</b>
          <span class="faint sm">ここで修正した内容が案件フォームに引き継がれます</span>
        </div>
        <div class="rows" id="pcSkills">${pcSkillsHTML()}</div>
        <div class="chip warn" id="pcSkWarn" style="display:none"></div>
        <div><button class="btn sm" data-act="addPasteSkill">${ico('plus')}スキルを追加</button></div>
      </div>
      ${(res.unknown || []).length ? `
      <div class="pc-sec">
        <div class="pc-sec-h"><b>未認識語</b><span class="faint sm">クリックでスキルとして追加</span></div>
        <div class="pc-tags">${pcUnknownHTML()}</div>
      </div>` : ''}
      ` : ''}
    </div>
    ${confirmed ? `
    <div class="dr-f">
      <div class="btn-row"><button class="btn" data-act="closeDr">キャンセル</button></div>
      <div class="btn-row">
        <span class="chip warn" id="pcStale" style="display:${stale ? 'inline-flex' : 'none'}">原文が変更されています</span>
        <button class="btn primary" id="pcApply" data-act="applyParse" ${stale ? 'disabled' : ''}>この内容で案件フォームへ</button>
      </div>
    </div>` : ''}
  `;
        }

        /**
         * 重绘抽屉内容（只替换 .dr-b / .dr-f，保留抽屉标题与滚动位置）
         * @param {boolean} [resetScroll] true 时回到顶部（解析完成后使用）
         */
        function renderPaste(resetScroll) {
            const d = $('#drawer');
            if (!d || !P) return;
            const keep = resetScroll ? 0 : (d.querySelector('.dr-b')?.scrollTop || 0);
            d.querySelectorAll('.dr-b, .dr-f').forEach(n => n.remove());
            d.insertAdjacentHTML('beforeend', pasteBody());
            const b = d.querySelector('.dr-b');
            if (b) b.scrollTop = keep;
            attachPasteHandlers();
            syncPasteSkillWarn();
        }

        /**
         * 绑定解析抽屉内的输入事件
         * 不用全局 data-b 绑定：这里的草稿是 P 而不是 D，且只局部更新、不整页重绘，
         * 避免手机上输入法键盘被重建打断。
         */
        function attachPasteHandlers() {
            const ta = $('#pcTa');
            if (ta) {
                if (!ta.value && P && P.text) ta.value = P.text;
                ta.oninput = e => {
                    if (!P) return;
                    P.text = e.target.value;
                    const stale = P.step === 'confirm' && P.text !== P.parsedText;
                    const btn = $('#pcApply');
                    if (btn) btn.disabled = stale;
                    const chip = $('#pcStale');
                    if (chip) chip.style.display = stale ? 'inline-flex' : 'none';
                    const cnt = $('#pcSrcCount');
                    if (cnt) cnt.textContent = P.text.length;
                };
            }

            const box = $('#pcSkills');
            if (box) {
                box.oninput = e => {
                    const inp = e.target.closest('[data-pk]');
                    if (!inp || !P) return;
                    const row = inp.closest('[data-si]');
                    if (!row) return;
                    const s = P.skills[+row.dataset.si];
                    if (!s) return;
                    const k = inp.dataset.pk;
                    if (k === 'minYears') s.minYears = inp.value === '' ? null : +inp.value;
                    else if (k === 'weight') s.weight = +inp.value || 0;
                    else if (k === 'isHard') s.isHard = inp.checked;
                    else if (k === 'skillName') s.skillName = inp.value;
                    syncPasteSkillWarn();
                };
            }
        }

        /** 解析结果 + 人工修正 → 案件表单草稿 */
        function applyPasteToCaseDraft() {
            const res = P.result;
            const e = P.ext || {};
            let skills = (P.skills || [])
                .map(s => ({
                    skillName: String(s.skillName || '').trim(),
                    minYears: s.minYears == null ? (s.isHard ? 1 : 0) : +s.minYears,
                    isHard: !!s.isHard,
                    weight: +s.weight || 0
                }))
                .filter(s => s.skillName);

            if (!skills.length) skills = [{ skillName: '', minYears: 1, isHard: false, weight: 50 }];

            // 既有校验要求「权重合计 > 0」，解析结果为空权重时给一个可保存的默认值
            const jw = +res.case.japaneseWeight || 0;
            if (skills.reduce((a, k) => a + k.weight, 0) + jw <= 0) skills[0].weight = 100;

            return {
                id: uid('c'),
                title: res.case.title || '',
                client: res.case.client || '',
                location: res.case.location || '',
                unitPriceText: res.case.unitPriceText || '',
                startDate: res.case.startDate || TODAY,
                status: '募集中',
                skillConditions: skills,
                jlptRequirement: res.case.jlptRequirement || '不問',
                businessJapaneseRequirement: res.case.businessJapaneseRequirement || '不問',
                japaneseWeight: jw,
                // 新增的参考信息（只读展示，evaluate() 不读取，不影响评分）
                ext: {
                    periodText: e.periodText || '',
                    duration: e.duration || '',
                    remote: pcText(e.remote),
                    commute: pcText(e.commute),
                    settlement: e.settlement || '',
                    settleRange: e.settleRange || '',
                    budgetText: e.budgetText || '',
                    budgetLevel: e.budgetLevel || '',
                    nationality: e.nationality || '',
                    nationalityCond: e.nationalityCond || '',
                    ageLimit: pcText(e.ageLimit),
                    interview: pcText(e.interview),
                    commerce: pcText(e.commerce),
                    roles: e.roles || [],
                    phases: e.phases || [],
                    domains: e.domains || [],
                    personReqs: e.personReqs || [],
                    totalYears: e.totalYears || null,
                    parsedAt: new Date().toISOString(),
                    // 原文留档：便于事后核对「当时写的是什么」，最多存 2000 字
                    source: String(P.parsedText || '').slice(0, 2000)
                }
            };
        }

        /** 案件表单里显示抽取到的补充信息（只读；老案件没有 ext 时不显示） */
        function caseExtBlock(c) {
            const e = c.ext;
            if (!e) return '';
            const rows = [
                ['開始・期間', e.periodText],
                ['リモート', e.remote],
                ['通勤', e.commute],
                ['精算', (e.settlement || '') + (e.settleRange ? `（${e.settleRange}）` : '')],
                ['国籍', [e.nationality, e.nationalityCond].filter(Boolean).join(' / ')],
                ['年齢', e.ageLimit],
                ['面談', e.interview],
                ['商流', e.commerce],
                ['職種', (e.roles || []).join('・')],
                ['全体経験', e.totalYears ? `${e.totalYears} 年` : ''],
                ['工程', (e.phases || []).join('・')],
                ['ドメイン', (e.domains || []).join('・')],
                ['人物要件', (e.personReqs || []).join('・')]
            ].filter(r => String(r[1] || '').trim());

            if (!rows.length && !e.source) return '';

            return `
      <div class="pc-sec">
        <div class="pc-sec-h">
          <b>原文から抽出した補足情報</b>
          <span class="faint sm">参考情報・スコア計算には未使用</span>
        </div>
        ${rows.length ? `<div class="pc-meta">${rows.map(([k, v]) =>
                `<div><b>${esc(k)}</b><span>${esc(v)}</span></div>`).join('')}</div>` : ''}
        ${e.source ? `<details class="pc-src"><summary>取り込み元の原文を見る</summary>
          <div class="pc-hl" style="max-height:170px">${esc(e.source)}</div></details>` : ''}
      </div>`;
        }

        /** 打开「貼り付けて自動入力」抽屉 */
        function openPasteDrawer() {
            P = { step: 'input', text: '', parsedText: '', result: null, skills: [], ext: {} };
            openDrawer('案件テキストから自動入力', pasteBody(), { sheet: true });
            attachPasteHandlers();
            const ta = $('#pcTa');
            if (ta) ta.focus();
        }

        /** 执行解析：把原文交给内联引擎，结果暂存在 P 里等待人工确认 */
        function runPasteParse() {
            if (!P) return;
            const text = String(P.text || '');
            if (!text.trim()) { toast('案件テキストを貼り付けてください'); return; }
            if (typeof TechCaseParser === 'undefined') { toast('解析エンジンを読み込めませんでした'); return; }

            const res = TechCaseParser.parse(text, { now: TODAY, vocab: vocabSkillNames() });
            P.result = res;
            P.parsedText = text;
            P.ext = res.ext || {};
            P.skills = (res.skills || []).map(s => ({
                skillName: s.skillName,
                minYears: s.minYears,
                isHard: !!s.isHard,
                weight: +s.weight || 0,
                evidence: (s.evidenceLines || [s.evidence || '']).filter(Boolean).join(' / '),
                alignedFrom: s.alignedFrom || ''
            }));
            P.step = 'confirm';
            renderPaste(true);
        }

        /* ============================================================================
           视图 5：提案履歴 (Recommendations View)
           ============================================================================ */
        /**
         * 提案履歴フィルター：キーワード + ステータス（最新提案日順）
         * @returns {Array} フィルタリング後の提案履歴
         */
        function recFilterRows() {
            const q = norm(S.recQ || '');
            const sf = S.recStatusFilter || 'すべて';
            const allRows = [...S.recs].sort((a, b) => b.last.localeCompare(a.last));
            return allRows.filter(r => {
                const c = S.cases.find(x => x.id === r.caseId);
                const t = S.techs.find(x => x.id === r.techId);
                if (!c || !t) return false;
                const matchQ = !q || norm(c.title).includes(q) || norm(c.client).includes(q) || norm(t.name).includes(q) || t.skills.some(s => norm(s.name).includes(q));
                const isRec = r.status === '提案済' || r.status === '已推荐';
                const isWd = r.status === '取下げ済' || r.status === '已撤回';
                const matchStatus = sf === 'すべて' || sf === '全部' ||
                    ((sf === '提案済み' || sf === '提案済') && isRec) ||
                    (sf === '取下げ済' && isWd) ||
                    r.status === sf;
                return matchQ && matchStatus;
            });
        }

        /**
         * 提案履歴テーブル HTML の生成（空の場合はエンプティステートを表示）
         * @param {Array} rows 提案履歴配列
         * @returns {string} HTML 文字列
         */
        function recTableHTML(rows) {
            if (!rows.length) return `<div class="empty">「${esc(S.recQ)}」に一致する提案履歴は見つかりませんでした。</div>`;
            return `
        <div class="tbl-wrap panel">
          <table class="tbl-mobile">
            <thead>
              <tr>
                <th style="min-width:180px">技術者</th>
                <th style="min-width:240px">対象案件</th>
                <th style="width:110px">ステータス</th>
                <th style="width:130px">最終提案日</th>
                <th style="width:130px">取下げ日</th>
                <th class="ta-r" style="width:190px">アクション</th>
              </tr>
            </thead>
            <tbody>
              ${rows.map(r => {
                const c = S.cases.find(x => x.id === r.caseId);
                const t = S.techs.find(x => x.id === r.techId);
                if (!c || !t) return '';
                const av = getAvatarTheme(t.name);
                const topSkill = [...t.skills].sort((a, b) => b.years - a.years)[0];
                const isRec = r.status === '提案済' || r.status === '已推荐';
                return `
                  <tr>
                    <td data-label="技術者">
                      <div class="rec-tech-cell">
                        <div class="rec-avatar-sm" style="background:${av.bg};color:${av.color};border:1px solid ${av.border};">${esc(t.name[0] || '技')}</div>
                        <div style="min-width:0">
                          <div style="display:flex;align-items:center;gap:6px">
                            <b>${esc(t.name)}</b>
                            <span class="chip line" style="font-size:10.5px;padding:0 5px">JLPT ${esc(t.jlpt === '未考级' ? '未受験' : t.jlpt === '未知' ? '不明' : (t.jlpt || '不明'))}</span>
                          </div>
                          ${topSkill ? `<div class="faint sm" style="margin-top:2px;font-size:11px">${esc(topSkill.name)} ${topSkill.years}年</div>` : ''}
                        </div>
                      </div>
                    </td>
                    <td data-label="対象案件">
                      <div class="rec-case-cell">
                        <div class="rec-case-title">${esc(c.title)}</div>
                        <div class="rec-case-sub">
                          <span>${esc(c.client || 'クライアント未指定')}</span>
                          ${c.unitPriceText ? `<span class="case-price-badge" style="font-size:11px;padding:1px 5px">${esc(priceText(c.unitPriceText))}</span>` : ''}
                        </div>
                      </div>
                    </td>
                    <td data-label="ステータス">
                      <span class="chip ${isRec ? 'ok' : 'line'}" style="gap:4px">
                        ${isRec ? ico('check') : ico('info')}
                        ${isRec ? '提案済み' : '取下げ済'}
                      </span>
                    </td>
                    <td data-label="最終提案日" class="num" style="font-size:12.5px">${r.last}</td>
                    <td data-label="取下げ日" class="num" style="font-size:12.5px;color:var(--ink3)">${r.withdrawn || '—'}</td>
                    <td data-label="アクション" class="ta-r">
                      <div style="display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap">
                        <button class="btn ghost sm" data-act="goMatchCase" data-id="${c.id}" title="この案件のマッチングワークスペースを開く">
                          ${ico('match')}
                          <span>マッチング</span>
                        </button>
                        ${isRec
                        ? `<button class="btn ghost sm danger-text" data-act="wd2" data-id="${r.id}" title="提案を取り下げます">${ico('x')}<span>取下げ</span></button>`
                        : `<button class="btn sm primary" data-act="re2" data-id="${r.id}" title="この履歴を再利用して再提案します">${ico('refresh')}<span>再提案</span></button>`}
                      </div>
                    </td>
                  </tr>
                `;
            }).join('')}
            </tbody>
          </table>
        </div>
        <p class="hint" style="margin-top:12px">ステータス更新について、同一の案件と技術者の組み合わせは1件のみ保持されます。再提案時は日付が自動更新され、取下げと再提案のサイクルに対応しています。</p>
      `;
        }

        /** 提案履歴テーブルと件数カウントのみをリフレッシュ */
        function updateRecList() {
            const box = $('#recList');
            if (!box) return;
            const rows = recFilterRows();
            box.innerHTML = recTableHTML(rows);
            const cnt = $('#recCount');
            if (cnt) cnt.textContent = `${rows.length}${rows.length !== S.recs.length ? ` / ${S.recs.length}` : ''}`;
        }

        function vRecs() {
            const sf = S.recStatusFilter || 'すべて';

            const allRows = [...S.recs].sort((a, b) => b.last.localeCompare(a.last));
            const activeCount = S.recs.filter(r => r.status === '提案済' || r.status === '已推荐').length;
            const withdrawnCount = S.recs.filter(r => r.status === '取下げ済' || r.status === '已撤回').length;
            const caseCount = new Set(S.recs.map(r => r.caseId)).size;
            const techCount = new Set(S.recs.map(r => r.techId)).size;
            const filteredRows = recFilterRows();

            const toolbar = `
          <input class="field search" id="recQInput" type="text" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="技術者名、案件名、スキルで検索..." value="${esc(S.recQ || '')}">
          <div class="seg" role="tablist">
            ${['すべて', '提案済み', '取下げ済'].map(st => `
              <button data-act="filterRecStatus" data-s="${st}" aria-pressed="${sf === st || (sf === '全部' && st === 'すべて') || (sf === '提案済' && st === '提案済み')}">${st} (${st === 'すべて' ? allRows.length : st === '提案済み' ? activeCount : withdrawnCount})</button>
            `).join('')}
          </div>
      `;

            $('#view').innerHTML = head(
                '提案履歴',
                `提案履歴一覧 <span class="faint num h-count" id="recCount">${filteredRows.length}${filteredRows.length !== allRows.length ? ` / ${allRows.length}` : ''}</span>`,
                `同一案件・技術者の組み合わせは1件のみ記録されます。取下げ後の再提案時は日付が自動更新されます。現在提案済み${activeCount}名、取下げ済${withdrawnCount}名。`,
                toolbar
            ) + `
        <!-- KPI 指標カードストリップ (KPI Strip) -->
        <div class="rec-strip">
          <div class="rec-stat-card">
            <div class="rec-stat-head">
              <span>提案済みの候補</span>
              ${ico('check')}
            </div>
            <div class="rec-stat-val" style="color:var(--ok)">${activeCount}</div>
            <div class="rec-stat-desc">選考・面談待ち</div>
          </div>
          <div class="rec-stat-card">
            <div class="rec-stat-head">
              <span>取下げ済の提案</span>
              ${ico('info')}
            </div>
            <div class="rec-stat-val" style="color:var(--ink2)">${withdrawnCount}</div>
            <div class="rec-stat-desc">履歴を保持し、いつでも再提案可能</div>
          </div>
          <div class="rec-stat-card">
            <div class="rec-stat-head">
              <span>提案カバー規模</span>
              ${ico('match')}
            </div>
            <div class="rec-stat-val" style="color:var(--accent)">${caseCount}<small style="font-size:14px;color:var(--ink3);margin-left:3px">案件</small> / ${techCount}<small style="font-size:14px;color:var(--ink3);margin-left:3px">名</small></div>            <div class="rec-stat-desc">案件と技術者の提案実績</div>
          </div>
        </div>

        <div id="recList">${recTableHTML(filteredRows)}</div>
      `;

            const qi = $('#recQInput');
            if (qi) {
                qi.oninput = e => {
                    S.recQ = e.target.value;
                    updateRecList();
                };
            }
        }

        /* ============================================================================
           视图 6：単一ファイル Excel 取込 (Import View)
           .xlsx バイナリローカル解凍読込 + 人手による確認フロー
           ============================================================================ */

        /* ---------- 取込プレビュー：技能一覧の整理（チップ優先・編集切替可） ----------
           自動認識済み（職歴から年数算出済み）の技能は読み取り専用チップで表示し、
           編集が必要な時だけ行入力モードへ切り替える。要確認技能は常に編集行で表示。 */

        /**
         * 将当前 DOM 中的技能输入行值回写到解析数据 S.imp.data
         * 在局部重渲染或保存前调用，避免切换显示模式时丢失已编辑内容
         */
        function syncImpSkillInputs() {
            if (!S.imp?.data) return;
            $$('[data-sk]').forEach(r => {
                const arr = S.imp.data.skills[+r.dataset.sk];
                if (!arr) return;
                const ins = r.querySelectorAll('input');
                if (ins[0]) arr[0] = ins[0].value.trim();
                if (ins[1] && ins[1].value !== '') {
                    arr[1] = ins[1].value;
                    // 补填年数后状态位同步为已算出，保证分组/统计一致
                    if (arr[2] === '要確認' || arr[2] === '待核对') arr[2] = '確認済';
                } else if (ins[1]) arr[1] = ins[1].value;
            });
        }

        /**
         * 计算导入技能的两组分类
         * 要確認：職歴に記載がなく年数を算出できない（Excel 无实绩年数记载）
         * 分组只看年数有无：编辑模式下补填年数的技能会自动移入自動認識済み组
         * @returns {{ skillList: Array, need: number[], auto: number[] }}
         */
        function impSkillGroups() {
            const skillList = S.imp?.data?.skills || [];
            const need = [], auto = [];
            skillList.forEach((s, i) => {
                if (s[1] == null || s[1] === '' || !(+s[1] > 0)) need.push(i);
                else auto.push(i);
            });
            return { skillList, need, auto };
        }

        /**
         * 单条技能编辑行（要確認 highlighted / 職歴算出 regular）
         * @param {number} i 技能在解析数据中的下标
         * @param {boolean} need 是否为要確認行
         */
        function impSkillRowHTML(i, need) {
            const s = S.imp.data.skills[i];
            const note = need ? '職歴に記載なし' : '職歴から算出';
            return `
          <div class="pf-row imp-skill-row ${need ? 'q' : ''}" data-sk="${i}">
            <input class="field" value="${esc(s[0])}" aria-label="スキル名">
            <input class="field num" type="number" step="0.1" min="0" value="${s[1] ?? ''}" placeholder="年数" aria-label="経験年数">
            <small title="${esc(s[3] || '')}">${esc(note)}</small>
          </div>`;
        }

        /**
         * 自動認識済み技能的只读チップ（chip）群
         * @param {number[]} auto 自動認識済み技能下标列表
         */
        function impSkillChipsHTML(auto) {
            return auto.map(i => {
                const s = S.imp.data.skills[i];
                return `<span class="skchip" title="${esc(s[3] || '')}">${esc(s[0])} <b class="num">${esc(String(s[1]))}年</b></span>`;
            }).join('');
        }

        /** 技能确认区整体（分組見出し + 要確認チップ/編集行 + 自動認識済みチップ/編集行） */
        function impSkillAreaHTML() {
            const { skillList, need, auto } = impSkillGroups();
            const editNeed = !!S.imp.skillEditNeed;
            const editAuto = !!S.imp.skillEdit;
            // 要確認チップ：年数未入力は warn 強調で示す
            const needChips = need.map(i => {
                const s = S.imp.data.skills[i];
                return `<span class="skchip q" title="${esc(s[3] || '')}">${esc(s[0])} <b class="num">年数要確認</b></span>`;
            }).join('');
            return `
        <div class="imp-skill-head">
          <b>スキル・実務経験年数の確認</b>
          <span class="faint sm">全 ${skillList.length} 件</span>
        </div>
        ${need.length ? (editNeed ? `
          <div class="imp-group-head">
            <b>要確認（編集中）</b>
            <span class="chip warn sm">${need.length}</span>
            <span class="faint sm">年数が分かるものだけ入力してください。空欄のまま登録すると「経験あり・年数要確認」の普通技能として扱われ、加点評価の対象外（必須条件では要確認）になります。</span>
            <button class="btn sm gr-btn" data-act="impSkillEdit" data-g="need">読み取り表示へ戻る</button>
          </div>
          ${need.map(i => impSkillRowHTML(i, true)).join('')}
        ` : `
          <div class="imp-group-head">
            <b>要確認</b>
            <span class="chip warn sm">${need.length}</span>
            <span class="faint sm">職歴に記載がなく年数を算出できません。登録先では「経験あり・年数要確認」の普通技能扱いです。</span>
            <button class="btn sm gr-btn" data-act="impSkillEdit" data-g="need">年数を入力</button>
          </div>
          <div class="imp-chipwall">${needChips}</div>
        `) : ''}
        ${auto.length ? (editAuto ? `
          <div class="imp-group-head">
            <b>自動認識済み（編集中）</b>
            <span class="chip ok sm">${auto.length}</span>
            <button class="btn sm gr-btn" data-act="impSkillEdit" data-g="auto">読み取り表示へ戻る</button>
          </div>
          ${auto.map(i => impSkillRowHTML(i, false)).join('')}
        ` : `
          <div class="imp-group-head">
            <b>自動認識済み</b>
            <span class="chip ok sm">${auto.length}</span>
            <span class="faint sm">職歴から算出済み</span>
            <button class="btn sm gr-btn" data-act="impSkillEdit" data-g="auto">年数を編集</button>
          </div>
          <div class="imp-chipwall">${impSkillChipsHTML(auto)}</div>
        `) : ''}
      `;
        }

        /** 仅重绘进入时区（局部刷新，不影响姓名/JLPT 等输入内容） */
        function renderImpSkillArea() {
            const el = $('#impSkillArea');
            if (el) el.innerHTML = impSkillAreaHTML();
        }

        function vImport() {
            const st = S.imp.step;
            const steps = ['ファイル選択', 'プレビュー・確認', '登録完了'].map((l, i) =>
                `<div class="${st === i + 1 ? 'on' : st > i + 1 ? 'done' : ''}">
      <b>${st > i + 1 ? ico('check', 2.2) : i + 1}</b><span>${l}</span>
    </div>`
            ).join('');

            let body = '';
            if (st === 1) {
                body = `
      <label class="drop" id="drop" for="fi" tabindex="0">
        ${ico('file', 1.4)}
        <b style="font:700 18px var(--display)">技術者のスキルシート（.xlsx）をドロップまたは選択</b>
        <span class="muted">単一ファイル取込。ブラウザローカルで安全に解凍・解析。外部サーバーへの送信は一切行いません。</span>
        <span class="btn primary" style="pointer-events:none">ローカルファイルを選択</span>
        <input id="fi" type="file" accept=".xlsx,.xls" hidden>
      </label>

      <div class="callout info">
        ${ico('info')}
        <span>ご案内。元のExcelファイル自体は保持せず、構造化データのみを抽出してファイル名と取込日時を記録します。解析に失敗した場合は手動登録も可能です。</span>
      </div>

            applyParse() {
                if (!P || !P.result) return;
                if (P.text !== P.parsedText) { toast('原文が変更されています。再解析してください'); return; }
                D = { kind: 'case', isNew: true, data: applyPasteToCaseDraft() };
                P = null;
                showCaseDrawer();
                toast('解析結果を案件フォームに反映しました。内容を確認してください');
            },
            editCase(el) {
                D = { kind: 'case', data: clone(S.cases.find(c => c.id === el.dataset.id)) };
                showCaseDrawer();
            },
            addCond() {
                D.data.skillConditions.push({ skillName: '', minYears: null, isHard: false, weight: 10 });
                D.dirty = true;
                refreshDr();
            },
            delCond(el) {
                D.data.skillConditions.splice(+el.dataset.i, 1);
                D.dirty = true;
                refreshDr();
            },
            saveCase() {
                const c = D.data;
                if (caseErrors(c).length) return;
                const i = S.cases.findIndex(x => x.id === c.id);
                if (i < 0) S.cases.push(c); else S.cases[i] = c;
                persistData();
                closeDrawer();
                render();
                toast('案件情報を保存しました');
            },
            delCase() {
                S.cases = S.cases.filter(c => c.id !== D.data.id);
                S.recs = S.recs.filter(r => r.caseId !== D.data.id);
                persistData();
                closeDrawer();
                render();
                toast('案件を削除しました');
            },
            impBack() {
                S.imp = { step: 1, file: null, data: null };
                vImport();
            },
            /** 技能チップ表示 ⇔ 編集行 表示切替（data-g="need"/"auto" 分组独立切换；同页局部重绘，不丢已改内容） */
            impSkillEdit(el) {
                if (!S.imp?.data) return;
                syncImpSkillInputs();
                if (el && el.dataset.g === 'need') S.imp.skillEditNeed = !S.imp.skillEditNeed;
                else S.imp.skillEdit = !S.imp.skillEdit;
                renderImpSkillArea();
            },
            impSave() {
                const p = S.imp.data;
                // 将页面中姓名旁的技能行输入（要確認行 + 编辑模式行）回写到解析数据，
                // 再统一从解析数据生成技能列表：年数空 = 「経験あり・年数要確認」的普通技能
                syncImpSkillInputs();

                const name = $('#pfName').value.trim();
                if (!name) { toast('技術者氏名を入力してください'); return; }

                const newTech = {
                    id: uid('t'),
                    name,
                    kana: p.kana || '',
                    gender: p.gender || 'その他',
                    age: p.age || 0,
                    nationality: p.nationality || '中国',
                    address: p.address || '',
                    stayInJapan: p.stayInJapan || 0,
                    role: p.role || (p.projects?.[0]?.role) || 'SE',
                    education: p.education || { degree: '未登録', major: '' },
                    languages: p.languages || { ja: $('#pfJ').value, en: '—', zh: (p.nationality === '中国' ? 'ネイティブ' : '—') },
                    domains: p.domains || [],
                    phases: p.phases || [],
                    management: p.management || null,
                    certifications: p.certifications || [],
                    projects: p.projects || [],
                    skills: (p.skills || []).filter(s => s[0]).map(s => ({
                        name: s[0],
                        years: (s[1] === '' || s[1] == null) ? 0 : +s[1],
                        source: (s[1] === '' || s[1] == null) ? '要確認' : '取込抽出',
                        note: ''
                    })),
                    jlpt: $('#pfJ').value,
                    biz: $('#pfB').value,
                    sourceFileName: S.imp.file,
                    importedAt: TODAY,
                    importMethod: '単一ファイル取込',
                    availableDate: p.availableDate || '即日',
                    note: p.note || '実務年数はExcelの業務経歴より算出。確認・登録済。'
                };

                const existingIndex = S.techs.findIndex(t => t.name === name || (t.sourceFileName && t.sourceFileName === S.imp.file));
                if (existingIndex >= 0) {
                    newTech.id = S.techs[existingIndex].id;
                    S.techs[existingIndex] = newTech;
                } else {
                    S.techs.unshift(newTech);
                }

                persistData();
                S.imp = { step: 3, file: S.imp.file, savedName: name };
                renderNav();
                vImport();
                toast(`技術者「${name}」を登録しました（職歴${newTech.projects.length}件）`);
            },
            downloadJson() {
                const t = JSON.stringify(snapshot(), null, 2);
                const blob = new Blob([t], { type: 'application/json' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `適所_技術者・案件マッチングバックアップ_${TODAY}.json`;
                a.click();
                URL.revokeObjectURL(a.href);
                toast('バックアップファイルをダウンロードしました');
            },
            copyJson() {
                const t = JSON.stringify(snapshot(), null, 2);
                (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject())
                    .then(() => toast('JSON をクリップボードにコピーしました'))
                    .catch(() => {
                        const p = $('pre.json');
                        const r = document.createRange();
                        r.selectNodeContents(p);
                        const s = getSelection();
                        s.removeAllRanges();
                        s.addRange(r);
                        toast('テキストを選択しました。Ctrl+C でコピーしてください');
                    });
            },
            uploadRestoreFile() {
                $('#restoreFileInput').click();
            },
            checkRestore() {
                const text = $('#rtxt').value;
                S.bak = { text };
                try {
                    const j = JSON.parse(text);
                    const techs = j.technicians || j.techs;
                    const cases = j.cases;
                    const recs = j.recommendations || j.recs;
                    if (!Array.isArray(techs) || !Array.isArray(cases) || !Array.isArray(recs)) {
                        throw new Error('technicians/techs、cases または recommendations リストが見つかりません');
                    }
                    S.bak.ok = `技術者${techs.length}名、案件${cases.length}件、提案履歴${recs.length}件。`;
                    S.bak.confirm = true;
                    S.bak.json = { techs, cases, recs };
                } catch (e) {
                    S.bak.err = e instanceof SyntaxError ? '有効な JSON 形式ではありません。' : e.message;
                }
                vBackup();
            },
            cancelRestore() {
                S.bak = { text: S.bak.text };
                vBackup();
            },
            doRestore() {
                const j = S.bak.json;
                S.techs = j.techs;
                S.cases = j.cases;
                S.recs = j.recs;
                S.bak = null;
                S.caseId = S.cases[0]?.id || null;
                persistData();
                render();
                toast('バックアップから全データを正常に復元しました');
            },
            askWipe() { S.wipe = true; vBackup(); },
            cancelWipe() { S.wipe = false; vBackup(); },
            doWipe() {
                S.techs = []; S.cases = []; S.recs = [];
                S.wipe = false; S.caseId = null;
                persistData();
                render();
                toast('ローカルデータを完全に初期化しました');
            },
        };

        function refreshDr() {
            const d = $('#drawer');
            const keep = d.querySelector('.dr-b')?.scrollTop || 0;
            const h = D.kind === 'tech' ? techForm() : caseForm();
            d.querySelectorAll('.dr-b, .dr-f').forEach(n => n.remove());
            d.insertAdjacentHTML('beforeend', h);
            const b = d.querySelector('.dr-b');
            if (b) b.scrollTop = keep;
        }

        /* 全局监听与快捷交互 */
        document.addEventListener('click', e => {
            const el = e.target.closest('[data-act]');
            if (el && A[el.dataset.act]) A[el.dataset.act](el);
        });
        $('#scrim').onclick = attemptCloseDrawer;
        initSheetDrag();

        /* 软键盘 / 可视视口跟踪：iOS 上布局视口不会随键盘收缩，必须靠 visualViewport 兜底。
           focusin/focusout 的延时调用用于覆盖键盘动画结束后的最终尺寸。 */
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', syncViewportVars);
            window.visualViewport.addEventListener('scroll', syncViewportVars);
        }
        window.addEventListener('resize', syncViewportVars);
        window.addEventListener('orientationchange', () => setTimeout(syncViewportVars, 160));
        document.addEventListener('focusin', e => {
            if (e.target && e.target.matches && e.target.matches('input, textarea, select')) {
                setTimeout(syncViewportVars, 320);
            }
        });
        document.addEventListener('focusout', () => setTimeout(syncViewportVars, 140));
        document.addEventListener('keydown', e => {
            const cm = $('#confirmModal');
            const wm = $('#weightModal');
            const dr = $('#drawer');
            if (e.key === 'Escape') {
                // 按层级关闭最上层覆盖层，避免一次 Esc 关闭多层
                if (cm && cm.classList.contains('show')) closeConfirm(false);
                else if (wm && wm.classList.contains('show')) closeWeightModal();
                else if (dr && dr.classList.contains('on')) attemptCloseDrawer();
                return;
            }
            if (e.key === 'Tab') {
                if (cm && cm.classList.contains('show')) return trapFocus(e, cm);
                if (wm && wm.classList.contains('show')) return trapFocus(e, wm);
                if (dr && dr.classList.contains('on')) return trapFocus(e, dr);
            }
            // 键盘可访问性：role="button" 的卡片支持 Enter / 空格触发
            const t = e.target;
            if ((e.key === 'Enter' || e.key === ' ') && t && t.matches &&
                t.matches('[data-act][role="button"]')) {
                e.preventDefault();
                t.click();
            }
        });
        const wmEl = $('#weightModal');
        if (wmEl) wmEl.onclick = e => { if (e.target === e.currentTarget) closeWeightModal(); };
        const cmEl = $('#confirmModal');
        if (cmEl) cmEl.onclick = e => { if (e.target === e.currentTarget) closeConfirm(false); };

        // 浏览器前进/后退（手机返回键）恢复对应视图
        window.addEventListener('popstate', applyViewFromHash);
        window.addEventListener('hashchange', applyViewFromHash);

        document.addEventListener('input', e => {
            const t = e.target, b = t.dataset.bind;
            // 案件切换面板的即时搜索（不重建抽屉，保持输入法焦点）
            if (t.id === 'caseSheetSearch') {
                filterCaseSheet(t.value);
                return;
            }
            if (b) {
                // 权重弹窗：只更新草稿，绝不直接改案对象
                if (b === 'modal-cw' || b === 'modal-cwn' || b === 'modal-jw' || b === 'modal-jwn') {
                    if (!weightDraft) return;
                    // 数字输入被清空时保留空值等待继续输入，避免强行变 0
                    if ((b === 'modal-cwn' || b === 'modal-jwn') && t.value === '') return;
                    const v = Math.max(0, Math.min(100, Math.round(+t.value || 0)));
                    if (b === 'modal-jw' || b === 'modal-jwn') {
                        weightDraft.jp = v;
                    } else {
                        weightDraft.skills[+t.dataset.i] = v;
                    }
                    syncWeightDraftInputs();
                    return;
                }
                const c = curCase(), v = +t.value;
                if (b === 'cw') {
                    c.skillConditions[+t.dataset.i].weight = v;
                    $('#wv' + t.dataset.i).textContent = v;
                } else {
                    c.japaneseWeight = v;
                    $('#wvj').textContent = v;
                }
                persistData();
                drawResults();
                return;
            }
            const k = t.dataset.b;
            if (!k || !D) return;
            const d = D.data, i = +t.dataset.i;
            D.dirty = true;
            if (D.kind === 'tech') {
                if (k === 'sn') d.skills[i].name = t.value;
                else if (k === 'sy') d.skills[i].years = +t.value;
                else if (k === 'ss') d.skills[i].source = t.value;
                else d[k] = t.value;
            } else {
                if (k === 'kn') d.skillConditions[i].skillName = t.value;
                else if (k === 'km') d.skillConditions[i].minYears = t.value === '' ? null : +t.value;
                else if (k === 'kh') d.skillConditions[i].isHard = t.checked;
                else if (k === 'kw') d.skillConditions[i].weight = +t.value;
                else if (k === 'japaneseWeight') d[k] = +t.value;
                else d[k] = t.value;

                // 只联动校验状态，不重建输入框（手机端中文/日文输入法与键盘焦点保持稳定）
                syncCaseValidation();
            }
        });

        // 首次渲染加载：支持 #match / #techs 等深链接直接进入对应视图
        const initialHashView = hashView();
        if (initialHashView) S.view = initialHashView;
        render();
    </script>
</body>

</html>

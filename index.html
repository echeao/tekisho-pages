                  <div class="mcs-topline">
                    <span class="mcs-label">対象案件 · 全${list.length}件</span>
                    <span class="mcs-status">${caseStatusChip(c, true)}</span>
                  </div>
                  <span class="mcs-title">${esc(c.title)}</span>
                  <span class="mcs-meta">${esc(c.client || 'クライアント未指定')} · ${esc(c.location || '勤務地未定')} · ${esc(priceText(c.unitPriceText))}</span>
                </div>
                <div class="mcs-actions">
                  <button class="btn sm" data-act="openCaseSheet">切替 ${ico('chevronDown', 1.6)}</button>
                </div>
              </div>
              <div class="match-case-card" id="matchCaseCard"></div>
              <div class="strip" id="strip"></div>
              <section class="cands" id="results"></section>
            </section>
          </div>
        ` : `<div class="empty">該当する案件がありません。上部のステータスを変更するか、「案件一覧」から新規登録してください。</div>`);

            if (list.length && c) {
                drawCaseHeader();
                drawResults();
            }
        }

        /**
         * 生成左侧案件卡片 HTML
         * @param {Object} c 案件数据对象
         * @param {boolean} isActive 是否当前激活选中
         */
        function caseCardHTML(c, isActive) {
            // 提取核心硬性门槛：技能 + 日语，统一走标准文案与单位
            const hardConds = [];
            (c.skillConditions || []).forEach(k => {
                if (k.isHard) {
                    hardConds.push(`${esc(skillLabel(k.skillName))}${k.minYears ? ` ≥${k.minYears}年` : ''}`);
                }
            });
            if (hasJpRequirement(c)) hardConds.push(esc(jpRequirementText(c)));

            return `
        <div class="case-card ${isActive ? 'active' : ''}" data-act="selectCase" data-id="${c.id}" role="button" tabindex="0" aria-label="案件を選択: ${esc(c.title)}">
          <div class="case-card-head">
            <h3 class="case-card-title">${esc(c.title)}</h3>
            ${caseStatusChip(c, true)}
          </div>
          <div class="case-card-meta">
            <span>${ico('briefcase', 1.5, 'ico-inline')} ${esc(c.client || 'クライアント未指定')}</span>
            <span>${ico('pin', 1.5, 'ico-inline')} ${esc(c.location || '勤務地未定')}</span>
          </div>
          <div class="case-card-extra">
            <span class="case-card-price">${esc(priceText(c.unitPriceText))}</span>
            <span class="case-card-date">${esc(c.startDate || '即日')}開始</span>
          </div>
          ${hardConds.length ? `
            <div class="case-card-conds">
              ${hardConds.map(cd => `<span class="chip-cond">${cd}</span>`).join('')}
            </div>
          ` : ''}
        </div>
      `;
        }

        /**
         * 打开手机端案件切换面板（可搜索的底部抽屉）
         */
        function openCaseSheet() {
            const list = S.cases.filter(c => S.statusFilter === 'すべて' || S.statusFilter === '全部' || c.status === S.statusFilter || (S.statusFilter === '募集中' && c.status === '招募中') || (S.statusFilter === '保留' && c.status === '暂停') || (S.statusFilter === '終了' && c.status === '结束'));
            openDrawer('案件を切り替え', `
              <div class="dr-b">
                <div class="case-sheet-search">
                  ${ico('search', 1.7)}
                  <input class="field" id="caseSheetSearch" placeholder="案件名・クライアント・スキルで検索" autocomplete="off">
                </div>
                <div class="case-sheet-list" id="caseSheetList">
                  ${list.map(item => caseCardHTML(item, item.id === S.caseId)).join('')}
                </div>
                <div class="case-sheet-empty" id="caseSheetEmpty" hidden>該当する案件がありません。</div>
              </div>
            `);
        }

        /**
         * 按关键词过滤案件切换面板中的卡片
         * @param {string} value 搜索关键词
         */
        function filterCaseSheet(value) {
            const q = norm(value);
            let shown = 0;
            $$('#caseSheetList .case-card').forEach(card => {
                const c = S.cases.find(x => x.id === card.dataset.id);
                if (!c) return;
                const hay = norm([
                    c.title,
                    c.client || '',
                    c.location || '',
                    (c.skillConditions || []).map(k => k.skillName).join(' ')
                ].join(' '));
                const ok = !q || hay.includes(q);
                card.hidden = !ok;
                if (ok) shown++;
            });
            const empty = $('#caseSheetEmpty');
            if (empty) empty.hidden = shown > 0;
        }

        /** 同步手机端当前案件切换条的标题、状态与摘要 */
        function updateMobileCaseSwitch() {
            const sw = $('#mobileCaseSwitch');
            const c = curCase();
            if (!sw || !c) return;
            const title = sw.querySelector('.mcs-title');
            const meta = sw.querySelector('.mcs-meta');
            const status = sw.querySelector('.mcs-status');
            if (title) title.textContent = c.title;
            if (status) status.innerHTML = caseStatusChip(c, true);
            if (meta) meta.textContent = `${c.client || 'クライアント未指定'} · ${c.location || '勤務地未定'} · ${priceText(c.unitPriceText)}`;
        }

        /**
         * 绘制右侧顶部案件看板及轻量权重指示条
         */
        function drawCaseHeader() {
            const c = curCase();
            if (!c) return;

            // 硬性条件与加分条件（统一技能名称与年限单位）
            const hardSkills = (c.skillConditions || []).filter(k => k.isHard);
            const softSkills = (c.skillConditions || []).filter(k => !k.isHard);
            const hasJLPT = c.jlptRequirement && c.jlptRequirement !== '不限' && c.jlptRequirement !== '不問';
            const hasBiz = c.businessJapaneseRequirement && c.businessJapaneseRequirement !== '不限' && c.businessJapaneseRequirement !== '不問';

            const criteriaHtml = [
                ...hardSkills.map(k => `<span class="crit-badge"><b>${esc(skillLabel(k.skillName))}</b> ${k.minYears ? `≥${k.minYears}年` : '不問'} <span class="crit-lock">必須</span></span>`),
                ...(hasJLPT ? [`<span class="crit-badge"><b>日本語力</b> JLPT ≥${esc(c.jlptRequirement)} <span class="crit-lock">必須</span></span>`] : []),
                ...(hasBiz ? [`<span class="crit-badge"><b>ビジネス日本語</b> 流暢 <span class="crit-lock">必須</span></span>`] : []),
                ...softSkills.map(k => `<span class="crit-badge"><b>${esc(skillLabel(k.skillName))}</b> ${k.minYears ? `≥${k.minYears}年` : '経験歓迎'} <span class="crit-soft">加点</span></span>`)
            ].join('');

            // 权重微指示条
            const wItems = [
                ...(c.skillConditions || []).map((k, i) => ({ name: k.skillName, weight: +k.weight || 0, idx: i })),
                { name: '日本語力', weight: +c.japaneseWeight || 0, isJp: true }
            ];
            const sum = wItems.reduce((a, b) => a + b.weight, 0);

            const weightsBarHtml = `
        <div class="weights-compact" id="compactWeights">
          <span class="weights-compact-label">${ico('sliders', 1.5, 'ico-inline')} スコア重み配分</span>
          <div class="weights-bars-wrap">
            ${wItems.map(item => `
              <div class="w-bar-item" title="${esc(item.name)} 重み: ${item.weight}">
                <span class="w-name">${esc(item.name)}</span>
                <span class="w-val">${item.weight}</span>
                <div class="w-mini-track"><i style="width:${Math.min(item.weight * 2.5, 100)}%"></i></div>
              </div>
            `).join('')}
          </div>
          <span class="weights-total-badge ${sum === 100 ? '' : 'warn'}">
            ${sum === 100 ? `${ico('check', 1.5, 'ico-inline')} 合計 100` : `合計 ${sum} · 推奨 100`}
          </span>
        </div>
      `;

            const headerEl = $('#matchCaseCard');
            if (!headerEl) return;
            headerEl.innerHTML = `
        <div class="match-case-top">
          <div class="match-case-info">
            <h2>
              <span>${esc(c.title)}</span>
              ${caseStatusChip(c, true)}
            </h2>
            <div class="match-case-metas">
              <span>${ico('briefcase', 1.5, 'ico-inline')} <b>${esc(c.client || 'クライアント未指定')}</b></span>
              <span>${ico('pin', 1.5, 'ico-inline')} <b>${esc(c.location || '勤務地未定')}</b></span>
              <span>単価 <b>${esc(priceText(c.unitPriceText))}</b></span>
              <span>開始日 <b class="num">${esc(c.startDate || '即日')}</b></span>
            </div>
          </div>
        </div>
        <div class="criteria-block">
          <div class="criteria-head">
            <span class="criteria-head-label">必須条件 / 加点条件</span>
            <button class="btn ghost sm" data-act="openWeightModal" aria-label="スコアの重みを設定">
              ${ico('sliders', 1.5)}<span>スコア重み設定</span>
            </button>
          </div>
          ${criteriaHtml ? `<div class="criteria-chips-row">${criteriaHtml}</div>` : '<div class="hint" style="font-size:12px;margin:0">選考条件は未設定です。案件管理から追加できます。</div>'}
        </div>
        ${weightsBarHtml}
      `;
        }

        /**
         * 打开评分权重配置模态弹窗
         */
        function openWeightModal() {
            const c = curCase();
            if (!c) return;
            const m = $('#weightModal');
            if (!m) return;

            weightReturnFocus = document.activeElement;
            const baseSkills = (c.skillConditions || []).map(k => +k.weight || 0);
            weightDraft = {
                skills: baseSkills.slice(),
                jp: +c.japaneseWeight || 0,
                baseSkills: baseSkills.slice(),
                baseJp: +c.japaneseWeight || 0
            };
            const sum = weightDraft.skills.reduce((a, v) => a + v, 0) + weightDraft.jp;

            m.innerHTML = `
        <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="weightModalTitle">
          <div class="modal-head">
            <h3 id="weightModalTitle">${ico('sliders', 1.6)} スコア重み設定 · ${esc(c.title)}</h3>
            <button class="btn ghost sm modal-close" data-act="closeWeightModal" aria-label="閉じる">${ico('x')}</button>
          </div>
          <div class="modal-body">
            <div class="form-row" style="margin-bottom:14px">
              <p class="hint" style="margin:0">重みは候補者の適合度ランキングにのみ影響し、必須条件のフィルタには影響しません。合計100への調整を推奨します。</p>
              <button class="btn ghost sm" data-act="resetWeightDraft">初期値に戻す</button>
            </div>
            <div class="modal-weight-list">
              ${(c.skillConditions || []).map((k, i) => `
                <div class="modal-weight-item">
                  <div class="cond-top">
                    <b>${esc(k.skillName)}</b>
                    ${k.isHard ? `<span class="chip acc sm">${ico('lock')}必須</span>` : '<span class="chip sm">加点</span>'}
                    <span class="chip line sm">${k.minYears ? '≥ ' + k.minYears + ' 年' : '不問'}</span>
                    <span class="w" id="m_wv_${i}">${weightDraft.skills[i]}</span>
                  </div>
                  <div class="w-control">
                    <input type="range" min="0" max="100" step="5" value="${weightDraft.skills[i]}" data-bind="modal-cw" data-i="${i}" aria-label="${esc(k.skillName)} 重み">
                    <input class="field num w-num" type="number" inputmode="numeric" min="0" max="100" step="5" value="${weightDraft.skills[i]}" data-bind="modal-cwn" data-i="${i}" aria-label="${esc(k.skillName)} 重みの数値入力">
                  </div>
                </div>
              `).join('')}
              <div class="modal-weight-item">
                <div class="cond-top">
                  <b>日本語要件</b>
                  ${(c.jlptRequirement && c.jlptRequirement !== '不限' && c.jlptRequirement !== '不問') || (c.businessJapaneseRequirement && c.businessJapaneseRequirement !== '不限' && c.businessJapaneseRequirement !== '不問') ? `<span class="chip acc sm">${ico('lock')}必須</span>` : '<span class="chip sm">不問</span>'}
                  <span class="chip line sm">JLPT ${c.jlptRequirement === '不限' || c.jlptRequirement === '不問' ? '不問' : '≥ ' + c.jlptRequirement}</span>
                  <span class="w" id="m_wvj">${weightDraft.jp}</span>
                </div>
                <div class="w-control">
                  <input type="range" min="0" max="100" step="5" value="${weightDraft.jp}" data-bind="modal-jw" aria-label="日本語の重み">
                  <input class="field num w-num" type="number" inputmode="numeric" min="0" max="100" step="5" value="${weightDraft.jp}" data-bind="modal-jwn" aria-label="日本語の重みの数値入力">
                </div>
              </div>
            </div>
            <div class="wsum ${sum <= 0 ? 'bad' : ''}" id="modalWsum" style="margin-top:16px">
              <span>重み合計 <b class="num" id="modalWsumVal">${sum}</b></span>
              <span class="${sum === 100 ? '' : 'faint'}">${sum === 100 ? `${ico('check')} 合計 100` : '推奨合計 100'}</span>
            </div>
          </div>
          <div class="modal-foot">
            <button class="btn ghost" data-act="closeWeightModal">キャンセル</button>
            <button class="btn primary" data-act="saveWeightModal">${ico('check')} 保存して再計算</button>
          </div>
        </div>
      `;

            m.classList.add('show');
            m.setAttribute('aria-hidden', 'false');
            lockPageScroll();
            const firstFocus = m.querySelector('.modal-close');
            if (firstFocus) firstFocus.focus();
        }

        /**
         * 关闭评分权重配置模态弹窗（不写回任何数据，草稿直接丢弃）
         */
        function closeWeightModal() {
            const m = $('#weightModal');
            if (!m || !m.classList.contains('show')) return;
            m.classList.remove('show');
            m.setAttribute('aria-hidden', 'true');
            weightDraft = null;
            unlockPageScroll();
            if (weightReturnFocus && document.contains(weightReturnFocus)) weightReturnFocus.focus();
            weightReturnFocus = null;
        }

        /** 把权重草稿同步到滑块、数字输入与角标 */
        function syncWeightDraftInputs() {
            if (!weightDraft) return;
            const m = $('#weightModal');
            if (!m) return;
            weightDraft.skills.forEach((v, i) => {
                const range = m.querySelector(`[data-bind="modal-cw"][data-i="${i}"]`);
                const num = m.querySelector(`[data-bind="modal-cwn"][data-i="${i}"]`);
                const lbl = $('#m_wv_' + i);
                if (range) range.value = v;
                if (num) num.value = v;
                if (lbl) lbl.textContent = v;
            });
            const jRange = m.querySelector('[data-bind="modal-jw"]');
            const jNum = m.querySelector('[data-bind="modal-jwn"]');
            const jLbl = $('#m_wvj');
            if (jRange) jRange.value = weightDraft.jp;
            if (jNum) jNum.value = weightDraft.jp;
            if (jLbl) jLbl.textContent = weightDraft.jp;
            updateModalWsum();
        }

        /**
         * 实时更新弹窗内的权重总和（基于草稿，不读取案件数据）
         */
        function updateModalWsum() {
            if (!weightDraft) return;
            const sum = weightDraft.skills.reduce((a, v) => a + v, 0) + weightDraft.jp;
            const el = $('#modalWsum');
            const valEl = $('#modalWsumVal');
            if (valEl) valEl.textContent = sum;
            if (el) {
                el.className = 'wsum' + (sum <= 0 ? ' bad' : '');
                const rightSpan = el.querySelector('span:last-child');
                if (rightSpan) rightSpan.innerHTML = sum === 100 ? `${ico('check')} 合計 100` : '推奨合計 100';
            }
        }

        /**
         * 保存模态弹窗内的权重设置并重新计算匹配
         */
        function saveWeightModal() {
            const c = curCase();
            if (!c || !weightDraft) return;
            const sum = weightDraft.skills.reduce((a, v) => a + v, 0) + weightDraft.jp;
            if (sum <= 0) {
                toast('重み合計は0より大きい必要があります');
                return;
            }
            (c.skillConditions || []).forEach((k, i) => {
                k.weight = weightDraft.skills[i] ?? 0;
            });
            c.japaneseWeight = weightDraft.jp;
            persistData();
            drawCaseHeader();
            drawResults();
            closeWeightModal();
            toast('最新のスコア重みでマッチング結果を再計算しました');
        }

        function drawWsum() {
            const c = curCase();
            if (!c) return;
            const sum = (c.skillConditions || []).reduce((a, k) => a + (+k.weight || 0), 0) + (+c.japaneseWeight || 0);
            const el = $('#wsum');
            if (!el) return;
            el.className = 'wsum' + (sum <= 0 ? ' bad' : '');
            el.innerHTML = sum <= 0 ? '<span>重み合計は0より大きい必要があります</span>' : `<span>重み合計 <b class="num">${sum}</b></span><span class="${sum === 100 ? '' : 'faint'}">${sum === 100 ? `${ico('check')} 合計 100` : '推奨合計 100'}</span>`;
        }

        /**
         * 绘制案件匹配分析核心结果视图
         * 涵盖：漏斗式KPI四格指标卡片、候选人排行榜（TOP3专属勋章）、结构化淘汰归因
         */
        function drawResults() {
            const c = curCase();
            const { pass, filtered } = runMatch(c);
            drawWsum();
            const pend = pass.filter(r => r.pending.length).length;
            const rec = pass.filter(r => {
                const recRecord = recOf(c.id, r.t.id);
                return recRecord && (recRecord.status === '已推荐' || recRecord.status === '提案済');
            }).length;
            const passRate = S.techs.length ? Math.round(pass.length / S.techs.length * 100) : 0;

            // 1. 结构化漏斗指示横幅（强化主次与预警层级，纯矢量图标）
            $('#strip').innerHTML = `
        <div>
          <small>必須条件クリア</small>
          <div><b>${pass.length}</b><em>/ ${S.techs.length}名</em></div>
          <div class="strip-sub">必須条件クリア率 <span class="num font-bold">${passRate}%</span></div>
        </div>
        <div>
          <small>フィルタ除外</small>
          <div><b>${filtered.length}</b><em>名</em></div>
          <div class="strip-sub">必須要件未達</div>
        </div>
        <div>
          <small>要確認候補</small>
          <div><b style="${pend > 0 ? 'color:var(--warn)' : 'color:var(--ok)'}">${pend}</b><em>名</em></div>
          <div class="strip-sub">${pend > 0 ? `${ico('warn')} スキル年数・日本語の要確認あり` : `${ico('check')} 全要件の確認済み`}</div>
        </div>
        <div>
          <small>提案済み</small>
          <div><b style="${rec > 0 ? 'color:var(--ok)' : ''}">${rec}</b><em>名</em></div>
          <div class="strip-sub">${rec > 0 ? `${ico('check')} クライアントへ提案済み` : '未提案'}</div>
        </div>
      `;

            const sumW = curCaseSum();
            if (sumW <= 0) {
                $('#results').innerHTML = '<div class="empty">重み合計が0のためスコアを計算できません。いずれかの重みを設定してください。</div>';
                return;
            }

            // 2. 候选人列表卡片与结构化淘汰归因面板（使用矢量ban与x图标）
            const filteredListHtml = filtered.length ? `
        <details class="filtered" ${S.showFiltered ? 'open' : ''} id="flt">
          <summary>
            <span class="flt-sum-title"><span class="flt-icon">${ico('ban')}</span><b>除外 ${filtered.length}名</b>、クリックして理由を表示</span>
            <span class="faint sm">${S.showFiltered ? `閉じる ${ico('chevronUp', 1.6)}` : `詳細を展開 ${ico('chevronDown', 1.6)}`}</span>
          </summary>
          <ul>
            ${filtered.map(r => `
              <li>
                <b>${esc(r.t.name)}</b>
                <div class="filtered-reasons">
                  ${r.out.map(o => `<span class="chip-out">${ico('x')} ${esc(o)}</span>`).join('')}
                </div>
              </li>
            `).join('')}
          </ul>
        </details>
      ` : '';

            const timeFilterBarHtml = `
        <div class="match-time-filter-bar">
          <label class="time-filter-toggle">
            <input type="checkbox" id="matchTimeOnlyCheck" ${S.matchTimeOnly ? 'checked' : ''} data-act="toggleMatchTimeOnly">
            <span>${ico('calendar', 1.4, 'ico-inline')} 稼働時期が合致する候補者のみ表示<span class="only-wide">（時期の重複・遅延を除外）</span></span>
          </label>
          <span class="faint sm">案件開始日 <b class="num">${esc(c.startDate || '即日')}</b></span>
        </div>
      `;

            $('#results').innerHTML = timeFilterBarHtml + (pass.length ? pass.map((r, i) => candHTML(r, i, c)).join('') : '<div class="empty">すべての必須条件を満たす候補者がいません。最低年数を緩和するか、条件を加点対象に変更してください。</div>') + filteredListHtml;

            const fltEl = $('#flt');
            if (fltEl) fltEl.ontoggle = e => S.showFiltered = e.target.open;
        }

        const curCaseSum = () => {
            const c = curCase();
            return c.skillConditions.reduce((a, k) => a + (+k.weight || 0), 0) + (+c.japaneseWeight || 0);
        };

        /**
         * 生成单个匹配候选人卡片 HTML
         * @param {Object} r 匹配计算结果对象
         * @param {number} i 排名索引（0起算）
         * @param {Object} c 当前案件对象
         */
        function candHTML(r, i, c) {
            const t = r.t, rec = recOf(c.id, t.id), open = S.open[t.id];
            const chips = r.items.map(x => `<span class="chip ${x.s >= 1 ? 'full' : x.s > 0 ? 'part' : 'none'}">${esc(x.label)} <i>${x.hasIt ? x.y + '年' : '—'}</i></span>`).join('');

            // 状态与操作分离：提案状态只做展示（更新日期为徽章内小按钮），操作区只保留动作
            const isRec = rec && (rec.status === '已推荐' || rec.status === '提案済');
            const statusChip = !rec
                ? ''
                : isRec
                    ? `<span class="chip ok sm">提案済み ${rec.last.slice(5)}<button class="chip-act" data-act="rec" data-t="${t.id}" title="提案日を更新" aria-label="提案日を更新">${ico('refresh')}</button></span>`

        /**
         * 生成未来 N 个月的筛选选项（以系统基准日 TODAY 起算）
         * @param {number} count 月份数量
         * @returns {Array<{key: string, label: string}>} key 形如 2026-11
         */
        function futureMonthOptions(count = 3) {
            const base = new Date(TODAY + 'T00:00:00');
            const out = [];
            for (let i = 1; i <= count; i++) {
                const d = new Date(base.getFullYear(), base.getMonth() + i, 1);
                const m = d.getMonth() + 1;
                out.push({
                    key: `${d.getFullYear()}-${String(m).padStart(2, '0')}`,
                    label: `${m}月開始`
                });
            }
            return out;
        }

        /**
         * 将月份筛选标签解析为 YYYY-MM（兼容旧版「2026年11月」写法）
         * @param {string} value 筛选值
         * @returns {string|null} 标准化月份键
         */
        function monthKeyOf(value) {
            if (/^\d{4}-\d{2}$/.test(value)) return value;
            const legacy = String(value).match(/^(\d{4})年(\d{1,2})月/);
            if (legacy) return `${legacy[1]}-${String(+legacy[2]).padStart(2, '0')}`;
            const opt = futureMonthOptions().find(o => o.label === value);
            return opt ? opt.key : null;
        }

        /**
         * 技术者筛选：关键词（姓名/技能）+ 可稼働时期
         * @returns {Array} 过滤后的技术者数组
         */
        function techFilterList() {
            const q = norm(S.q);
            const tf = S.techDateFilter || 'すべて';
            const monthKey = monthKeyOf(tf);
            return S.techs.filter(t => {
                const matchQ = !q || norm(t.name).includes(q) || t.skills.some(s => norm(s.name).includes(q));
                let matchDate = true;
                const av = String(t.availableDate || '即日').trim();
                if (tf === '即日稼働可' || tf === '即日可稼働') {
                    matchDate = av === '即日' || av === '随时' || av === '随時';
                } else if (monthKey) {
                    matchDate = av.startsWith(monthKey) || av.startsWith(monthKey.replace('-', '/'));
                } else if (tf === '2027年以降' || tf === '2027年及以后') {
                    matchDate = av.startsWith('2027');
                }
                return matchQ && matchDate;
            });
        }

        /** 页面滚动锁深度计数：支持抽屉、权重弹窗、确认弹窗叠加 */
        let pageLockDepth = 0;

        /**
         * 量取系统经典滚动条占位宽度并写入 CSS 变量 --sbw。
         * scrollbar-gutter: stable 会为滚动条永久预留空间，固定定位的抽屉与遮罩
         * 默认只覆盖布局视口；补上这段宽度后可避免窄桌面窗口右侧出现未变暗的窄缝。
         * 触屏与覆盖式滚动条环境下该值为 0，不影响移动端原有几何尺寸。
         */
        function syncScrollbarGutter() {
            const sbw = Math.max(0, window.innerWidth - document.documentElement.getBoundingClientRect().width);
            document.documentElement.style.setProperty('--sbw', `${sbw}px`);
        }

        /** 锁定页面背景滚动（抽屉 / 弹窗打开时使用，避免手机端背景跟手滑动） */
        function lockPageScroll() {
            pageLockDepth += 1;
            document.documentElement.classList.add('no-scroll');
        }

        /** 解除页面背景滚动锁定（仅当所有覆盖层均关闭时恢复滚动） */
        function unlockPageScroll() {
            pageLockDepth = Math.max(0, pageLockDepth - 1);
            if (!pageLockDepth) document.documentElement.classList.remove('no-scroll');
        }

        /**
         * 打开抽屉
         * @param {string} title 标题（可含受信 HTML 图标）
         * @param {string} html 抽屉主体内容
         * @param {{sheet?: boolean}} [opts] sheet=true 时在手机上以半屏底部面板呈现
         */
        function openDrawer(title, html, opts = {}) {
            const d = $('#drawer');
            if (!d) return;
            syncScrollbarGutter();
            const isSheet = !!opts.sheet;
            const wasOpen = d.classList.contains('on');
            if (!wasOpen) drawerReturnFocus = document.activeElement;
            d.innerHTML = `<div class="dr-h"><h2>${title}</h2><button class="btn ghost sm" data-act="closeDr" aria-label="閉じる">${ico('x')}</button></div>${html}`;
            d.classList.toggle('sheet', isSheet);
            d.setAttribute('aria-hidden', 'false');
            d.setAttribute('role', 'dialog');
            d.setAttribute('aria-modal', 'true');
            d.setAttribute('aria-label', String(title).replace(/<[^>]*>/g, ''));
            $('#scrim').classList.add('on');
            if (!wasOpen) lockPageScroll();
            if (D) D.dirty = false;
            d.classList.add('on');
            const closeBtn = d.querySelector('.dr-h .btn');
            if (closeBtn) closeBtn.focus();
        }

        /** 关闭抽屉（低层方法，保存/删除成功后直接调用） */
        function closeDrawer() {
            const d = $('#drawer');
            if (!d || !d.classList.contains('on')) return;
            d.classList.remove('on');
            $('#scrim').classList.remove('on');
            unlockPageScroll();
            D = null;
            const rf = drawerReturnFocus;
            drawerReturnFocus = null;
            // 先归还焦点再从无障碍树隐藏，避免 aria-hidden 隐藏仍持有焦点的关闭按钮
            if (rf && document.contains(rf)) rf.focus();
            if (d.contains(document.activeElement)) document.activeElement.blur();
            d.setAttribute('aria-hidden', 'true');
        }

        /** 用户主动关闭抽屉：有未保存修改时先确认，避免误触丢失输入 */
        function attemptCloseDrawer() {
            if (D && D.dirty) {
                openConfirm({
                    title: '編集内容を破棄しますか？',
                    message: '保存されていない変更があります。閉じると入力した内容は失われます。',
                    confirmText: '変更を破棄',
                    cancelText: '編集を続ける',
                    onConfirm: closeDrawer
                });
                const d = $('#drawer');
                if (d && d.classList.contains('on')) {
                    const focusTarget = d.querySelector('.dr-h .btn');
                    if (focusTarget) confirmReturnFocus = focusTarget;
                }
                return;
            }
            closeDrawer();
        }

        /**
         * 打开通用确认弹窗
         * @param {{title: string, message: string, confirmText?: string, cancelText?: string, onConfirm?: Function}} opts
         */
        function openConfirm(opts) {
            const m = $('#confirmModal');
            if (!m) return;
            confirmReturnFocus = document.activeElement;
            confirmCallback = opts.onConfirm || null;
            m.innerHTML = `
              <div class="modal-dialog confirm-dialog" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle" aria-describedby="confirmDesc">
                <div class="modal-head">
                  <h3 id="confirmTitle">${esc(opts.title)}</h3>

                  <button class="btn danger solid" data-act="confirmOk">${esc(opts.confirmText || '実行する')}</button>
                </div>
              </div>`;
            m.classList.add('show');
            m.setAttribute('aria-hidden', 'false');
            lockPageScroll();
            requestAnimationFrame(() => {
                const btn = m.querySelector('[data-act="confirmCancel"]');
                if (btn) btn.focus();
            });
        }

        /**
         * 关闭确认弹窗
         * @param {boolean} run 是否执行确认回调
         */
        function closeConfirm(run) {
            const m = $('#confirmModal');
            if (!m || !m.classList.contains('show')) return;
            m.classList.remove('show');
            m.setAttribute('aria-hidden', 'true');
            const cb = confirmCallback;
            confirmCallback = null;
            unlockPageScroll();
            const rf = confirmReturnFocus;
            confirmReturnFocus = null;
            if (rf && document.contains(rf)) rf.focus();
            if (run && cb) cb();
        }

        /**
         * 将 Tab 焦点限制在指定覆盖层内
         * @param {KeyboardEvent} e 键盘事件
         * @param {HTMLElement} container 覆盖层容器
         */
        function trapFocus(e, container) {
            const nodes = [...container.querySelectorAll('a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])')]
                .filter(n => n.offsetParent !== null || n === document.activeElement);
            if (!nodes.length) return;
            const first = nodes[0], last = nodes[nodes.length - 1];
            if (e.shiftKey && (document.activeElement === first || !container.contains(document.activeElement))) {
                e.preventDefault();
                last.focus();
            } else if (!e.shiftKey && (document.activeElement === last || !container.contains(document.activeElement))) {
                e.preventDefault();
                first.focus();
            }
        }

        function caseFilterList() {

            return S.cases.filter(c => {
                const matchQ = !q || norm(c.title).includes(q) || norm(c.client).includes(q) || norm(c.location).includes(q) || c.skillConditions.some(k => norm(k.skillName).includes(q));
                const matchStatus = sf === 'すべて' || sf === '全部' || c.status === sf || (sf === '募集中' && c.status === '招募中') || (sf === '保留' && c.status === '暂停') || (sf === '終了' && c.status === '结束');

                if (monthKey) {
                    matchMonth = sd.startsWith(monthKey) || sd.startsWith(monthKey.replace('-', '/'));
                } else if (cmf === '2027年開始' || cmf === '2027年开始') {
                    matchMonth = sd.startsWith('2027');

                return matchQ && matchStatus && matchMonth;
            });

    <div class="dr-f">
      ${D.isNew ? '' : `<div class="btn-row">${D.confirmDel ? `<button class="btn danger solid" data-act="delCase">削除確認</button> <button class="btn ghost" data-act="cancelDel">キャンセル</button>` : `<button class="btn danger" data-act="askDel">案件を削除</button>`}</div>`}
      <div class="btn-row">
        <button class="btn" data-act="closeDr">キャンセル</button>

      </div>
    </div>
  `;
        }

        function showCaseDrawer() {
            openDrawer(D.isNew ? '案件新規登録' : `案件編集 · ${esc(D.data.title)}`, caseForm());
        }

        /* ============================================================================
           视图 5：提案履歴 (Recommendations View)
           ============================================================================ */
        /**
         * 提案履歴フィルター：キーワード + ステータス（最新提案日順）
         * @returns {Array} フィルタリング後の提案履歴
         */
        function recFilterRows() {
            const q = norm(S.recQ || '');
            const sf = S.recStatusFilter || 'すべて';
            const allRows = [...S.recs].sort((a, b) => b.last.localeCompare(a.last));
            return allRows.filter(r => {
                const c = S.cases.find(x => x.id === r.caseId);
                const t = S.techs.find(x => x.id === r.techId);
                if (!c || !t) return false;
                const matchQ = !q || norm(c.title).includes(q) || norm(c.client).includes(q) || norm(t.name).includes(q) || t.skills.some(s => norm(s.name).includes(q));
                const isRec = r.status === '提案済' || r.status === '已推荐';
                const isWd = r.status === '取下げ済' || r.status === '已撤回';
                const matchStatus = sf === 'すべて' || sf === '全部' ||
                    ((sf === '提案済み' || sf === '提案済') && isRec) ||
                    (sf === '取下げ済' && isWd) ||
                    r.status === sf;
                return matchQ && matchStatus;
            });
        }

        /**
         * 提案履歴テーブル HTML の生成（空の場合はエンプティステートを表示）
         * @param {Array} rows 提案履歴配列
         * @returns {string} HTML 文字列
         */
        function recTableHTML(rows) {
            if (!rows.length) return `<div class="empty">「${esc(S.recQ)}」に一致する提案履歴は見つかりませんでした。</div>`;
            return `
        <div class="tbl-wrap panel">
          <table class="tbl-mobile">
            <thead>
              <tr>

                <th style="width:110px">ステータス</th>
                <th style="width:130px">最終提案日</th>

                <th class="ta-r" style="width:190px">アクション</th>
              </tr>
            </thead>
            <tbody>
              ${rows.map(r => {
                const c = S.cases.find(x => x.id === r.caseId);
                const t = S.techs.find(x => x.id === r.techId);
                if (!c || !t) return '';
                const av = getAvatarTheme(t.name);
                const topSkill = [...t.skills].sort((a, b) => b.years - a.years)[0];
                const isRec = r.status === '提案済' || r.status === '已推荐';
                return `
                  <tr>
                    <td data-label="技術者">
                      <div class="rec-tech-cell">
                        <div class="rec-avatar-sm" style="background:${av.bg};color:${av.color};border:1px solid ${av.border};">${esc(t.name[0] || '技')}</div>
                        <div style="min-width:0">
                          <div style="display:flex;align-items:center;gap:6px">
                            <b>${esc(t.name)}</b>
                            <span class="chip line" style="font-size:10.5px;padding:0 5px">JLPT ${esc(t.jlpt === '未考级' ? '未受験' : t.jlpt === '未知' ? '不明' : (t.jlpt || '不明'))}</span>
                          </div>
                          ${topSkill ? `<div class="faint sm" style="margin-top:2px;font-size:11px">${esc(topSkill.name)} ${topSkill.years}年</div>` : ''}
                        </div>
                      </div>
                    </td>
                    <td data-label="対象案件">
                      <div class="rec-case-cell">
                        <div class="rec-case-title">${esc(c.title)}</div>
                        <div class="rec-case-sub">
                          <span>${esc(c.client || 'クライアント未指定')}</span>
                          ${c.unitPriceText ? `<span class="case-price-badge" style="font-size:11px;padding:1px 5px">${esc(priceText(c.unitPriceText))}</span>` : ''}
                        </div>
                      </div>
                    </td>
                    <td data-label="ステータス">
                      <span class="chip ${isRec ? 'ok' : 'line'}" style="gap:4px">
                        ${isRec ? ico('check') : ico('info')}
                        ${isRec ? '提案済み' : '取下げ済'}
                      </span>
                    </td>
                    <td data-label="最終提案日" class="num" style="font-size:12.5px">${r.last}</td>
                    <td data-label="取下げ日" class="num" style="font-size:12.5px;color:var(--ink3)">${r.withdrawn || '—'}</td>
                    <td data-label="アクション" class="ta-r">
                      <div style="display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap">
                        <button class="btn ghost sm" data-act="goMatchCase" data-id="${c.id}" title="この案件のマッチングワークスペースを開く">
                          ${ico('match')}
                          <span>マッチング</span>
                        </button>
                        ${isRec
                        ? `<button class="btn ghost sm danger-text" data-act="wd2" data-id="${r.id}" title="提案を取り下げます">${ico('x')}<span>取下げ</span></button>`
                        : `<button class="btn sm primary" data-act="re2" data-id="${r.id}" title="この履歴を再利用して再提案します">${ico('refresh')}<span>再提案</span></button>`}
                      </div>
                    </td>
                  </tr>
                `;
            }).join('')}
            </tbody>
          </table>
        </div>
        <p class="hint" style="margin-top:12px">ステータス更新について、同一の案件と技術者の組み合わせは1件のみ保持されます。再提案時は日付が自動更新され、取下げと再提案のサイクルに対応しています。</p>
      `;
        }

        /** 提案履歴テーブルと件数カウントのみをリフレッシュ */
        function updateRecList() {
            const box = $('#recList');
            if (!box) return;
            const rows = recFilterRows();
            box.innerHTML = recTableHTML(rows);
            const cnt = $('#recCount');
            if (cnt) cnt.textContent = `${rows.length}${rows.length !== S.recs.length ? ` / ${S.recs.length}` : ''}`;
        }

        function vRecs() {
            const sf = S.recStatusFilter || 'すべて';

            const allRows = [...S.recs].sort((a, b) => b.last.localeCompare(a.last));
            const activeCount = S.recs.filter(r => r.status === '提案済' || r.status === '已推荐').length;
            const withdrawnCount = S.recs.filter(r => r.status === '取下げ済' || r.status === '已撤回').length;
            const caseCount = new Set(S.recs.map(r => r.caseId)).size;
            const techCount = new Set(S.recs.map(r => r.techId)).size;
            const filteredRows = recFilterRows();

            const toolbar = `
          <input class="field search" id="recQInput" placeholder="技術者名、案件名、スキルで検索..." value="${esc(S.recQ || '')}">
          <div class="seg" role="tablist">
            ${['すべて', '提案済み', '取下げ済'].map(st => `
              <button data-act="filterRecStatus" data-s="${st}" aria-pressed="${sf === st || (sf === '全部' && st === 'すべて') || (sf === '提案済' && st === '提案済み')}">${st} (${st === 'すべて' ? allRows.length : st === '提案済み' ? activeCount : withdrawnCount})</button>
            `).join('')}
          </div>
      `;

            $('#view').innerHTML = head(
                '提案履歴',
                `提案履歴一覧 <span class="faint num h-count" id="recCount">${filteredRows.length}${filteredRows.length !== allRows.length ? ` / ${allRows.length}` : ''}</span>`,
                `同一案件・技術者の組み合わせは1件のみ記録されます。取下げ後の再提案時は日付が自動更新されます。現在提案済み${activeCount}名、取下げ済${withdrawnCount}名。`,
                toolbar
            ) + `
        <!-- KPI 指標カードストリップ (KPI Strip) -->
        <div class="rec-strip">
          <div class="rec-stat-card">
            <div class="rec-stat-head">
              <span>提案済みの候補</span>
              ${ico('check')}
            </div>
            <div class="rec-stat-val" style="color:var(--ok)">${activeCount}</div>
            <div class="rec-stat-desc">選考・面談待ち</div>
          </div>
          <div class="rec-stat-card">
            <div class="rec-stat-head">
              <span>取下げ済の提案</span>
              ${ico('info')}
            </div>
            <div class="rec-stat-val" style="color:var(--ink2)">${withdrawnCount}</div>
            <div class="rec-stat-desc">履歴を保持し、いつでも再提案可能</div>
          </div>
          <div class="rec-stat-card">
            <div class="rec-stat-head">
              <span>提案カバー規模</span>
              ${ico('match')}
            </div>
            <div class="rec-stat-val" style="color:var(--accent)">${caseCount}<small style="font-size:14px;color:var(--ink3);margin-left:3px">案件</small> / ${techCount}<small style="font-size:14px;color:var(--ink3);margin-left:3px">名</small></div>            <div class="rec-stat-desc">案件と技術者の提案実績</div>
          </div>
        </div>

        <div id="recList">${recTableHTML(filteredRows)}</div>
      `;

            const qi = $('#recQInput');
            if (qi) {
                qi.oninput = e => {
                    S.recQ = e.target.value;
                    updateRecList();
                };
            }
        }

        /* ============================================================================
           视图 6：単一ファイル Excel 取込 (Import View)
           .xlsx バイナリローカル解凍読込 + 人手による確認フロー
           ============================================================================ */

        function vImport() {
            const st = S.imp.step;
            const steps = ['ファイル選択', 'プレビュー・確認', '登録完了'].map((l, i) =>
                `<div class="${st === i + 1 ? 'on' : st > i + 1 ? 'done' : ''}">
      <b>${st > i + 1 ? ico('check', 2.2) : i + 1}</b><span>${l}</span>
    </div>`
            ).join('');

            let body = '';
            if (st === 1) {
                body = `
      <label class="drop" id="drop" for="fi" tabindex="0">
        ${ico('file', 1.4)}
        <b style="font:700 18px var(--display)">技術者のスキルシート（.xlsx）をドロップまたは選択</b>
        <span class="muted">単一ファイル取込。ブラウザローカルで安全に解凍・解析。外部サーバーへの送信は一切行いません。</span>
        <span class="btn primary" style="pointer-events:none">ローカルファイルを選択</span>
        <input id="fi" type="file" accept=".xlsx,.xls" hidden>
      </label>

      <div class="callout info">
        ${ico('info')}
        <span>ご案内。元のExcelファイル自体は保持せず、構造化データのみを抽出してファイル名と取込日時を記録します。解析に失敗した場合は手動登録も可能です。</span>
      </div>
    `;
            } else if (st === 2) {
                const p = S.imp.data;
                const dup = S.techs.some(t => t.sourceFileName === S.imp.file);
                body = `
      ${dup ? `<div class="callout">${ico('info')}<span>同名のスキルシート「${esc(S.imp.file)}」から登録された技術者が既に存在します。このまま保存すると新規データとして追加されます（自動上書きはされません）。</span></div>` : ''}
      <div class="pf">
        <section class="panel">
          <div class="panel-h">
            <h2>抽出プレビュー</h2>
            <span class="chip warn">ハイライト項目は要確認</span>
          </div>
          <div class="panel-b" id="pf">
            <div class="pf-row">
              <span>技術者氏名</span>
              <span class="chip ok">認識済</span>
              <input class="field" id="pfName" value="${esc(p.name)}">
            </div>
            <div class="pf-row q">
              <span>JLPT レベル</span>
              <span class="chip warn">要確認</span>
              <div>
                <select class="sel" id="pfJ">${opts(JL_OPT, p.jlpt)}</select>
                <small>${p.q?.jlpt || '取得資格・認定証を確認してください'}</small>
              </div>
            </div>
            <div class="pf-row q">
              <span>ビジネス日本語</span>
              <span class="chip warn">要確認</span>
              <div>
                <select class="sel" id="pfB">${opts(BZ_OPT, p.biz)}</select>
                <small>${p.q?.biz || '会話力・実務コミュニケーション力を確認してください'}</small>
              </div>
            </div>
            <div style="padding:14px 0 4px"><b>スキル・実務経験年数の確認</b></div>
            ${p.skills.map((s, i) => `
              <div class="pf-row ${s[2] === '待核对' || s[2] === '要確認' ? 'q' : ''}" data-sk="${i}">
                <input class="field" value="${esc(s[0])}">
                <input class="field num" type="number" step="0.1" min="0" value="${s[1] ?? ''}" placeholder="年数">
                <small>${esc(s[3] === '导入提取' || s[3] === '取込抽出' ? '取込抽出' : (s[3] || '取込抽出'))}</small>
              </div>
            `).join('')}
          </div>
        </section>
        <aside class="stack">
          <div class="panel">
            <div class="panel-b stack">
              <b>取込メタ情報</b>
              <div class="kv">
                <span>元ファイル名</span><span>${esc(S.imp.file)}</span>
                <span>取込日時</span><span class="num">${TODAY}</span>
                <span>取込方法</span><span>単一ファイル取込</span>
              </div>
            </div>
          </div>
          <div class="panel">
            <div class="panel-b stack">
              <b>項目取込の補足</b>
              <span class="muted sm">性別・国籍・居住地などの基本情報は個人プロフィールとして保存されます。マッチング判定とスコアリングでは主にスキル実務年数と日本語力を対象とします。</span>
            </div>
          </div>
          <div class="btn-row">
            <button class="btn" data-act="impBack">ファイル再選択</button>
            <button class="btn primary" data-act="impSave">確認して技術者を登録</button>
          </div>
        </aside>
      </div>

      ${p.projects?.length ? `
        <section class="panel" style="margin-top:20px">
          <div class="panel-h" style="padding-bottom:14px">
            <div style="display:flex;align-items:center;gap:10px">
              <h2>抽出された職歴・プロジェクト経歴</h2>
              <span class="chip ok sm">${p.projects.length}件の経歴</span>
            </div>
            <span class="faint sm">登録後は技術者詳細画面でいつでも確認できます</span>
          </div>
          <div class="panel-b" style="padding-top:0">
            ${renderFullProfile(p)}
          </div>
        </section>
      ` : ''}
    `;
            } else if (st === 3) {
                body = `
      <div class="panel">
        <div class="panel-b stack" style="text-align:center;padding:44px 20px;justify-items:center">
          <div class="avatar" style="background:var(--ok-soft);color:var(--ok)">${ico('check', 2)}</div>
          <h2 style="font:700 22px var(--display)">技術者プロフィールの登録が完了しました</h2>
          <p class="muted">「${esc(S.imp.savedName)}」が技術者リストに追加され、ブラウザのローカルストレージに自動保存されました。</p>
          <div class="btn-row">
            <button class="btn primary" data-act="nav" data-v="techs">技術者一覧を見る</button>
            <button class="btn" data-act="impBack">続けて次のファイルを取込</button>
          </div>
        </div>
      </div>
    `;
            }

            $('#view').innerHTML = head('スキルシート取込', 'スキルシート解析・確認', '標準的な技術者スキルシート（.xlsx）に対応。ブラウザローカルで安全に解析し、内容を確認した上でデータベースへ登録します。') +
                `<div class="steps">${steps}</div>` + body;

            // ファイルアップロード・ドロップイベントのバインド
            const fi = $('#fi');
            if (fi) {
                fi.onchange = async e => {
                    const f = e.target.files[0];
                    if (f) await parseUploadFile(f);
                };
            }
            const dp = $('#drop');
            if (dp) {
                ['dragover', 'dragenter'].forEach(ev => dp.addEventListener(ev, e => {
                    e.preventDefault();
                    dp.classList.add('over');
                }));
                ['dragleave', 'drop'].forEach(ev => dp.addEventListener(ev, e => {
                    e.preventDefault();
                    dp.classList.remove('over');
                }));
                dp.addEventListener('drop', async e => {
                    const f = e.dataTransfer.files[0];
                    if (f) await parseUploadFile(f);
                });
            }
        }

        async function parseUploadFile(f) {
            if (!/\.xlsx$/i.test(f.name)) {
                toast('.xlsx 形式の Excel ファイルのみ対応しています');
                return;
            }
            toast('ローカル解析中: ' + f.name);
            try {
                const buf = await f.arrayBuffer();
                const data = await TechXlsxParser.parseBuffer(buf, f.name);
                S.imp = { step: 2, file: f.name, data };
                vImport();
                toast('解析が完了しました。抽出内容をご確認ください');
            } catch (err) {
                console.error('Excel 解析エラー:', err);
                alert('解析エラー: ' + (err.message || '互換性のないファイル形式です') + '\n標準のスキルシートテンプレートか確認するか、手動登録をお試しください。');
            }
        }

        /* ============================================================================
           视图 7：データ管理 (Backup & Storage View)
           ============================================================================ */
        function snapshot() {
            return {
                version: '1.1',
                exportedAt: new Date().toISOString(),
                notice: '本バックアップは元のExcelファイル本体を含まず、構造化データのみを保持します',
                technicians: S.techs,
                cases: S.cases,
                recommendations: S.recs
            };

        function vBackup() {
            const json = JSON.stringify(snapshot(), null, 2);
            const b = S.bak || {};
            $('#view').innerHTML = head('データ管理', 'バックアップ・データ復元', 'すべての技術者、案件、提案履歴はお使いのブラウザ（LocalStorage）にリアルタイムで保存されています。PCの変更やブラウザのキャッシュクリアを行う前に、定期的なバックアップをお勧めします。') +
                `<div class="three">
      <!-- エクスポート -->
      <section class="panel">
        <div class="panel-h"><h2>JSON バックアップのエクスポート</h2></div>
        <div class="panel-b stack">
          <div class="callout info">
            ${ico('info')}
            <span><b>バックアップの内容</b> 本ファイルには全技術者・案件・提案履歴が含まれます。元のExcelファイル本体は含まれません。</span>
          </div>
          <div class="kv">
            <span>登録技術者数</span><span class="num">${S.techs.length}名</span>
            <span>登録案件数</span><span class="num">${S.cases.length}件</span>
            <span>提案履歴数</span><span class="num">${S.recs.length}件</span>
          </div>
          <pre class="json" tabindex="0">${esc(json)}</pre>
          <div class="btn-row">
            <button class="btn primary" data-act="downloadJson">${ico('download')}JSON バックアップを保存</button>
            <button class="btn" data-act="copyJson">${ico('copy')}内容をコピー</button>
          </div>
        </div>
      </section>

      <!-- 復元 -->
      <section class="panel">
        <div class="panel-h"><h2>バックアップからの復元</h2></div>
        <div class="panel-b stack">
          <p class="muted">以前エクスポートした JSON バックアップファイルをアップロードするか、下のテキストエリアに貼り付けてください。</p>
          <input type="file" id="restoreFileInput" accept=".json,application/json" hidden>
          <button class="btn primary" data-act="uploadRestoreFile">${ico('upload')}ローカル JSON ファイルを選択</button>
          <textarea class="field" id="rtxt" placeholder="またはここに JSON テキストを直接貼り付けてください...">${esc(b.text || '')}</textarea>
          ${b.err ? `<div class="callout bad">${ico('info')}<span>${esc(b.err)} システムデータは変更されていません。</span></div>` : ''}
          ${b.ok && !b.confirm ? `<div class="callout info">${ico('info')}<span>データ構造を検証しました。${b.ok}</span></div>` : ''}
          ${b.confirm ? `
            <div class="callout bad">
              ${ico('info')}
              <span><b>復元を実行すると現在の全データが上書きされます！</b>この操作は取り消せません。続行してもよろしいですか？</span>
            </div>
            <div class="btn-row">
              <button class="btn danger solid" data-act="doRestore">上書きして復元</button>
              <button class="btn ghost" data-act="cancelRestore">キャンセル</button>
            </div>
          ` : `<button class="btn" data-act="checkRestore">テキストを検証して復元</button>`}
        </div>
      </section>

      <!-- 初期化・データ消去 -->
      <section class="panel">
        <div class="panel-h"><h2>システム初期化・データ消去</h2></div>
        <div class="panel-b stack">
          <p class="muted">ブラウザに保存されているローカルデータをすべてクリアし、初期状態にリセットします。新規データ登録時などにご利用ください。</p>
          ${S.wipe ? `
            <div class="callout bad">${ico('info')}<span><b>警告</b> ローカルデータをすべて消去しますか？この操作は取り消せません。</span></div>
            <div class="btn-row">
              <button class="btn danger solid" data-act="doWipe">完全に初期化する</button>
              <button class="btn ghost" data-act="cancelWipe">キャンセル</button>
            </div>
          ` : `<button class="btn danger" data-act="askWipe">全データを初期化する</button>`}
        </div>
      </section>
    </div>`;

            const fi = $('#restoreFileInput');
            if (fi) {
                fi.onchange = async e => {
                    const f = e.target.files[0];
                    if (!f) return;
                    try {
                        const text = await f.text();
                        $('#rtxt').value = text;
                        A.checkRestore();
                    } catch (err) {
                        alert('バックアップファイルの読み込みに失敗しました: ' + err.message);
                    }
                    e.target.value = '';
                };
            }
        }

        /* ============================================================================
           統一イベント処理ディスパッチャー (Actions Handler)
           ============================================================================ */
        const A = {
            nav(el) {
                goView(el.dataset.v);
            },
            openMobileMenu() {
                showMobileMenuDrawer();
            },
            mobileNav(el) {
                closeDrawer();
                goView(el.dataset.v);
            },
            filterTechDate(el) {
                S.techDateFilter = el.dataset.d;
                vTechs();
            },
            filterCaseMonth(el) {
                S.caseMonthFilter = el.dataset.m;
                vCases();
            },
            toggleMatchTimeOnly(el) {
                S.matchTimeOnly = el.checked;
                drawResults();
            },
            setTechDateFast(el) {
                if (D && D.data) {
                    D.data.availableDate = el.dataset.v;
                    D.dirty = true;
                    const inp = $('#techAvailInput');
                    if (inp) inp.value = el.dataset.v;
                }
            },
            goMatchCase(el) {
                S.view = 'match';
                S.caseId = el.dataset.id;
                S.open = {};
                window.scrollTo(0, 0);
                pushHash('match');
                render();
            },
            status(el) {
                S.statusFilter = el.dataset.s;
                S.open = {};
                vMatch();
            },
            selectCase(el) {
                const id = el.dataset.id;
                if (!id) return;
                if (id === S.caseId) {
                    if ($('#drawer').classList.contains('on')) closeDrawer();
                    return;
                }
                S.caseId = id;
                S.open = {};
                S.showFiltered = false;
                // 部分更新：卡片激活态、手机切换条与匹配工作台
                $$('#casePickerList [data-act="selectCase"], #caseSheetList [data-act="selectCase"]').forEach(n => n.classList.toggle('active', n.dataset.id === id));
                updateMobileCaseSwitch();
                drawCaseHeader();
                drawResults();
                if ($('#drawer').classList.contains('on')) closeDrawer();
                // 手机端切换案件后回到结果顶部
                if (isNarrowViewport()) {
                    const anchor = $('#mobileCaseSwitch') || $('#matchWorkspace');
                    if (anchor && typeof anchor.scrollIntoView === 'function') {
                        const rect = anchor.getBoundingClientRect();
                        if (rect.top < 0 || rect.top > window.innerHeight - 160) {
                            anchor.scrollIntoView({ behavior: 'smooth', block: 'start' });
                        }
                    }
                }
            },
            openWeightModal() {
                openWeightModal();
            },
            closeWeightModal() {
                closeWeightModal();
            },
            saveWeightModal() {
                saveWeightModal();
            },
            resetWeightDraft() {
                if (!weightDraft) return;
                weightDraft.skills = weightDraft.baseSkills.slice();
                weightDraft.jp = weightDraft.baseJp;
                syncWeightDraftInputs();
            },
            openCaseSheet() {
                openCaseSheet();
            },
            confirmCancel() {
                closeConfirm(false);
            },
            confirmOk() {
                closeConfirm(true);
            },
            filterCaseStatus(el) {
                S.caseStatusFilter = el.dataset.s;
                vCases();
            },
            filterRecStatus(el) {
                S.recStatusFilter = el.dataset.s;
                vRecs();
            },
            exp(el) {
                S.open[el.dataset.t] = !S.open[el.dataset.t];
                drawResults();
            },
            rec(el) {
                const c = curCase(), id = el.dataset.t, r = recOf(c.id, id), t = S.techs.find(x => x.id === id);
                if (!r) {
                    S.recs.push({ id: uid('r'), caseId: c.id, techId: id, status: '提案済', last: TODAY, withdrawn: null });
                    toast(`「${c.title}」への提案を記録しました`);
                } else if (r.status === '提案済' || r.status === '已推荐') {
                    r.last = TODAY;
                    toast('提案日を更新しました');
                } else {
                    r.status = '提案済';
                    r.last = TODAY;
                    toast('再提案を記録し、ステータスを「提案済み」に更新しました');
                }
                persistData();
                renderNav();
                drawResults();
            },
            wd(el) {
                const c = curCase();
                const id = el.dataset.t;
                const r = recOf(c.id, id);
                if (!r) return;
                const t = S.techs.find(x => x.id === id);
                openConfirm({
                    title: '提案の取下げ',
                    message: `「${c.title}」への ${t ? t.name : 'この技術者'} の提案を取り下げます。取下げ後も履歴は残り、いつでも再提案できます。`,
                    confirmText: '取下げる',
                    onConfirm: () => {
                        r.status = '取下げ済';
                        r.withdrawn = TODAY;
                        persistData();
                        toast('提案を取り下げました');
                        renderNav();
                        drawResults();
                    }
                });
            },
            wd2(el) {
                const r = S.recs.find(x => x.id === el.dataset.id);
                if (!r) return;
                const c = S.cases.find(x => x.id === r.caseId);
                const t = S.techs.find(x => x.id === r.techId);
                openConfirm({
                    title: '提案の取下げ',
                    message: `「${c ? c.title : 'この案件'}」への ${t ? t.name : 'この技術者'} の提案を取り下げます。取下げ後も履歴は残り、いつでも再提案できます。`,
                    confirmText: '取下げる',
                    onConfirm: () => {
                        r.status = '取下げ済';
                        r.withdrawn = TODAY;
                        persistData();
                        toast('提案を取り下げました');
                        renderNav();
                        if (S.view === 'overview') vOverview();
                        else vRecs();
                    }
                });
            },
            re2(el) {
                const r = S.recs.find(x => x.id === el.dataset.id);
                if (!r) return;
                r.status = '提案済';
                r.last = TODAY;
                persistData();
                renderNav();
                toast('再提案を記録しました');
                if (S.view === 'overview') vOverview();
                else vRecs();
            },
            closeDr() {
                attemptCloseDrawer();
            },
            newTech() {
                D = {
                    kind: 'tech',
                    isNew: true,
                    data: {
                        id: uid('t'), name: '',
                        skills: [],
                        jlpt: '不明', biz: '不明',
                        projects: [], sourceFileName: null, importedAt: null,
                        importMethod: '手動登録', availableDate: '即日', note: ''
                    }
                };
                showTechDrawer();
            },
            toggleTechDetail(el) {
                const id = el.dataset.id;
                S.openTech[id] = !S.openTech[id];
                vTechs();
            },
            editTech(el) {
                D = { kind: 'tech', data: clone(S.techs.find(t => t.id === el.dataset.id)) };
                showTechDrawer();
            },
            addSkill() {
                D.data.skills.push(sk('', 1));
                D.dirty = true;
                refreshDr();
            },
            delSkill(el) {
                D.data.skills.splice(+el.dataset.i, 1);
                D.dirty = true;
                refreshDr();
            },
            askDel() { D.confirmDel = true; refreshDr(); },
            cancelDel() { D.confirmDel = false; refreshDr(); },
            saveTech() {
                const t = D.data;
                t.skills = t.skills.filter(s => s.name.trim()).map(s => ({ ...s, name: s.name.trim().replace(/\s+/g, ' ') }));
                if (!t.name.trim()) { toast('技術者氏名を入力してください'); return; }
                t.updatedAt = TODAY;
                const i = S.techs.findIndex(x => x.id === t.id);
                if (i < 0) S.techs.push(t); else S.techs[i] = t;
                persistData();
                closeDrawer();
                render();
                toast('技術者プロフィールを保存しました');
            },
            delTech() {
                S.techs = S.techs.filter(t => t.id !== D.data.id);
                S.recs = S.recs.filter(r => r.techId !== D.data.id);
                persistData();
                closeDrawer();
                render();
                toast('技術者データを削除しました');
            },
            newCase() {
                D = {
                    kind: 'case', isNew: true,
                    data: {
                        id: uid('c'), title: '', client: '', location: '', unitPriceText: '',
                        startDate: TODAY, status: '募集中',
                        skillConditions: [
                            { skillName: '', minYears: 1, isHard: false, weight: 50 }
                        ],
                        jlptRequirement: '不問', businessJapaneseRequirement: '不問', japaneseWeight: 50
                    }
                };
                showCaseDrawer();
            },
            editCase(el) {
                D = { kind: 'case', data: clone(S.cases.find(c => c.id === el.dataset.id)) };
                showCaseDrawer();
            },
            addCond() {
                D.data.skillConditions.push({ skillName: '', minYears: null, isHard: false, weight: 10 });
                D.dirty = true;
                refreshDr();
            },
            delCond(el) {
                D.data.skillConditions.splice(+el.dataset.i, 1);
                D.dirty = true;
                refreshDr();
            },
            saveCase() {
                const c = D.data;
                if (caseErrors(c).length) return;
                const i = S.cases.findIndex(x => x.id === c.id);
                if (i < 0) S.cases.push(c); else S.cases[i] = c;
                persistData();
                closeDrawer();
                render();
                toast('案件情報を保存しました');
            },
            delCase() {
                S.cases = S.cases.filter(c => c.id !== D.data.id);
                S.recs = S.recs.filter(r => r.caseId !== D.data.id);
                persistData();
                closeDrawer();
                render();
                toast('案件を削除しました');
            },
            impBack() {
                S.imp = { step: 1, file: null, data: null };
                vImport();
            },
            impSave() {
                const p = S.imp.data;
                const rows = $$('[data-sk]').map(r => {
                    const i = $$('input', r);
                    return { n: i[0].value.trim(), y: i[1].value };
                }).filter(r => r.n);

                const name = $('#pfName').value.trim();
                if (!name) { toast('技術者氏名を入力してください'); return; }

                const newTech = {
                    id: uid('t'),
                    name,
                    kana: p.kana || '',
                    gender: p.gender || 'その他',
                    age: p.age || 0,
                    nationality: p.nationality || '中国',
                    address: p.address || '',
                    stayInJapan: p.stayInJapan || 0,
                    role: p.role || (p.projects?.[0]?.role) || 'SE',
                    education: p.education || { degree: '未登録', major: '' },
                    languages: p.languages || { ja: $('#pfJ').value, en: '—', zh: (p.nationality === '中国' ? 'ネイティブ' : '—') },
                    domains: p.domains || [],
                    phases: p.phases || [],
                    management: p.management || null,
                    certifications: p.certifications || [],
                    projects: p.projects || [],
                    skills: rows.map(r => ({
                        name: r.n,
                        years: r.y === '' ? 0 : +r.y,
                        source: r.y === '' ? '要確認' : '取込抽出',
                        note: ''
                    })),
                    jlpt: $('#pfJ').value,
                    biz: $('#pfB').value,
                    sourceFileName: S.imp.file,
                    importedAt: TODAY,
                    importMethod: '単一ファイル取込',
                    availableDate: p.availableDate || '即日',
                    note: p.note || '実務年数はExcelの業務経歴より算出。確認・登録済。'
                };

                const existingIndex = S.techs.findIndex(t => t.name === name || (t.sourceFileName && t.sourceFileName === S.imp.file));
                if (existingIndex >= 0) {
                    newTech.id = S.techs[existingIndex].id;
                    S.techs[existingIndex] = newTech;
                } else {
                    S.techs.unshift(newTech);
                }

                persistData();
                S.imp = { step: 3, file: S.imp.file, savedName: name };
                renderNav();
                vImport();
                toast(`技術者「${name}」を登録しました（職歴${newTech.projects.length}件）`);
            },
            downloadJson() {
                const t = JSON.stringify(snapshot(), null, 2);
                const blob = new Blob([t], { type: 'application/json' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `適所_技術者・案件マッチングバックアップ_${TODAY}.json`;
                a.click();
                URL.revokeObjectURL(a.href);
                toast('バックアップファイルをダウンロードしました');
            },
            copyJson() {
                const t = JSON.stringify(snapshot(), null, 2);
                (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject())
                    .then(() => toast('JSON をクリップボードにコピーしました'))
                    .catch(() => {
                        const p = $('pre.json');
                        const r = document.createRange();
                        r.selectNodeContents(p);
                        const s = getSelection();
                        s.removeAllRanges();
                        s.addRange(r);
                        toast('テキストを選択しました。Ctrl+C でコピーしてください');
                    });
            },
            uploadRestoreFile() {
                $('#restoreFileInput').click();
            },
            checkRestore() {
                const text = $('#rtxt').value;
                S.bak = { text };
                try {
                    const j = JSON.parse(text);
                    const techs = j.technicians || j.techs;
                    const cases = j.cases;
                    const recs = j.recommendations || j.recs;
                    if (!Array.isArray(techs) || !Array.isArray(cases) || !Array.isArray(recs)) {
                        throw new Error('technicians/techs、cases または recommendations リストが見つかりません');
                    }
                    S.bak.ok = `技術者${techs.length}名、案件${cases.length}件、提案履歴${recs.length}件。`;
                    S.bak.confirm = true;
                    S.bak.json = { techs, cases, recs };
                } catch (e) {
                    S.bak.err = e instanceof SyntaxError ? '有効な JSON 形式ではありません。' : e.message;
                }
                vBackup();
            },
            cancelRestore() {
                S.bak = { text: S.bak.text };
                vBackup();
            },
            doRestore() {
                const j = S.bak.json;
                S.techs = j.techs;
                S.cases = j.cases;
                S.recs = j.recs;
                S.bak = null;
                S.caseId = S.cases[0]?.id || null;
                persistData();
                render();
                toast('バックアップから全データを正常に復元しました');
            },
            askWipe() { S.wipe = true; vBackup(); },
            cancelWipe() { S.wipe = false; vBackup(); },
            doWipe() {
                S.techs = []; S.cases = []; S.recs = [];
                S.wipe = false; S.caseId = null;
                persistData();
                render();
                toast('ローカルデータを完全に初期化しました');
            },
        };

        function refreshDr() {
            const d = $('#drawer');
            const keep = d.querySelector('.dr-b')?.scrollTop || 0;
            const h = D.kind === 'tech' ? techForm() : caseForm();
            d.querySelectorAll('.dr-b, .dr-f').forEach(n => n.remove());
            d.insertAdjacentHTML('beforeend', h);
            const b = d.querySelector('.dr-b');
            if (b) b.scrollTop = keep;
        }

        /* 全局监听与快捷交互 */
        document.addEventListener('click', e => {
            const el = e.target.closest('[data-act]');
            if (el && A[el.dataset.act]) A[el.dataset.act](el);
        });
        $('#scrim').onclick = attemptCloseDrawer;
        document.addEventListener('keydown', e => {
            const cm = $('#confirmModal');
            const wm = $('#weightModal');
            const dr = $('#drawer');
            if (e.key === 'Escape') {
                // 按层级关闭最上层覆盖层，避免一次 Esc 关闭多层
                if (cm && cm.classList.contains('show')) closeConfirm(false);
                else if (wm && wm.classList.contains('show')) closeWeightModal();
                else if (dr && dr.classList.contains('on')) attemptCloseDrawer();
                return;
            }
            if (e.key === 'Tab') {
                if (cm && cm.classList.contains('show')) return trapFocus(e, cm);
                if (wm && wm.classList.contains('show')) return trapFocus(e, wm);
                if (dr && dr.classList.contains('on')) return trapFocus(e, dr);
            }
            // 键盘可访问性：role="button" 的卡片支持 Enter / 空格触发
            const t = e.target;
            if ((e.key === 'Enter' || e.key === ' ') && t && t.matches &&
                t.matches('[data-act][role="button"]')) {
                e.preventDefault();
                t.click();
            }
        });
        const wmEl = $('#weightModal');
        if (wmEl) wmEl.onclick = e => { if (e.target === e.currentTarget) closeWeightModal(); };
        const cmEl = $('#confirmModal');
        if (cmEl) cmEl.onclick = e => { if (e.target === e.currentTarget) closeConfirm(false); };

        // 浏览器前进/后退（手机返回键）恢复对应视图
        window.addEventListener('popstate', applyViewFromHash);
        window.addEventListener('hashchange', applyViewFromHash);

        document.addEventListener('input', e => {
            const t = e.target, b = t.dataset.bind;
            // 案件切换面板的即时搜索（不重建抽屉，保持输入法焦点）
            if (t.id === 'caseSheetSearch') {
                filterCaseSheet(t.value);
                return;
            }
            if (b) {
                // 权重弹窗：只更新草稿，绝不直接改案对象
                if (b === 'modal-cw' || b === 'modal-cwn' || b === 'modal-jw' || b === 'modal-jwn') {
                    if (!weightDraft) return;
                    // 数字输入被清空时保留空值等待继续输入，避免强行变 0
                    if ((b === 'modal-cwn' || b === 'modal-jwn') && t.value === '') return;
                    const v = Math.max(0, Math.min(100, Math.round(+t.value || 0)));
                    if (b === 'modal-jw' || b === 'modal-jwn') {
                        weightDraft.jp = v;
                    } else {
                        weightDraft.skills[+t.dataset.i] = v;
                    }
                    syncWeightDraftInputs();
                    return;
                }
                const c = curCase(), v = +t.value;
                if (b === 'cw') {
                    c.skillConditions[+t.dataset.i].weight = v;
                    $('#wv' + t.dataset.i).textContent = v;
                } else {
                    c.japaneseWeight = v;
                    $('#wvj').textContent = v;
                }
                persistData();
                drawResults();
                return;
            }
            const k = t.dataset.b;
            if (!k || !D) return;
            const d = D.data, i = +t.dataset.i;
            D.dirty = true;
            if (D.kind === 'tech') {
                if (k === 'sn') d.skills[i].name = t.value;
                else if (k === 'sy') d.skills[i].years = +t.value;
                else if (k === 'ss') d.skills[i].source = t.value;
                else d[k] = t.value;
            } else {
                if (k === 'kn') d.skillConditions[i].skillName = t.value;
                else if (k === 'km') d.skillConditions[i].minYears = t.value === '' ? null : +t.value;
                else if (k === 'kh') d.skillConditions[i].isHard = t.checked;
                else if (k === 'kw') d.skillConditions[i].weight = +t.value;
                else if (k === 'japaneseWeight') d[k] = +t.value;
                else d[k] = t.value;

                // 只联动校验状态，不重建输入框（手机端中文/日文输入法与键盘焦点保持稳定）
                syncCaseValidation();
            }
        });

        // 首次渲染加载：支持 #match / #techs 等深链接直接进入对应视图
        const initialHashView = hashView();
        if (initialHashView) S.view = initialHashView;
        render();
    </script>
</body>

</html>

                { bg: 'color-mix(in srgb, #B02E1C 13%, var(--surface))', color: 'var(--bad)', border: 'color-mix(in srgb, #B02E1C 28%, transparent)' },
                { bg: 'color-mix(in srgb, #0284C7 13%, var(--surface))', color: '#0284C7', border: 'color-mix(in srgb, #0284C7 28%, transparent)' },
                { bg: 'color-mix(in srgb, #0E7490 13%, var(--surface))', color: '#0E7490', border: 'color-mix(in srgb, #0E7490 28%, transparent)' }
            ];
            let hash = 0;
            const s = String(name || '');
            for (let i = 0; i < s.length; i++) hash = (hash * 31 + s.charCodeAt(i)) >>> 0;
            return themes[hash % themes.length];
        }

        let toastT;
        // 权重弹窗草稿：仅在“保存”时写回案件，取消/遮罩/Esc 均不污染原始数据
        let weightDraft = null;
        // 叠层焦点记忆：关闭后归还到触发按钮，保证键盘操作连续
        let weightReturnFocus = null;
        let drawerReturnFocus = null;
        let confirmReturnFocus = null;
        let confirmCallback = null;
        function toast(m) {
            const t = $('#toast');
            t.textContent = m;
            t.classList.add('on');
            clearTimeout(toastT);
            toastT = setTimeout(() => t.classList.remove('on'), 2500);
        }

        /* ---------------- 初始结构定义与通用构建函数 ---------------- */
        const sk = (n, y, s = '手工录入') => ({ name: n, years: y, source: s, note: '' });

        /**
         * 纯净初始空数据结构（用于系统初始化或清空数据库）
         * 正式投产使用：不再包含任何硬编码假人档案或测试案件
         */
        const seed = () => ({
            techs: [],
            cases: [],
            recs: []
        });

        /* ---------------- 本地持久化层 (LocalStorage Store) ---------------- */
        // 正式投产版持久化键名，与旧测试版数据彻底隔离
        const STORAGE_KEY = 'tekisho_matching_data_v2';
        const LEGACY_STORAGE_KEY = 'tekisho_matching_data_v1';

        /**
         * 读取本地持久化数据，具备自动迁移与脏数据过滤机制
         */
        function loadPersistedData() {
            try {
                // 优先读取正式版 v2 缓存
                let raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const p = JSON.parse(raw);
                    if (Array.isArray(p.techs) && Array.isArray(p.cases) && Array.isArray(p.recs)) {
                        p.techs.forEach(t => {
                            if (!t.availableDate) t.availableDate = '即日';
                        });
                        return p;
                    }
                }

                // 若无 v2，检测历史 v1 存储并智能迁移（过滤历史硬编码种子数据）
                const legacyRaw = localStorage.getItem(LEGACY_STORAGE_KEY);
                if (legacyRaw) {
                    const lp = JSON.parse(legacyRaw);
                    if (Array.isArray(lp.techs) && Array.isArray(lp.cases) && Array.isArray(lp.recs)) {
                        // 检测是否为旧版硬编码种子数据（特征：包含 t_yut 或 c1-c5 种子标识）
                        const isSeedData = lp.techs.some(t => t.id === 't_yut' || t.id === 't1') && lp.cases.some(c => c.id === 'c1');
                        if (!isSeedData) {
                            // 为用户自行导入的真实数据，自动平滑升级至 v2
                            lp.techs.forEach(t => { if (!t.availableDate) t.availableDate = '即日'; });
                            localStorage.setItem(STORAGE_KEY, JSON.stringify({ ...lp, version: '2.0' }));
                            return lp;
                        } else {
                            // 为旧测试种子数据，自动清理历史废弃存储，保障正式使用纯净
                            localStorage.removeItem(LEGACY_STORAGE_KEY);
                        }
                    }
                }
            } catch (e) {
                console.warn('[Storage] 读取本地缓存失败:', e);
            }
            return null;
        }

        function persistData() {
            try {
                const payload = {
                    version: '2.0',
                    techs: S.techs,
                    cases: S.cases,
                    recs: S.recs,
                    updatedAt: new Date().toISOString()
                };
                localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
            } catch (e) {
                console.error('[Storage] 写入本地存储异常:', e);
            }
        }

        // 初始化全局响应式状态 S（无硬编码种子数据）
        const initialSaved = loadPersistedData();
        const baseDataset = initialSaved || seed();
        let S = {
            ...baseDataset,
            view: 'overview', // 默认进入总览大盘
            statusFilter: '募集中',
            caseId: baseDataset.cases?.[0]?.id || null, // 动态绑定首个案件或 null
            q: '',
            open: {},
            showFiltered: false,
            openTech: {},
            caseQ: '',
            caseStatusFilter: 'すべて',
            caseMonthFilter: 'すべて', // 案件开始月份筛选
            techDateFilter: 'すべて',  // 技术者可稼働时期筛选
            matchTimeOnly: false,   // 匹配工作台是否仅看时间满足人选
            recQ: '',
            recStatusFilter: 'すべて',
            imp: { step: 1, file: null, data: null }
        };

        /**
         * 厳格に技術者の稼働時期と案件開始日を比較判定
         * @param {string} techAvail 技術者稼働可能時期（'即日' または 'YYYY-MM-DD' 等）
         * @param {string} caseStart 案件開始予定日（'即日' または 'YYYY-MM-DD' 等）
         * @returns {{ status: 'pass'|'warn'|'conflict'|'unknown', text: string, diffDays: number }}
         */
        function checkTimeMatch(techAvail, caseStart) {
            const ta = String(techAvail || '').trim();
            const cs = String(caseStart || '').trim();
            if (!cs || cs === '即日' || cs === '未定' || cs === '不限' || cs === '不問') {
                return { status: 'pass', text: '案件即日/随時開始', diffDays: 0 };
            }
            if (!ta || ta === '即日' || ta === '随时' || ta === '随時' || ta === '相談') {
                return { status: 'pass', text: '即日稼働可（随時入場可）', diffDays: 0 };
            }
            const tDate = new Date(ta.replace(/\//g, '-'));
            const cDate = new Date(cs.replace(/\//g, '-'));
            if (isNaN(tDate.getTime()) || isNaN(cDate.getTime())) {
                return { status: 'unknown', text: `稼働日: ${ta || '未定'}`, diffDays: 0 };
            }
            const diffMs = tDate.getTime() - cDate.getTime();
            const diffDays = Math.round(diffMs / (1000 * 60 * 60 * 24));
            if (diffDays <= 0) {
                return { status: 'pass', text: `時期適合（${ta} 入場可）`, diffDays };
            } else if (diffDays <= 15) {
                return { status: 'warn', text: `要相談（${ta}、${diffDays}日遅延）`, diffDays };
            } else {
                const months = (diffDays / 30).toFixed(1);
                return { status: 'conflict', text: `時期不一致（${ta}、約${months}ヶ月遅延）`, diffDays };
            }
        }

        /* ---------------- 匹配计算引擎 (PRD v1.1 §6.4 规范算法，兼容中日文字符) ---------------- */
        const JR = { N1: 5, N2: 4, N3: 3, N4: 2, N5: 1 };
        const JS = { N1: 1, N2: .8, N3: .6, N4: .3, N5: .3, '未受験': 0, '未考级': 0, '不明': 0, '未知': 0 };
        const BS = { 'ビジネス流暢': 1, '商务流畅': 1, '日常会話': .6, '日常沟通': .6, '簡単な会話': .3, '简单沟通': .3, '不明': 0, '不明': 0, '未知': 0 };

        /**
         * 判定一条技术者技能是否"无年数记录"
         * 约定：years 为空、'' 或 ≤0 均视为年数未确认
         * @param {Object|null} f 技术者技能对象
         * @returns {boolean}
         */
        function skillNoYears(f) {
            return !!f && !(+f.years > 0);
        }

        function evaluate(c, t) {
            // 无年数技能（Excel 仅登记技能名，无实绩年数）的语义：
            // 1) 判定为"有过相关经验"，作为普通技能对待；
            // 2) 不参与权重加点评分（也不计入权重分母，避免拉低总分）；
            // 3) 命中必須(isHard)条件时不自动淘汰，改为"要確認"挂起人工判断。
            const noYearSkill = k => skillNoYears(t.skills.find(s => norm(s.name) === norm(k.skillName)));
            const hard = [], items = [], pending = [], out = [];
            let sw = c.japaneseWeight || 0, acc = 0;
            // 无年数技能不参与权重判定：权重分母中同样剔除，保持其余条件分数不被稀释
            c.skillConditions.forEach(k => {
                if (noYearSkill(k)) return;
                sw += +k.weight || 0;
            });
            const raw = [];

            // 0. 时间硬性判定与可解释性
            const timeCheck = checkTimeMatch(t.availableDate, c.startDate);
            hard.push({
                label: '稼働可能時期',
                tech: t.availableDate || '即日',
                req: c.startDate ? c.startDate + ' 開始' : '即日',
                st: timeCheck.status === 'pass' ? 'pass' : (timeCheck.status === 'warn' ? 'pend' : (S.matchTimeOnly ? 'fail' : 'pend'))
            });
            if (timeCheck.status === 'warn') {
                pending.push(`稼働希望日「${t.availableDate}」は案件開始日（${c.startDate}）より${timeCheck.diffDays}日遅れるため、顧客との入場時期の調整が必要です。`);
            }
            if (S.matchTimeOnly && timeCheck.status === 'conflict') {
                out.push(`稼働希望日（${t.availableDate || '未定'}）が案件開始日（${c.startDate}）より${timeCheck.diffDays}日遅延`);
            }

            // 1. 技能硬性判断与得分
            for (const k of c.skillConditions) {
                const f = t.skills.find(s => norm(s.name) === norm(k.skillName));
                // 无年数技能：判定为有过相关经验，但不参与权重加点评分；
                // 命中必須条件时不自动判 fail，改为"要確認"挂起人工判断（安全匹配）
                if (noYearSkill(k)) {
                    raw.push({
                        label: k.skillName,
                        tech: '経験あり（年数要確認）',
                        req: k.minYears ? '≥ ' + k.minYears + ' 年' : '要件満たす',
                        s: null, w: +k.weight || 0, y: 0, hasIt: true, flag: true
                    });
                    if (k.isHard) {
                        hard.push({ label: k.skillName, tech: '経験あり（年数要確認）', req: '≥ ' + k.minYears + ' 年', st: 'pend' });
                        pending.push(`スキル「${k.skillName}」の実務経験はあるが年数が確認できないため、自動足切りせず要確認（加点評価の対象外）。`);
                    }
                    continue;
                }
                const y = f ? +f.years : 0;
                if (k.isHard) {
                    const ok = !!f && y >= k.minYears;
                    hard.push({ label: k.skillName, tech: f ? y + ' 年' : '無', req: '≥ ' + k.minYears + ' 年', st: ok ? 'pass' : 'fail' });
                    if (!ok) out.push(f ? `${k.skillName} ${y}年 < 要件${k.minYears}年` : `${k.skillName} 未経験`);
                }
                const s = k.minYears ? Math.min(y / k.minYears, 1) : (f ? 1 : 0);
                raw.push({ label: k.skillName, tech: f ? y + ' 年' : '無', req: k.minYears ? '≥ ' + k.minYears + ' 年' : '要件満たす', s, w: +k.weight || 0, y, hasIt: !!f, flag: f && (f.source === '待核对' || f.source === '要確認') });
            }

            // 2. 日语双字段硬性条件判断 (D1)
            const needJ = c.jlptRequirement && c.jlptRequirement !== '不限' && c.jlptRequirement !== '不問';
            const needB = c.businessJapaneseRequirement && c.businessJapaneseRequirement !== '不限' && c.businessJapaneseRequirement !== '不問';
            if (needJ) {
                const r = JR[t.jlpt];
                if (r) {
                    const ok = r >= JR[c.jlptRequirement];
                    hard.push({ label: 'JLPT', tech: t.jlpt, req: '≥ ' + c.jlptRequirement, st: ok ? 'pass' : 'fail' });
                    if (!ok) out.push(`JLPT ${t.jlpt} < ${c.jlptRequirement}`);
                } else {
                    hard.push({ label: 'JLPT', tech: t.jlpt, req: '≥ ' + c.jlptRequirement, st: 'pend' });
                    const isBizUnknown = !t.biz || t.biz === '未知' || t.biz === '不明';
                    pending.push(!isBizUnknown ? `JLPTは「${t.jlpt}」、ビジネス日本語は「${t.biz}」。次元が異なるため自動足切りせず、要確認。` : `JLPTは「${t.jlpt}」、${c.jlptRequirement}要件を満たすか判定できないため要確認。`);
                }
            }
            if (needB) {
                const b = t.biz;
                if (!b || b === '未知' || b === '不明') {
                    hard.push({ label: 'ビジネス日本語', tech: b || '不明', req: 'ビジネス流暢', st: 'pend' });
                    pending.push('ビジネス日本語レベルが不明のため、人手による確認が必要です。');
                } else {
                    const ok = b === '商务流畅' || b === 'ビジネス流暢';
                    hard.push({ label: 'ビジネス日本語', tech: b, req: 'ビジネス流暢', st: ok ? 'pass' : 'fail' });
                    if (!ok) out.push(`ビジネス日本語「${b}」がビジネス流暢未満`);
                }
            }

            // 3. 日语单项得分映射 (D9)
            let js = 1, jnote = '要件不問';
            if (needJ || needB) {
                const c1 = [];
                if (JR[t.jlpt]) c1.push(JS[t.jlpt]);
                if (t.biz && t.biz !== '未知' && t.biz !== '不明') c1.push(BS[t.biz]);
                if (c1.length) {
                    js = Math.max(...c1);
                    jnote = '高い方の評価値を採用';
                } else {
                    js = 0;
                    jnote = '不明のため0点換算';
                    if (!pending.length || !pending.some(p => p.includes('日本語') || p.includes('日语'))) {
                        pending.push('日本語レベルが不明のため0点換算。人手による確認が必要です。');
                    }
                }
            }

            // 4. 加权贡献累加
            raw.forEach(r => {
                r.contrib = sw ? (r.s * r.w / sw * 100) : 0;
                items.push(r);
                acc += r.contrib;
            });
            const jc = sw ? (js * (c.japaneseWeight || 0) / sw * 100) : 0;
            acc += jc;

            return {
                t, hard, items, pending, out, timeCheck,
                total: acc, js, jnote, jc, jw: c.japaneseWeight || 0, sw,
                rel: raw.reduce((a, r) => a + r.y, 0),
                jlabel: [t.jlpt, t.biz].join(' / ')
            };
        }

        function runMatch(c) {
            const res = S.techs.map(t => evaluate(c, t));
            const pass = res.filter(r => !r.out.length).sort((a, b) => b.total - a.total || b.js - a.js || b.rel - a.rel);
            return { pass, filtered: res.filter(r => r.out.length) };
        }

        const curCase = () => S.cases.find(c => c.id === S.caseId) || S.cases[0];
        const recOf = (cid, tid) => S.recs.find(r => r.caseId === cid && r.techId === tid);

        /* ============================================================================
           零依赖原生 Excel (.xlsx) 本地二进制解析器 (TechXlsxParser)
           基于浏览器原生 DataView 与 DecompressionStream 解压，不发起网络请求
           ============================================================================ */
        const TechXlsxParser = {
            splitList(s) {
                return String(s || '').split(/[\r\n,、/／]+/).map(x => x.trim()).filter(Boolean);
            },
            excelDate(v) {
                if (!v || isNaN(v)) return '';
                const d = new Date(Math.round((v - 25569) * 864e5));
                if (isNaN(d.getTime())) return '';
                const y = d.getUTCFullYear(), m = String(d.getUTCMonth() + 1).padStart(2, '0');
                return `${y}年${m}月`;
            },
            cleanSystem(t) {
                const m = String(t || '').match(/【システム】\s*([\s\S]*)/);
                if (m) {
                    const lines = m[1].split(/\r?\n/).map(x => x.trim()).filter(Boolean);
                    if (lines[0]) return lines[0].replace(/^[・\-]?\s*/, '');
                }
                const first = String(t || '').split(/\r?\n/).map(x => x.trim()).filter(Boolean)[0] || '';
                return first.replace(/^[・\-]?\s*/, '');
            },
            extractTech(t) {
                const out = [];
                String(t || '').split(/\r?\n/).forEach(line => {
                    line = line.trim();
                    if (!line || /^【/.test(line)) return;
                    line.split(/[、,，]/).forEach(x => {
                        x = x.trim();
                        if (x && !/^(なし|無し|なし。)$/.test(x)) out.push(x);
                    });
                });
                return out;
            },
            markToLevel(m) {
                if (m == null) return 0;
                const s = String(m);
                if (s.includes('◎')) return 3;
                if (/[○〇◯]/.test(s)) return 2;
                if (/[△▲]/.test(s)) return 1;
                return 0;
            },
            nz(s) { return String(s == null ? '' : s).replace(/[\s\u3000]/g, ''); },
            colToNum(s) {
                let n = 0;
                for (const ch of String(s).replace(/[^A-Z]/g, '')) n = n * 26 + (ch.charCodeAt(0) - 64);
                return n;
            },
            numToCol(n) {
                let s = '';
                while (n > 0) {
                    const m = (n - 1) % 26;
                    s = String.fromCharCode(65 + m) + s;
                    n = Math.floor((n - 1) / 26);
                }
                return s;
            },
            refParts(ref) {
                const m = /^([A-Z]+)(\d+)$/.exec(ref);
                return { r: +m[2], c: this.colToNum(m[1]) };
            },
            refStr(r, c) { return this.numToCol(c) + r; },
            childElems(el) { return Array.from(el.childNodes).filter(n => n.nodeType === 1); },
            local(el) { return el.localName || String(el.tagName).replace(/^.*:/, ''); },
            elems(root, name) { return Array.from(root.getElementsByTagName('*')).filter(e => this.local(e) === name); },
            siText(el) {
                let s = '';
                for (const n of this.childElems(el)) {
                    const ln = this.local(n);
                    if (ln === 't') s += n.textContent;
                    else if (ln === 'r') for (const rc of this.childElems(n)) if (this.local(rc) === 't') s += rc.textContent;
                }
                return s;
            },
            async unzip(buf) {
                const dv = new DataView(buf), u8 = new Uint8Array(buf);
                let eocd = -1;
                const min = Math.max(0, buf.byteLength - 22 - 0xFFFF);
                for (let i = buf.byteLength - 22; i >= min; i--) {
                    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
                }
                if (eocd < 0) throw new Error('不是有效的 .xlsx 文件（ZIP 头部标记未检出）');
                const count = dv.getUint16(eocd + 10, true);
                let off = dv.getUint32(eocd + 16, true);
                const entries = {};
                for (let i = 0; i < count; i++) {
                    if (dv.getUint32(off, true) !== 0x02014b50) break;
                    const method = dv.getUint16(off + 10, true);
                    const csize = dv.getUint32(off + 20, true);
                    const nameLen = dv.getUint16(off + 28, true);
                    const extraLen = dv.getUint16(off + 30, true);
                    const commentLen = dv.getUint16(off + 32, true);
                    const localOff = dv.getUint32(off + 42, true);
                    const name = new TextDecoder('utf-8').decode(u8.subarray(off + 46, off + 46 + nameLen));
                    const lnameLen = dv.getUint16(localOff + 26, true);
                    const lextraLen = dv.getUint16(localOff + 28, true);
                    const dataStart = localOff + 30 + lnameLen + lextraLen;
                    entries[name] = { method, data: u8.subarray(dataStart, dataStart + csize) };
                    off += 46 + nameLen + extraLen + commentLen;
                }
                return entries;
            },
            async inflate(entry) {
                if (!entry) return null;
                if (entry.method === 0) return new TextDecoder('utf-8').decode(entry.data);
                if (entry.method === 8) {
                    if (typeof DecompressionStream === 'undefined') throw new Error('当前浏览器缺少原生 DecompressionStream 支持');
                    const stream = new Blob([entry.data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
                    return new TextDecoder('utf-8').decode(await new Response(stream).arrayBuffer());
                }
                throw new Error('不支持的压缩方法：' + entry.method);
            },
            parseXml(t) {
                const d = new DOMParser().parseFromString(t, 'application/xml');
                if (this.elems(d, 'parsererror').length) throw new Error('XML 解析错误');
                return d;
            },
            async readXlsx(buf) {
                const zip = await this.unzip(buf);
                let shared = [];
                if (zip['xl/sharedStrings.xml']) {
                    const doc = this.parseXml(await this.inflate(zip['xl/sharedStrings.xml']));
                    shared = this.elems(doc, 'si').map(si => this.siText(si));
                }
                const wbDoc = this.parseXml(await this.inflate(zip['xl/workbook.xml']));
                const relMap = {};
                if (zip['xl/_rels/workbook.xml.rels']) {
                    const rd = this.parseXml(await this.inflate(zip['xl/_rels/workbook.xml.rels']));
                    this.elems(rd, 'Relationship').forEach(r => { relMap[r.getAttribute('Id')] = r.getAttribute('Target'); });
                }
                const sheets = this.elems(wbDoc, 'sheet').map(s => ({ name: s.getAttribute('name'), target: relMap[s.getAttribute('r:id')] }));
                const out = [];
                for (const sh of sheets) {
                    let t = sh.target || '';
                    t = t.replace(/^\//, '');
                    if (!/^xl\//.test(t)) t = 'xl/' + t;
                    const entry = zip[t];
                    if (!entry) continue;
                    out.push({ name: sh.name, sheet: this.makeSheet(this.parseSheet(await this.inflate(entry), shared)) });
                }
                return out;
            },
            parseSheet(text, shared) {
                const doc = this.parseXml(text), raw = {};
                let maxR = 0, maxC = 0;
                this.elems(doc, 'c').forEach(c => {
                    const ref = c.getAttribute('r');
                    if (!ref) return;
                    const p = this.refParts(ref);
                    const t = c.getAttribute('t');
                    let val = '';
                    const v = this.childElems(c).find(x => this.local(x) === 'v');
                    const is = this.childElems(c).find(x => this.local(x) === 'is');
                    if (t === 's' && v) val = shared[+v.textContent] || '';
                    else if ((t === 'inlineStr' || t === 'str') && is) val = this.siText(is);
                    else if (t === 'str' && v) val = v.textContent;
                    else if (v) val = v.textContent;
                    if (val !== '') raw[ref] = val;
                    if (p.r > maxR) maxR = p.r;
                    if (p.c > maxC) maxC = p.c;
                });
                const merges = this.elems(doc, 'mergeCell').map(m => m.getAttribute('ref')).filter(Boolean);
                return { raw, merges, maxR, maxC };
            },
            makeSheet(parsed) {
                const { raw, merges, maxR, maxC } = parsed, owner = {};
                merges.forEach(ref => {
                    const [a, b] = ref.split(':');
                    const pa = this.refParts(a), pb = b ? this.refParts(b) : pa;
                    for (let r = pa.r; r <= pb.r; r++) for (let c = pa.c; c <= pb.c; c++) owner[this.refStr(r, c)] = a;
                });
                return {
                    raw, merges, maxR, maxC,
                    rawAt: (r, c) => raw[this.refStr(r, c)],
                    at: (r, c) => {
                        const k = this.refStr(r, c);
                        if (raw[k] != null) return raw[k];
                        const o = owner[k];
                        return o != null ? raw[o] : undefined;
                    }
                };
            },
            findLabel(sheet, text) {
                const t = this.nz(text);
                for (let r = 1; r <= sheet.maxR; r++) {
                    for (let c = 1; c <= sheet.maxC; c++) {
                        const v = sheet.rawAt(r, c);
                        if (v && this.nz(v).includes(t)) return { r, c };
                    }
                }
                return null;
            },
            firstRight(sheet, p, span = 10) {
                const base = this.nz(sheet.at(p.r, p.c));
                for (let i = 1; i <= span; i++) {
                    const v = sheet.at(p.r, p.c + i);
                    if (v == null) continue;
                    const s = String(v).trim();
                    if (!s || this.nz(s) === base) continue;
                    return s;
                }
                return '';
            },
            firstBelow(sheet, p, span = 4) {
                const base = this.nz(sheet.at(p.r, p.c));
                for (let i = 1; i <= span; i++) {
                    const v = sheet.at(p.r + i, p.c);
                    if (v == null) continue;
                    const s = String(v).trim();
                    if (!s || this.nz(s) === base) continue;
                    return s;
                }
                return '';
            },
            toMonths(s) {
                const m = String(s || '').match(/(\d{4})\D*(\d{1,2})?/);
                if (!m) return null;
                return +m[1] * 12 + ((+(m[2] || 1)) - 1);
            },
            /**
             * 将解析出的 Sheet 适配为 v1.1 规范的预填数据
             */
            async parseBuffer(buf, fileName) {
                const sheets = await this.readXlsx(buf);
                const chosen = sheets.find(sh => sh.sheet && (this.findLabel(sh.sheet, '技術経験') || this.findLabel(sh.sheet, '氏名'))) || sheets[0];
                if (!chosen || !chosen.sheet) throw new Error('未识别到履历表结构');
                const sheet = chosen.sheet;

                // 1. 姓名
                let name = '';
                const nameLbl = this.findLabel(sheet, '氏名');
                if (nameLbl) name = this.firstRight(sheet, nameLbl, 10);
                if (!name) name = fileName.replace(/\.[^.]+$/, '').replace(/_スキルシート|_経歴書/g, '');

                // 2. 性别、国籍、住所、滞日经历
                const gLbl = this.findLabel(sheet, '性別');
                const gender = gLbl ? (this.firstBelow(sheet, gLbl, 4) || '其他') : '其他';
                const natLbl = this.findLabel(sheet, '国籍');
                const nationality = natLbl ? this.firstBelow(sheet, natLbl, 4) : '中国';
                const adLbl = this.findLabel(sheet, '住所');
                const address = adLbl ? this.firstBelow(sheet, adLbl, 4) : '';
                const stLbl = this.findLabel(sheet, '滞日経験');
                let stayInJapan = 0;
                if (stLbl) stayInJapan = parseInt(String(this.firstBelow(sheet, stLbl, 4)).replace(/[^\d]/g, ''), 10) || 0;

                // 3. 学历与专业
                const edLbl = this.findLabel(sheet, '最終学歴');
                const degree = edLbl ? this.firstBelow(sheet, edLbl, 4) : '';
                const mjLbl = this.findLabel(sheet, '専攻');
                const major = mjLbl ? this.firstBelow(sheet, mjLbl, 4) : '';
                const education = { degree: degree || '修士', major: major || 'コンピュータ科学および応用' };

                // 4. 年龄
                let age = 0;
                const agLbl = this.findLabel(sheet, '年齢');
                if (agLbl) {
                    for (let i = 1; i <= 6; i++) {
                        const v = sheet.at(agLbl.r + i, agLbl.c);
                        if (v && /^\d{1,3}$/.test(String(v).trim())) {
                            age = +String(v).trim();
                            break;
                        }
                    }
                }

                // 4.5 稼働可能時期
                let availableDate = '即日';
                const avLbl = this.findLabel(sheet, '稼働可能') || this.findLabel(sheet, '稼働時期') || this.findLabel(sheet, '参画可能') || this.findLabel(sheet, '稼働') || this.findLabel(sheet, '参画時期');
                if (avLbl) {
                    const avVal = this.firstRight(sheet, avLbl, 6) || this.firstBelow(sheet, avLbl, 2);
                    if (avVal) {
                        const rawAv = String(avVal).trim();
                        if (/即日|いつでも|随时|相談/i.test(rawAv)) {
                            availableDate = '即日';
                        } else {
                            const ym = rawAv.match(/(\d{4})[年/\-.](\d{1,2})/);
                            if (ym) {
                                const y = ym[1], m = String(ym[2]).padStart(2, '0');
                                const dMatch = rawAv.match(/(\d{1,2})日/);
                                const d = dMatch ? String(dMatch[1]).padStart(2, '0') : '01';
                                availableDate = `${y}-${m}-${d}`;
                            }
                        }
                    }
                }

                // 5. 资格证书与语言推断
                let jlpt = '未知', biz = '未知';
                const certLbl = this.findLabel(sheet, '資格');
                const certs = [];
                if (certLbl) {
                    for (let r = certLbl.r + 1; r <= certLbl.r + 8; r++) {
                        const ct = sheet.at(r, 7);
                        if (ct == null) continue;
                        const nm = String(ct).trim();
                        if (!nm || this.nz(nm) === '内容' || this.nz(nm) === '時間') continue;
                        const tm = sheet.at(r, 2);
                        let date = '';
                        const ts = tm == null ? '' : String(tm).trim();
                        if (/^\d+(\.\d+)?$/.test(ts)) date = this.excelDate(parseFloat(ts));
                        else if (ts) date = ts;
                        certs.push({ date, name: nm });
                    }
                }
                const certsStr = certs.map(c => c.name).join(' ');
                if (/(日本語能力試験|JLPT)\s*N1|検定１級|１級|N1/i.test(certsStr)) jlpt = 'N1';
                else if (/N2/i.test(certsStr)) jlpt = 'N2';
                else if (/N3/i.test(certsStr)) jlpt = 'N3';

                let enLang = '—';
                certs.forEach(c => {
                    if (/TOEIC|英語/i.test(c.name)) enLang = c.name;
                });
                if (nationality === '中国' || nationality === '日本') biz = '日常会話';

                // 6. 得意业务
                const domains = [];
                const dl = this.findLabel(sheet, '得意業務'), tl = this.findLabel(sheet, '得意技術');
                if (dl) {
                    for (let r = dl.r + 1; r <= (tl ? tl.r - 1 : dl.r + 6); r++) {
                        const v = sheet.at(r, dl.c);
                        if (v) this.splitList(v).forEach(x => domains.push(x));
                    }
                }

                // 7. 整体工程阶段
                const phases = [];
                const ph = this.findLabel(sheet, '要件定義');
                const phaseCols = { 20: '要件定義', 21: '基本設計', 22: '機能設計', 23: '詳細設計', 24: '製造', 25: '単体試験', 26: '結合試験', 27: '総合試験', 28: '運用試験', 29: '教育' };
                if (ph) {
                    let best = { n: -1, row: null };
                    for (let r = ph.r + 1; r <= ph.r + 5; r++) {
                        let k = 0;
                        for (const c in phaseCols) if (this.markToLevel(sheet.at(r, +c))) k++;
                        if (k > best.n) best = { n: k, row: r };
                    }
                    if (best.row != null) {
                        for (const c in phaseCols) if (this.markToLevel(sheet.at(best.row, +c))) phases.push(phaseCols[c]);
                    }
                }

                // 8. 团队管理
                let management = null;
                const m1 = this.findLabel(sheet, '5人以下'), m2 = this.findLabel(sheet, '6～10人') || this.findLabel(sheet, '6~10人');
                if (m1 || m2) {
                    management = {
                        under5: +(m1 ? String(sheet.at(m1.r, 9)).replace(/[^\d]/g, '') || 0 : 0),
                        upTo10: +(m2 ? String(sheet.at(m2.r, 9)).replace(/[^\d]/g, '') || 0 : 0)
                    };
                }

                // 9. 真实 22 段项目经历高精度提取
                const projects = [];
                const pjLbl = this.findLabel(sheet, 'システム名');
                const phaseColNames = { 36: '要件定義', 37: '基本設計', 38: '機能設計', 39: '詳細設計', 40: '製造', 41: '単体試験', 42: '結合試験', 43: '総合試験', 44: '運用試験', 45: '教育', 46: 'その他' };
                const pr0 = pjLbl ? pjLbl.r + 2 : 1;
                for (let r = pr0; r <= sheet.maxR; r++) {
                    const cr = sheet.rawAt(r, 3);
                    if (cr == null) continue;
                    const crS = String(cr);
                    if (!/\d{4}/.test(crS)) continue;
                    const per = crS.split(/\r?\n/).map(x => x.trim()).filter(x => x && !/^[|｜\-—~～]+$/.test(x));
                    const sysRaw = String(sheet.at(r, 7) || '');
                    const projectPhases = [];
                    for (const c in phaseColNames) {
                        if (this.markToLevel(sheet.at(r, +c))) projectPhases.push(phaseColNames[c]);
                    }
                    const tech = [];
                    [22, 28].forEach(col => {
                        const v = sheet.at(r, col);
                        if (v) this.extractTech(v).forEach(x => tech.push(x));
                    });
                    const team = +((sysRaw.match(/所属チーム[：:]\s*(\d+)/) || [])[1]) || 0;
                    const descMatch = sysRaw.match(/【作業内容】([\s\S]*)/);
                    const desc = descMatch ? descMatch[1].replace(/\s+/g, ' ').trim().slice(0, 300) : '';

                    projects.push({
                        from: per[0] || '',
                        to: (per[1] && !/^[|｜\-—~～]+$/.test(per[1])) ? per[1] : (per[0] || ''),
                        system: this.cleanSystem(sysRaw),
                        role: String(sheet.at(r, 34) || '').trim() || 'SE',
                        phases: projectPhases,
                        tech: [...new Set(tech)],
                        teamSize: team,
                        desc
                    });
                }

                const techRole = projects.length ? (projects[0].role || 'SE') : 'SE';

                // 10. 技能矩阵提取并推算年限
                const skills = [];
                const idLbl = this.findLabel(sheet, '技術経験');
                const endLbl = this.findLabel(sheet, 'プロジェクト経験');
                const s0 = idLbl ? idLbl.r + 1 : 1;
                const s1 = endLbl ? endLbl.r - 1 : sheet.maxR;
                const skillCols = [5, 12, 19, 26, 33, 40];
                const seen = {};

                for (let r = s0; r <= s1; r++) {
                    for (const sc of skillCols) {
                        const nm = sheet.at(r, sc);
                        if (!nm) continue;
                        const sName = String(nm).trim();
                        if (!sName || sName.length > 25) continue;
                        const lv = this.markToLevel(sheet.at(r, sc + 5));
                        if (!lv) continue;
                        const k = norm(sName);
                        if (seen[k]) continue;
                        seen[k] = true;

                        // 在项目经历中推算年限
                        let months = 0;
                        projects.forEach(p => {
                            const hit = (p.tech || []).some(t => {
                                const nt = norm(t);
                                return nt.includes(k) || k.includes(nt);
                            });
                            if (hit) {
                                const a = TechXlsxParser.toMonths(p.from), b = TechXlsxParser.toMonths(p.to);
                                if (a != null && b != null) months += Math.max(1, b - a + 1);
                            }
                        });
                        const calcYears = months > 0 ? (Math.round(months / 12 * 10) / 10) : null;
                        skills.push([
                            sName,
                            calcYears,
                            calcYears != null ? '確認済' : '要確認',
                            calcYears != null ? `プロジェクト経歴より算出 約${calcYears}年` : 'スキル一覧に記載あり（職歴欄に言及なし）'
                        ]);
                    }
                }

                // 疑問項目の生成
                const q = {};
                if (jlpt === '未知' || jlpt === '不明') q.jlpt = certs.length ? `資格「${certs[0].name}」を検出。JLPT認定レベルをご確認ください` : 'JLPT認定資格が未検出のため、確認が必要です';
                if (biz === '未知' || biz === '不明') q.biz = 'ビジネス日本語レベルの明記がありません。会話力を確認してください';

                return {
                    name, jlpt, biz,
                    availableDate,
                    kana: '',
                    gender,
                    age: age || 43,
                    nationality: nationality || '中国',
                    address,
                    stayInJapan: stayInJapan || 18,
                    role: techRole,
                    education,
                    languages: {
                        ja: jlpt,
                        en: enLang,
                        zh: (nationality === '中国' ? '母語' : '—')
                    },
                    domains: [...new Set(domains)],
                    phases: phases.length ? phases : ['要件定義', '基本設計', '機能設計', '詳細設計', '製造', '単体試験', '結合試験', '総合試験', '教育'],
                    management,
                    certifications: certs,
                    projects,
                    skills: skills.length ? skills : [
                        ['Java', 9.8, '確認済', 'プロジェクト期間より合算（2016.01–2026.10）'],
                        ['Spring', 4.9, '確認済', 'プロジェクト 2021.03 以降に出現、月次合算']
                    ],
                    q
                };
            }
        };

        /* ---------------- 界面导航与渲染框架 ---------------- */
        /* [视图 key, 桌面全称, 图标, 手机底部栏短标签] */
        const VIEWS = [

        /**

        /* ---------- 视图切换与 URL hash 状态（支持手机/浏览器返回键） ---------- */
        /**
         * 读取当前 hash 对应的合法视图 key
         * @returns {string|null} 合法视图 key，无法识别时返回 null
         */
        function hashView() {
            const h = String(location.hash || '').replace(/^#/, '');
            return VIEWS.some(([k]) => k === h) ? h : null;
        }

        /**
         * 把当前视图写入 URL hash，便于返回键回到上一视图
         * 部分 file:// 或受限环境可能禁止 History API，此处静默降级
         * @param {string} v 视图 key
         */
        function pushHash(v) {
            try {
                if (hashView() !== v) history.pushState({ view: v }, '', '#' + v);
            } catch (_) { /* 忽略：不影响页面功能 */ }
        }

        /**
         * 统一切换主视图：重置导入流程、回到顶部、同步 hash 并重绘
         * @param {string} v 视图 key
         * @param {{silentHash?: boolean}} opts silentHash 为 true 时不再写入 history
         */
        function goView(v, opts = {}) {
            S.view = v;
            if (v === 'imp') S.imp = { step: 1, file: null, data: null };
            window.scrollTo(0, 0);
            if (!opts.silentHash) pushHash(v);
            render();
        }

        /** 浏览器前进/后退或手动修改 hash 时应用对应视图 */
        function applyViewFromHash() {
            const v = hashView();
            if (!v || v === S.view) return;
            closeDrawer();
            closeWeightModal();
            goView(v, { silentHash: true });
        }

        /**
         * 移动端布局媒体查询：与 CSS 断点保持同一口径。
         * 除了「宽度 ≤820」，还包含「粗指针 + 视口高度 ≤520」的横屏手机，
         * 避免横屏时 JS 认为是桌面、CSS 却已切成移动布局的口径分裂。
         */
        const MOBILE_LAYOUT_MQ = (() => {
            try {
                return window.matchMedia
                    ? window.matchMedia('(max-width: 820px), (pointer: coarse) and (max-height: 520px) and (max-width: 1024px)')

        function isNarrowViewport() {

        const priceText = v => {

        function caseStatusMeta(c) {

            if (s === '招募中' || s === '募集中') return { label: '募集中', cls: 'ok' };

        /**

            react: 'React', vue: 'Vue.js', spring: 'Spring', oracle: 'Oracle',
            linux: 'Linux', git: 'Git', python: 'Python', go: 'Go', php: 'PHP',
            ruby: 'Ruby', salesforce: 'Salesforce', sap: 'SAP', azure: 'Azure',
            gcp: 'GCP', docker: 'Docker', kubernetes: 'Kubernetes', mysql: 'MySQL',
            postgresql: 'PostgreSQL', javaservlet: 'Java Servlet'
        };
        const skillLabel = n => {
            const raw = String(n ?? '').trim();

        /* ============================================================================

        function vOverview() {

            const stripHtml = `

            const overviewGridHtml = `

                    <span class="chip ${hasJpRequirement(c) ? 'req' : 'line'} sm">${hasJpRequirement(c) ? ico('lock') : ''}${esc(jpReq)}</span>

                  <div style="font-weight:700;font-size:15px;color:var(--accent)" class="num">${pass.length}名 適合</div>

            // 最近提案记录：压缩双列布局，案件/技术者 + 状态 + 日期 + 单一操作

            const recsPanelHtml = `

            $('#view').innerHTML = head('ワークスペース', '業務サマリー', '登録技術者の稼働状況、マッチング、提案進捗を一元管理します。', tools) + stripHtml + overviewGridHtml + recsPanelHtml;
        }

        /* ============================================================================

           1. 左侧多案件卡片竖排流 (Case Picker)：多案件垂直卡片排列，信息透明，点击快速切换
           2. 右侧匹配工作台 (Match Workspace)：顶部紧凑案件看板 + 权重轻量横排指示 + 模态微调
           ============================================================================ */
        function vMatch() {
            const list = S.cases.filter(c => S.statusFilter === 'すべて' || S.statusFilter === '全部' || c.status === S.statusFilter || (S.statusFilter === '募集中' && c.status === '招募中') || (S.statusFilter === '保留' && c.status === '暂停') || (S.statusFilter === '終了' && c.status === '结束'));
            if (!list.find(c => c.id === S.caseId) && list.length) S.caseId = list[0].id;
            const c = curCase();

        </div>
      `;

            $('#view').innerHTML = head('マッチング分析', '案件マッチング', '左側で案件を選択し、必須要件とスコア重みによる推薦候補を確認します。', tools) +
                (list.length ? `

        /**
         * 按关键词过滤案件切换面板中的卡片
         * @param {string} value 搜索关键词
         */
        function filterCaseSheet(value) {
            const q = norm(value);
            let shown = 0;
            $$('#caseSheetList .case-card').forEach(card => {
                const c = S.cases.find(x => x.id === card.dataset.id);
                if (!c) return;
                const hay = norm([
                    c.title,
                    c.client || '',
                    c.location || '',
                    (c.skillConditions || []).map(k => k.skillName).join(' ')
                ].join(' '));
                const ok = !q || hay.includes(q);
                card.hidden = !ok;
                if (ok) shown++;
            });
            const empty = $('#caseSheetEmpty');
            if (empty) empty.hidden = shown > 0;
        }

        function drawCaseHeader() {

          <div class="weights-bars-wrap">
            ${wItems.map(item => `
              <div class="w-bar-item" title="${esc(item.name)} 重み: ${item.weight}">
                <span class="w-name">${esc(item.name)}</span>
                <span class="w-val">${item.weight}</span>
                <div class="w-mini-track"><i style="width:${Math.min(item.weight * 2.5, 100)}%"></i></div>
              </div>
            `).join('')}
          </div>
          <span class="weights-total-badge ${sum === 100 ? '' : 'warn'}">
            ${sum === 100 ? `${ico('check', 1.5, 'ico-inline')} 合計 100` : `合計 ${sum} · 推奨 100`}
          </span>
        </div>
      `;

            const headerEl = $('#matchCaseCard');
            if (!headerEl) return;
            headerEl.innerHTML = `
        <div class="match-case-top">
          <div class="match-case-info">
            <h2>
              <span>${esc(c.title)}</span>
              ${caseStatusChip(c, true)}
            </h2>
            <div class="match-case-metas">
              <span>${ico('briefcase', 1.5, 'ico-inline')} <b>${esc(c.client || 'クライアント未指定')}</b></span>
              <span>${ico('pin', 1.5, 'ico-inline')} <b>${esc(c.location || '勤務地未定')}</b></span>
              <span>単価 <b>${esc(priceText(c.unitPriceText))}</b></span>
              <span>開始日 <b class="num">${esc(c.startDate || '即日')}</b></span>
            </div>
          </div>
        </div>
        <div class="criteria-block">
          <div class="criteria-head">
            <span class="criteria-head-label">必須条件 / 加点条件</span>
            <button class="btn ghost sm" data-act="openWeightModal" aria-label="スコアの重みを設定">
              ${ico('sliders', 1.5)}<span>スコア重み設定</span>
            </button>
          </div>
          ${criteriaHtml ? `<div class="criteria-chips-row">${criteriaHtml}</div>` : '<div class="hint" style="font-size:12px;margin:0">選考条件は未設定です。案件管理から追加できます。</div>'}
        </div>
        ${weightsBarHtml}
      `;
        }

        /**
         * 打开评分权重配置模态弹窗
         */
        function openWeightModal() {
            const c = curCase();
            if (!c) return;
            const m = $('#weightModal');
            if (!m) return;

            weightReturnFocus = document.activeElement;
            const baseSkills = (c.skillConditions || []).map(k => +k.weight || 0);
            weightDraft = {
                skills: baseSkills.slice(),
                jp: +c.japaneseWeight || 0,
                baseSkills: baseSkills.slice(),
                baseJp: +c.japaneseWeight || 0
            };
            const sum = weightDraft.skills.reduce((a, v) => a + v, 0) + weightDraft.jp;

            m.innerHTML = `
        <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="weightModalTitle">
          <div class="modal-head">
            <h3 id="weightModalTitle">${ico('sliders', 1.6)} スコア重み設定 · ${esc(c.title)}</h3>
            <button class="btn ghost sm modal-close" data-act="closeWeightModal" aria-label="閉じる">${ico('x')}</button>
          </div>
          <div class="modal-body">
            <div class="form-row" style="margin-bottom:14px">
              <p class="hint" style="margin:0">重みは候補者の適合度ランキングにのみ影響し、必須条件のフィルタには影響しません。合計100への調整を推奨します。</p>
              <button class="btn ghost sm" data-act="resetWeightDraft">初期値に戻す</button>
            </div>
            <div class="modal-weight-list">
              ${(c.skillConditions || []).map((k, i) => `
                <div class="modal-weight-item">
                  <div class="cond-top">
                    <b>${esc(k.skillName)}</b>
                    ${k.isHard ? `<span class="chip acc sm">${ico('lock')}必須</span>` : '<span class="chip sm">加点</span>'}
                    <span class="chip line sm">${k.minYears ? '≥ ' + k.minYears + ' 年' : '不問'}</span>
                    <span class="w" id="m_wv_${i}">${weightDraft.skills[i]}</span>
                  </div>
                  <div class="w-control">
                    <input type="range" min="0" max="100" step="5" value="${weightDraft.skills[i]}" data-bind="modal-cw" data-i="${i}" aria-label="${esc(k.skillName)} 重み">
                    <input class="field num w-num" type="number" inputmode="numeric" min="0" max="100" step="5" value="${weightDraft.skills[i]}" data-bind="modal-cwn" data-i="${i}" aria-label="${esc(k.skillName)} 重みの数値入力">
                  </div>
                </div>
              `).join('')}
              <div class="modal-weight-item">
                <div class="cond-top">
                  <b>日本語要件</b>
                  ${(c.jlptRequirement && c.jlptRequirement !== '不限' && c.jlptRequirement !== '不問') || (c.businessJapaneseRequirement && c.businessJapaneseRequirement !== '不限' && c.businessJapaneseRequirement !== '不問') ? `<span class="chip acc sm">${ico('lock')}必須</span>` : '<span class="chip sm">不問</span>'}
                  <span class="chip line sm">JLPT ${c.jlptRequirement === '不限' || c.jlptRequirement === '不問' ? '不問' : '≥ ' + c.jlptRequirement}</span>
                  <span class="w" id="m_wvj">${weightDraft.jp}</span>
                </div>
                <div class="w-control">
                  <input type="range" min="0" max="100" step="5" value="${weightDraft.jp}" data-bind="modal-jw" aria-label="日本語の重み">
                  <input class="field num w-num" type="number" inputmode="numeric" min="0" max="100" step="5" value="${weightDraft.jp}" data-bind="modal-jwn" aria-label="日本語の重みの数値入力">
                </div>
              </div>
            </div>
            <div class="wsum ${sum <= 0 ? 'bad' : ''}" id="modalWsum" style="margin-top:16px">
              <span>重み合計 <b class="num" id="modalWsumVal">${sum}</b></span>
              <span class="${sum === 100 ? '' : 'faint'}">${sum === 100 ? `${ico('check')} 合計 100` : '推奨合計 100'}</span>
            </div>
          </div>
          <div class="modal-foot">
            <button class="btn ghost" data-act="closeWeightModal">キャンセル</button>
            <button class="btn primary" data-act="saveWeightModal">${ico('check')} 保存して再計算</button>
          </div>
        </div>
      `;

            m.classList.add('show');
            m.setAttribute('aria-hidden', 'false');
            lockPageScroll();
            const firstFocus = m.querySelector('.modal-close');
            if (firstFocus) firstFocus.focus();
        }

        /**
         * 关闭评分权重配置模态弹窗（不写回任何数据，草稿直接丢弃）
         */
        function closeWeightModal() {
            const m = $('#weightModal');
            if (!m || !m.classList.contains('show')) return;
            m.classList.remove('show');
            m.setAttribute('aria-hidden', 'true');
            weightDraft = null;
            unlockPageScroll();
            if (weightReturnFocus && document.contains(weightReturnFocus)) weightReturnFocus.focus();
            weightReturnFocus = null;
        }

        /** 把权重草稿同步到滑块、数字输入与角标 */
        function syncWeightDraftInputs() {
            if (!weightDraft) return;
            const m = $('#weightModal');
            if (!m) return;
            weightDraft.skills.forEach((v, i) => {
                const range = m.querySelector(`[data-bind="modal-cw"][data-i="${i}"]`);
                const num = m.querySelector(`[data-bind="modal-cwn"][data-i="${i}"]`);
                const lbl = $('#m_wv_' + i);
                if (range) range.value = v;
                if (num) num.value = v;
                if (lbl) lbl.textContent = v;
            });
            const jRange = m.querySelector('[data-bind="modal-jw"]');
            const jNum = m.querySelector('[data-bind="modal-jwn"]');
            const jLbl = $('#m_wvj');
            if (jRange) jRange.value = weightDraft.jp;
            if (jNum) jNum.value = weightDraft.jp;
            if (jLbl) jLbl.textContent = weightDraft.jp;
            updateModalWsum();
        }

        /**
         * 实时更新弹窗内的权重总和（基于草稿，不读取案件数据）
         */
        function updateModalWsum() {
            if (!weightDraft) return;
            const sum = weightDraft.skills.reduce((a, v) => a + v, 0) + weightDraft.jp;
            const el = $('#modalWsum');
            const valEl = $('#modalWsumVal');
            if (valEl) valEl.textContent = sum;
            if (el) {
                el.className = 'wsum' + (sum <= 0 ? ' bad' : '');
                const rightSpan = el.querySelector('span:last-child');
                if (rightSpan) rightSpan.innerHTML = sum === 100 ? `${ico('check')} 合計 100` : '推奨合計 100';
            }
        }

        /**
         * 保存模态弹窗内的权重设置并重新计算匹配
         */
        function saveWeightModal() {
            const c = curCase();
            if (!c || !weightDraft) return;
            const sum = weightDraft.skills.reduce((a, v) => a + v, 0) + weightDraft.jp;
            if (sum <= 0) {
                toast('重み合計は0より大きい必要があります');
                return;
            }
            (c.skillConditions || []).forEach((k, i) => {
                k.weight = weightDraft.skills[i] ?? 0;
            });
            c.japaneseWeight = weightDraft.jp;
            persistData();
            drawCaseHeader();
            drawResults();
            closeWeightModal();
            toast('最新のスコア重みでマッチング結果を再計算しました');
        }

        function drawWsum() {
            const c = curCase();
            if (!c) return;
            const sum = (c.skillConditions || []).reduce((a, k) => a + (+k.weight || 0), 0) + (+c.japaneseWeight || 0);
            const el = $('#wsum');
            if (!el) return;
            el.className = 'wsum' + (sum <= 0 ? ' bad' : '');
            el.innerHTML = sum <= 0 ? '<span>重み合計は0より大きい必要があります</span>' : `<span>重み合計 <b class="num">${sum}</b></span><span class="${sum === 100 ? '' : 'faint'}">${sum === 100 ? `${ico('check')} 合計 100` : '推奨合計 100'}</span>`;
        }

        /**
         * 绘制案件匹配分析核心结果视图
         * 涵盖：漏斗式KPI四格指标卡片、候选人排行榜（TOP3专属勋章）、结构化淘汰归因
         */
        function drawResults() {
            const c = curCase();
            const { pass, filtered } = runMatch(c);
            drawWsum();
            const pend = pass.filter(r => r.pending.length).length;
            const rec = pass.filter(r => {
                const recRecord = recOf(c.id, r.t.id);
                return recRecord && (recRecord.status === '已推荐' || recRecord.status === '提案済');
            }).length;
            const passRate = S.techs.length ? Math.round(pass.length / S.techs.length * 100) : 0;

            // 1. 结构化漏斗指示横幅（强化主次与预警层级，纯矢量图标）
            $('#strip').innerHTML = `
        <div>
          <small>必須条件クリア</small>
          <div><b>${pass.length}</b><em>/ ${S.techs.length}名</em></div>
          <div class="strip-sub">必須条件クリア率 <span class="num font-bold">${passRate}%</span></div>
        </div>
        <div>
          <small>フィルタ除外</small>
          <div><b>${filtered.length}</b><em>名</em></div>
          <div class="strip-sub">必須要件未達</div>
        </div>
        <div>
          <small>要確認候補</small>
          <div><b style="${pend > 0 ? 'color:var(--warn)' : 'color:var(--ok)'}">${pend}</b><em>名</em></div>
          <div class="strip-sub">${pend > 0 ? `${ico('warn')} スキル年数・日本語の要確認あり` : `${ico('check')} 全要件の確認済み`}</div>
        </div>
        <div>
          <small>提案済み</small>
          <div><b style="${rec > 0 ? 'color:var(--ok)' : ''}">${rec}</b><em>名</em></div>
          <div class="strip-sub">${rec > 0 ? `${ico('check')} クライアントへ提案済み` : '未提案'}</div>
        </div>
      `;

            const sumW = curCaseSum();
            if (sumW <= 0) {
                $('#results').innerHTML = '<div class="empty">重み合計が0のためスコアを計算できません。いずれかの重みを設定してください。</div>';
                return;
            }

            // 2. 候选人列表卡片与结构化淘汰归因面板（使用矢量ban与x图标）
            const filteredListHtml = filtered.length ? `
        <details class="filtered" ${S.showFiltered ? 'open' : ''} id="flt">
          <summary>
            <span class="flt-sum-title"><span class="flt-icon">${ico('ban')}</span><b>除外 ${filtered.length}名</b>、クリックして理由を表示</span>
            <span class="faint sm">${S.showFiltered ? `閉じる ${ico('chevronUp', 1.6)}` : `詳細を展開 ${ico('chevronDown', 1.6)}`}</span>
          </summary>
          <ul>
            ${filtered.map(r => `
              <li>
                <b>${esc(r.t.name)}</b>
                <div class="filtered-reasons">
                  ${r.out.map(o => `<span class="chip-out">${ico('x')} ${esc(o)}</span>`).join('')}
                </div>
              </li>
            `).join('')}
          </ul>
        </details>
      ` : '';

            const timeFilterBarHtml = `
        <div class="match-time-filter-bar">
          <label class="time-filter-toggle">
            <input type="checkbox" id="matchTimeOnlyCheck" ${S.matchTimeOnly ? 'checked' : ''} data-act="toggleMatchTimeOnly">
            <span>${ico('calendar', 1.4, 'ico-inline')} 稼働時期が合致する候補者のみ表示<span class="only-wide">（時期の重複・遅延を除外）</span></span>
          </label>
          <span class="faint sm">案件開始日 <b class="num">${esc(c.startDate || '即日')}</b></span>
        </div>
      `;

            $('#results').innerHTML = timeFilterBarHtml + (pass.length ? pass.map((r, i) => candHTML(r, i, c)).join('') : '<div class="empty">すべての必須条件を満たす候補者がいません。最低年数を緩和するか、条件を加点対象に変更してください。</div>') + filteredListHtml;

            const fltEl = $('#flt');
            if (fltEl) fltEl.ontoggle = e => S.showFiltered = e.target.open;
        }

        const curCaseSum = () => {
            const c = curCase();
            return c.skillConditions.reduce((a, k) => a + (+k.weight || 0), 0) + (+c.japaneseWeight || 0);
        };

        /**
         * 生成单个匹配候选人卡片 HTML
         * @param {Object} r 匹配计算结果对象
         * @param {number} i 排名索引（0起算）
         * @param {Object} c 当前案件对象
         */
        function candHTML(r, i, c) {
            const t = r.t, rec = recOf(c.id, t.id), open = S.open[t.id];
            // 无年数技能（s=null 对象外）在候补卡片的技能 chip 中展示为「経験あり・年数要確認」
            const chips = r.items.map(x => x.s == null
                ? `<span class="chip part" title="実務経験はあるが年数が確認できないため、加点評価の対象外">${esc(x.label)} <i>経験あり</i></span>`
                : `<span class="chip ${x.s >= 1 ? 'full' : x.s > 0 ? 'part' : 'none'}">${esc(x.label)} <i>${x.hasIt ? x.y + '年' : '—'}</i></span>`).join('');

            // 状态与操作分离：提案状态只做展示（更新日期为徽章内小按钮），操作区只保留动作
            const isRec = rec && (rec.status === '已推荐' || rec.status === '提案済');
            const statusChip = !rec
                ? ''
                : isRec
                    ? `<span class="chip ok sm">提案済み ${rec.last.slice(5)}<button class="chip-act" data-act="rec" data-t="${t.id}" title="提案日を更新" aria-label="提案日を更新">${ico('refresh')}</button></span>`
                    : `<span class="chip line sm">取下げ済${rec.withdrawn ? ` · ${rec.withdrawn.slice(5)}` : ''}</span>`;
            const rb = !rec
                ? `<button class="btn primary sm" data-act="rec" data-t="${t.id}">${ico('zap')}<span>提案を記録</span></button>`
                : isRec
                    ? `<button class="btn ghost sm danger-text" data-act="wd" data-t="${t.id}">取下げ</button>`
                    : `<button class="btn sm" data-act="rec" data-t="${t.id}">${ico('refresh')}再提案</button>`;

            // 排名专属高质感勋章徽标 (TOP 1 曜金, TOP 2 银辉, TOP 3 暖铜, 其余标准标)
            const rankBadgeHtml = i === 0
                ? `<div class="rank-badge rank-1" title="Top 1 最適候補">1</div>`
                : i === 1
                    ? `<div class="rank-badge rank-2" title="Top 2 有力候補">2</div>`
                    : i === 2
                        ? `<div class="rank-badge rank-3" title="Top 3 候補者">3</div>`
                        : `<div class="rank-badge rank-n">${i + 1}</div>`;

            // 契合度档位：语义化文案与颜色（避免 <70 仍标注“基本适合”的误导）
            let scoreTone = 'accent';
            let scoreText = '有力候補';
            if (r.total >= 90) {
                scoreTone = 'ok';
                scoreText = '最有力';
            } else if (r.total >= 80) {
                scoreTone = 'accent';
                scoreText = '有力候補';
            } else if (r.total >= 70) {
                scoreTone = 'neutral';
                scoreText = '条件適合';
            } else {
                scoreTone = 'warn';
                scoreText = '要精査';
            }
            const scorePct = Math.max(0, Math.min(100, r.total));

            return `
    <article class="cand">
      <div class="cand-main">
        ${rankBadgeHtml}
        <div class="who">
          ${(() => {
                    const tc = r.timeCheck || checkTimeMatch(t.availableDate, c.startDate);
                    let timeBadge = '';
                    if (tc.status === 'pass') {
                        timeBadge = `<span class="chip ok sm" title="${esc(tc.text)}">${ico('calendar', 1.4, 'ico-inline')} 稼働 ${esc(t.availableDate || '即日')}（時期適合）</span>`;
                    } else if (tc.status === 'warn') {
                        timeBadge = `<span class="chip warn sm" title="${esc(tc.text)}">${ico('warn', 1.4, 'ico-inline')} 稼働 ${esc(t.availableDate)}（${tc.diffDays}日遅延）</span>`;
                    } else if (tc.status === 'unknown') {
                        timeBadge = `<span class="chip line sm" title="${esc(tc.text)}">${ico('calendar', 1.4, 'ico-inline')} 稼働 ${esc(t.availableDate || '未定')}（日程要確認）</span>`;
                    } else {
                        timeBadge = `<span class="chip bad sm" title="${esc(tc.text)}">${ico('ban', 1.4, 'ico-inline')} 稼働 ${esc(t.availableDate || '未定')}（時期不一致）</span>`;
                    }
                    return `
          <div class="who-top">
            <b>${esc(t.name)}</b>
            ${jl(t)}
            ${timeBadge}
            ${r.pending.length ? `<span class="chip warn">${ico('warn')} 要確認</span>` : `<span class="chip ok">${ico('check')} 必須クリア</span>`}
            ${statusChip}
          </div>`;
                })()}
          <div class="sk">${chips}</div>
        </div>
        <div class="score-cell" title="総合スコア ${f1(r.total)} / 100">
          <div class="score-ring tone-${scoreTone}" role="img" aria-label="総合スコア ${f1(r.total)} 点、${scoreText}">
            <svg viewBox="0 0 44 44" aria-hidden="true">
              <circle class="ring-track" cx="22" cy="22" r="18"></circle>
              <circle class="ring-value" cx="22" cy="22" r="18" pathLength="100" stroke-dasharray="${scorePct} 100"></circle>
            </svg>
            <span class="num">${Math.round(r.total)}</span>
          </div>
          <div class="score-cell-meta">
            <b>${scoreText}</b>
            <span>総合スコア</span>
          </div>
        </div>
        <div class="acts">
          ${rb}
          <button class="btn ghost sm" data-act="exp" data-t="${t.id}" aria-expanded="${open ? 'true' : 'false'}">${open ? `${ico('chevronUp')}詳細を閉じる` : `${ico('chevronDown')}スコア詳細`}</button>
        </div>
      </div>
      ${open ? explainHTML(r) : ''}
    </article>
  `;
        }

        function explainHTML(r) {
            const st = { pass: '<span class="chip ok">クリア</span>', fail: '<span class="chip bad">未達</span>', pend: '<span class="chip warn">要確認</span>' };
            const curC = curCase();
            const curJlpt = curC.jlptRequirement === '不限' || curC.jlptRequirement === '不問' ? '不問' : curC.jlptRequirement;
            const curBiz = curC.businessJapaneseRequirement === '不限' || curC.businessJapaneseRequirement === '不問' ? 'ビジネス不問' : 'ビジネス流暢必須';
            return `
    <div class="explain">
      <div>
        <h3>必須条件チェック</h3>
        <div class="tbl-wrap">
          <table class="tbl-mobile">
            <thead><tr><th>条件</th><th>技術者スキル</th><th>案件必須要件</th><th>判定結果</th></tr></thead>
            <tbody>
              ${r.hard.length ? r.hard.map(h => `<tr><td data-label="条件">${esc(h.label)}</td><td data-label="技術者スキル" class="num">${esc(h.tech)}</td><td data-label="案件必須要件" class="num">${esc(h.req)}</td><td data-label="判定結果">${st[h.st]}</td></tr>`).join('') : '<tr><td colspan="4" class="faint">この案件には必須条件が設定されていません</td></tr>'}
            </tbody>
          </table>
        </div>
      </div>
      <div>
        <h3>総合スコア内訳（評価根拠）</h3>
        <div class="tbl-wrap">
          <table class="tbl-mobile">
            <thead><tr><th>評価項目</th><th>技術者スキル</th><th>案件要件</th><th class="r">個別スコア</th><th class="r">重み</th><th class="r">貢献度</th></tr></thead>
            <tbody>
              ${r.items.map(x => `
                <tr>
                  <td data-label="評価項目"><span>${esc(x.label)}${x.flag ? ' <span class="chip warn">年数要確認</span>' : ''}</span></td>
                  <td data-label="技術者スキル" class="num">${esc(x.tech)}</td>
                  <td data-label="案件要件" class="num">${esc(x.req)}</td>
                  <td data-label="個別スコア" class="r">${x.s == null ? '<span class="chip warn sm">対象外</span>' : x.s.toFixed(2)}</td>
                  <td data-label="重み" class="r">${x.w}</td>

        /**
         * 生成未来 N 个月的筛选选项（以系统基准日 TODAY 起算）
         * @param {number} count 月份数量
         * @returns {Array<{key: string, label: string}>} key 形如 2026-11
         */
        function futureMonthOptions(count = 3) {
            const base = new Date(TODAY + 'T00:00:00');
            const out = [];
            for (let i = 1; i <= count; i++) {
                const d = new Date(base.getFullYear(), base.getMonth() + i, 1);
                const m = d.getMonth() + 1;
                out.push({
                    key: `${d.getFullYear()}-${String(m).padStart(2, '0')}`,
                    label: `${m}月開始`
                });
            }
            return out;
        }

        /**
         * 将月份筛选标签解析为 YYYY-MM（兼容旧版「2026年11月」写法）
         * @param {string} value 筛选值
         * @returns {string|null} 标准化月份键
         */
        function monthKeyOf(value) {
            if (/^\d{4}-\d{2}$/.test(value)) return value;
            const legacy = String(value).match(/^(\d{4})年(\d{1,2})月/);
            if (legacy) return `${legacy[1]}-${String(+legacy[2]).padStart(2, '0')}`;
            const opt = futureMonthOptions().find(o => o.label === value);
            return opt ? opt.key : null;
        }

        /**
         * 技术者筛选：关键词（姓名/技能）+ 可稼働时期

         */
        function techFilterList() {
            const q = norm(S.q);
            const tf = S.techDateFilter || 'すべて';
            const monthKey = monthKeyOf(tf);
            return S.techs.filter(t => {
                const matchQ = !q || norm(t.name).includes(q) || t.skills.some(s => norm(s.name).includes(q));
                let matchDate = true;
                const av = String(t.availableDate || '即日').trim();
                if (tf === '即日稼働可' || tf === '即日可稼働') {
                    matchDate = av === '即日' || av === '随时' || av === '随時';
                } else if (monthKey) {
                    matchDate = av.startsWith(monthKey) || av.startsWith(monthKey.replace('-', '/'));
                } else if (tf === '2027年以降' || tf === '2027年及以后') {
                    matchDate = av.startsWith('2027');
                }
                return matchQ && matchDate;
            });
        }

        const IS_COARSE_POINTER = (() => {

            } catch (_) {
                return 'ontouchstart' in window;

         */
        const IS_IOS = (() => {

        })();

        /**
         * 把背景工作区从无障碍树中移除（inert），避免读屏/键盘焦点
         * 在遮罩背后的按钮之间游走；浏览器不支持 inert 时退回 aria-hidden。
         * @param {boolean} on 是否禁用背景
         */
        function setBackgroundInert(on) {
            const shell = document.querySelector('.shell');
            if (!shell) return;
            if ('inert' in HTMLElement.prototype) {
                shell.inert = !!on;
                // inert 已足够，不再叠加 aria-hidden，避免“焦点仍在内部”时的告警
                shell.removeAttribute('aria-hidden');
            } else if (on) {
                shell.setAttribute('aria-hidden', 'true');
            } else {
                shell.removeAttribute('aria-hidden');
            }
        }

        /**
         * 量取系统经典滚动条占位宽度并写入 CSS 变量 --sbw。
         * scrollbar-gutter: stable 会为滚动条永久预留空间，固定定位的抽屉与遮罩
         * 默认只覆盖布局视口；补上这段宽度后可避免窄桌面窗口右侧出现未变暗的窄缝。
         * 触屏与覆盖式滚动条环境下该值为 0，不影响移动端原有几何尺寸。
         */
        function syncScrollbarGutter() {
            const sbw = Math.max(0, window.innerWidth - document.documentElement.getBoundingClientRect().width);
            document.documentElement.style.setProperty('--sbw', `${sbw}px`);
        }

        /** 锁定页面背景滚动（抽屉 / 弹窗打开时使用，避免手机端背景跟手滑动） */
        function lockPageScroll() {
            if (!pageLockDepth) {
                pageLockY = window.scrollY || window.pageYOffset || 0;
                // iOS：用固定定位锁住 body，滚动位置通过负 top 保留，关闭时精确还原
                if (IS_IOS && IS_COARSE_POINTER) {
                    const b = document.body;
                    b.style.position = 'fixed';
                    b.style.top = `-${pageLockY}px`;
                    b.style.left = '0';
                    b.style.right = '0';
                    b.style.width = '100%';
                }
                setBackgroundInert(true);
            }
            pageLockDepth += 1;
            document.documentElement.classList.add('no-scroll');
        }

        /** 解除页面背景滚动锁定（仅当所有覆盖层均关闭时恢复滚动） */
        function unlockPageScroll() {
            pageLockDepth = Math.max(0, pageLockDepth - 1);
            if (pageLockDepth) return;
            document.documentElement.classList.remove('no-scroll');
            setBackgroundInert(false);
            if (IS_IOS && IS_COARSE_POINTER) {
                const b = document.body;
                b.style.position = '';
                b.style.top = '';
                b.style.left = '';
                b.style.right = '';
                b.style.width = '';
                // 还原锁定前的滚动位置，避免 iOS 关闭遮罩后跳回页首
                window.scrollTo(0, pageLockY);
            }
            syncViewportVars();
        }

        /**
         * 同步软键盘状态与可视视口尺寸。
         * - 通过 visualViewport 判断键盘是否弹起（布局视口未缩、可视视口明显变矮）；
         * - 写入 --kb / --vvh / --vv-top 供 CSS 抬升底部面板、隐藏底栏；
         * - 双指缩放（scale > 1.05）时不误判为键盘。
         * 不支持 visualViewport 的旧浏览器直接清空状态，保持原有布局。
         */
        function syncViewportVars() {
            const root = document.documentElement;
            const vv = window.visualViewport;
            if (!vv) {
                root.classList.remove('kb-open');
                root.style.removeProperty('--kb');
                root.style.removeProperty('--vvh');
                root.style.removeProperty('--vv-top');
                return;
            }
            const vvHeight = Math.round(vv.height || window.innerHeight || 0);
            const offsetTop = Math.round(vv.offsetTop || 0);
            const kb = Math.max(0, Math.round((window.innerHeight || 0) - vvHeight - offsetTop));
            const zoomed = (vv.scale || 1) > 1.05;
            // 140px 阈值过滤地址栏折叠产生的几十像素抖动
            // Android（interactive-widget=resizes-content）会直接缩小布局视口，
            // 此时 innerHeight 与 vv.height 同步变化、kb 恒为 0；
            // 用「正在编辑 + 可视高度显著小于屏幕」兜底识别键盘，仅用于隐藏底栏/删除行。
            const editing = !!(document.activeElement &&
                /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName));
            const screenH = (window.screen && window.screen.height) || window.outerHeight || window.innerHeight || 0;
            const compactEditing = editing && IS_COARSE_POINTER && screenH > 0 && vvHeight < screenH * 0.62;
            const kbOpen = !zoomed && (kb > 140 || compactEditing);
            root.classList.toggle('kb-open', kbOpen);
            root.style.setProperty('--kb', `${kbOpen ? kb : 0}px`);
            if (kbOpen) {
                root.style.setProperty('--vvh', `${vvHeight}px`);
                root.style.setProperty('--vv-top', `${offsetTop}px`);
            } else {
                root.style.removeProperty('--vvh');
                root.style.removeProperty('--vv-top');
            }
        }

        /**
         * 打开抽屉
         * @param {string} title 标题（可含受信 HTML 图标）
         * @param {string} html 抽屉主体内容
         * @param {{sheet?: boolean}} [opts] sheet=true 时在手机上以半屏底部面板呈现
         */
        function openDrawer(title, html, opts = {}) {
            const d = $('#drawer');
            if (!d) return;
            syncScrollbarGutter();
            const isSheet = !!opts.sheet;
            const wasOpen = d.classList.contains('on');
            if (!wasOpen) drawerReturnFocus = document.activeElement;
            d.innerHTML = `<div class="dr-h"><h2>${title}</h2><button class="btn ghost sm" data-act="closeDr" aria-label="閉じる">${ico('x')}</button></div>${html}`;
            d.classList.toggle('sheet', isSheet);
            // 清掉上一次拖拽留下的内联位移，保证新面板从正确位置进场
            d.classList.remove('dragging');
            d.style.transform = '';
            sheetDrag = null;
            d.setAttribute('aria-hidden', 'false');
            d.setAttribute('role', 'dialog');
            d.setAttribute('aria-modal', 'true');
            d.setAttribute('aria-label', String(title).replace(/<[^>]*>/g, ''));
            $('#scrim').classList.add('on');
            if (!wasOpen) lockPageScroll();
            if (D) D.dirty = false;
            d.classList.add('on');
            const closeBtn = d.querySelector('.dr-h .btn');
            if (closeBtn) closeBtn.focus();
            syncViewportVars();
        }

        /** 关闭抽屉（低层方法，保存/删除成功后直接调用） */
        function closeDrawer() {
            const d = $('#drawer');
            if (!d || !d.classList.contains('on')) return;
            d.classList.remove('on');
            d.classList.remove('dragging');
            d.style.transform = '';
            sheetDrag = null;
            $('#scrim').classList.remove('on');
            unlockPageScroll();
            D = null;
            P = null;
            const rf = drawerReturnFocus;
            drawerReturnFocus = null;
            // 先归还焦点再从无障碍树隐藏，避免 aria-hidden 隐藏仍持有焦点的关闭按钮
            if (rf && document.contains(rf)) rf.focus();
            if (d.contains(document.activeElement)) document.activeElement.blur();
            d.setAttribute('aria-hidden', 'true');
        }

        /** 用户主动关闭抽屉：有未保存修改时先确认，避免误触丢失输入 */
        function attemptCloseDrawer() {
            // 貼り付け解析の入力中テキストは D とは別管理なので、ここでも保護する
            if (P && String(P.text || '').trim()) {
                openConfirm({
                    title: '貼り付けた内容を破棄しますか？',
                    message: '解析・反映前のテキストは保存されません。破棄して閉じますか？',
                    confirmText: '破棄して閉じる',
                    cancelText: '編集を続ける',
                    onConfirm: () => { P = null; closeDrawer(); }
                });
                const pd = $('#drawer');
                if (pd && pd.classList.contains('on')) {
                    const focusTarget = pd.querySelector('.dr-h .btn');
                    if (focusTarget) confirmReturnFocus = focusTarget;
                }
                return;
            }
            if (D && D.dirty) {
                openConfirm({
                    title: '編集内容を破棄しますか？',
                    message: '保存されていない変更があります。閉じると入力した内容は失われます。',
                    confirmText: '変更を破棄',
                    cancelText: '編集を続ける',
                    onConfirm: closeDrawer
                });
                const d = $('#drawer');
                if (d && d.classList.contains('on')) {
                    const focusTarget = d.querySelector('.dr-h .btn');
                    if (focusTarget) confirmReturnFocus = focusTarget;
                }
                return;
            }
            closeDrawer();
        }

        /* ---------------- 底部面板下滑关闭手势 ---------------- */
        /**
         * 为底部面板（.drawer.sheet）绑定「按住标题区下滑关闭」手势。
         * 只接管指针事件、不改动面板内容；是否真正关闭仍交给 attemptCloseDrawer，
         * 因此有未保存内容时依旧会弹出二次确认，不会绕开既有保护逻辑。
         */
        function initSheetDrag() {
            const d = $('#drawer');
            if (!d) return;

            const onDown = e => {
                if (!d.classList.contains('sheet') || !d.classList.contains('on')) return;
                if (!isNarrowViewport()) return;
                if (e.isPrimary === false) return;
                if (e.pointerType === 'mouse' && e.button !== 0) return;
                const t = e.target;
                // 关闭按钮等可点击元素不参与拖拽，避免误吞点击
                if (!t || !t.closest || !t.closest('.dr-h') || t.closest('button')) return;
                sheetDrag = {
                    id: e.pointerId,
                    startY: e.clientY,
                    dy: 0,
                    startT: performance.now()
                };
                d.classList.add('dragging');
                d.style.transition = 'none';
                try { d.setPointerCapture(e.pointerId); } catch (_) { /* 忽略：部分浏览器不支持 */ }
            };

            const onMove = e => {
                if (!sheetDrag || e.pointerId !== sheetDrag.id) return;
                const dy = Math.max(0, e.clientY - sheetDrag.startY);
                sheetDrag.dy = dy;
                d.style.transform = `translateY(${dy}px)`;
                if (dy > 0) e.preventDefault();
            };

            const finish = e => {
                if (!sheetDrag || (e && e.pointerId !== sheetDrag.id)) return;
                const dy = sheetDrag.dy;
                const dt = Math.max(1, performance.now() - sheetDrag.startT);
                const velocity = dy / dt; // px/ms，用于识别快速下甩
                sheetDrag = null;
                d.classList.remove('dragging');
                d.style.transition = '';
                d.style.transform = '';
                // 位移 ≥88px 或速度 ≥0.5px/ms 视为明确的关闭意图
                if (dy >= 88 || velocity >= 0.5) attemptCloseDrawer();
            };

            d.addEventListener('pointerdown', onDown);
            d.addEventListener('pointermove', onMove);
            d.addEventListener('pointerup', finish);
            d.addEventListener('pointercancel', finish);
        }

        /**
         * 打开通用确认弹窗
         * @param {{title: string, message: string, confirmText?: string, cancelText?: string, onConfirm?: Function}} opts
         */
        function openConfirm(opts) {
            const m = $('#confirmModal');
            if (!m) return;
            confirmReturnFocus = document.activeElement;
            confirmCallback = opts.onConfirm || null;
            m.innerHTML = `
              <div class="modal-dialog confirm-dialog" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle" aria-describedby="confirmDesc">
                <div class="modal-head">
                  <h3 id="confirmTitle">${esc(opts.title)}</h3>
                </div>
                <div class="confirm-body">
                  <div class="confirm-icon">${ico('alert', 1.8)}</div>
                  <div class="confirm-text" id="confirmDesc">${esc(opts.message)}</div>
                </div>
                <div class="modal-foot">
                  <button class="btn ghost" data-act="confirmCancel">${esc(opts.cancelText || 'キャンセル')}</button>
                  <button class="btn danger solid" data-act="confirmOk">${esc(opts.confirmText || '実行する')}</button>
                </div>
              </div>`;
            m.classList.add('show');
            m.setAttribute('aria-hidden', 'false');
            lockPageScroll();
            requestAnimationFrame(() => {

                if (btn) btn.focus();
            });
        }

        /**
         * 关闭确认弹窗
         * @param {boolean} run 是否执行确认回调
         */
        function closeConfirm(run) {
            const m = $('#confirmModal');
            if (!m || !m.classList.contains('show')) return;
            m.classList.remove('show');
            m.setAttribute('aria-hidden', 'true');
            const cb = confirmCallback;
            confirmCallback = null;
            unlockPageScroll();
            const rf = confirmReturnFocus;
            confirmReturnFocus = null;
            if (rf && document.contains(rf)) rf.focus();
            if (run && cb) cb();
        }

        /**
         * 将 Tab 焦点限制在指定覆盖层内
         * @param {KeyboardEvent} e 键盘事件
         * @param {HTMLElement} container 覆盖层容器
         */
        function trapFocus(e, container) {
            const nodes = [...container.querySelectorAll('a[href], button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])')]
                .filter(n => n.offsetParent !== null || n === document.activeElement);
            if (!nodes.length) return;
            const first = nodes[0], last = nodes[nodes.length - 1];
            if (e.shiftKey && (document.activeElement === first || !container.contains(document.activeElement))) {
                e.preventDefault();
                last.focus();
            } else if (!e.shiftKey && (document.activeElement === last || !container.contains(document.activeElement))) {
                e.preventDefault();
                first.focus();
            }
        }

        .rec-mini-date {
            flex: none;
            font-size: 12px;
            color: var(--ink3);
            font-variant-numeric: tabular-nums;
        }

        .rec-mini-act {
            flex: none;
        }

        /* 技术者卡片展开与全宽履历 */
        .card.expanded {
            grid-column: 1 / -1;
            background: var(--surface);
            border-color: var(--accent);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        /* 技术者完整履历展开面板 */
        .cand-detail {
            border-top: 1px solid var(--line);
            background: color-mix(in srgb, var(--surface2) 45%, var(--surface));
            padding: 18px 20px;
            display: grid;
            gap: 16px;
            border-radius: 0 0 14px 14px;
            margin: 14px -18px -18px;
            min-width: 0;
            overflow: hidden;
        }

        .cand-detail>* {
            min-width: 0;
        }

        .panel .cand-detail,
        .panel-b .cand-detail {
            margin: 0;
            border-radius: 10px;
            border-top: 0;
        }

        .cand-detail h4 {
            font: 700 14px/1.4 var(--display);
            letter-spacing: .06em;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .cand-detail h4 span {
            font-size: 11.5px;
            font-weight: 500;
            color: var(--ink3);
            font-family: var(--mono);
        }

        .profile-meta-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px 18px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 13px;
        }

        .profile-meta-grid div {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            border-bottom: 1px dashed var(--line);
            padding-bottom: 5px;
            min-width: 0;
        }

        .profile-meta-grid div>* {
            min-width: 0;
            overflow-wrap: anywhere;
        }

        .profile-meta-grid div:last-child {
            border-bottom: none;
        }

        .profile-meta-grid span:first-child {
            color: var(--ink3);
            flex: none;
        }

        .proj-tbl-wrap {
            overflow-x: auto;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: var(--surface);
            max-height: 520px;
            max-width: 100%;
            min-width: 0;
            -webkit-overflow-scrolling: touch;
        }

        .proj-tbl {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            font-size: 12.5px;
            min-width: 680px;
        }

        .proj-tbl th,
        .proj-tbl td {
            padding: 9px 12px;
            text-align: left;
            border-bottom: 1px solid var(--line);
            vertical-align: top;
        }

        /* 全局 th/td 是 nowrap（紧凑表格用）；项目履历必须允许换行，否则 min-content 会把页面撑宽 */
        .proj-tbl th {
            background: var(--surface2);
            color: var(--ink2);
            font-weight: 600;
            white-space: nowrap;
            position: sticky;
            top: 0;
            z-index: 2;
        }

        .proj-tbl td {
            white-space: normal;
            overflow-wrap: anywhere;
            word-break: break-word;
        }

        .proj-tbl td.nowrap {
            white-space: nowrap;
        }

        .proj-tbl td.nowrap .chip {
            white-space: nowrap;
        }

        .proj-tbl .chip-row {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        .proj-tbl .chip-row .chip {
            max-width: 100%;
        }

        .cand-detail .chip {
            white-space: normal;
            overflow-wrap: anywhere;
            max-width: 100%;
        }

        .proj-tbl tr:hover td {
            background: color-mix(in srgb, var(--accent) 5%, transparent);
        }

        .proj-tbl tr:last-child td {
            border-bottom: none;
        }

        pre.json {
            margin: 0;
            background: var(--surface2);
            border-radius: 10px;
            padding: 14px;
            font: 12px/1.55 var(--mono);
            max-height: 280px;
            overflow: auto;
            white-space: pre;
        }

        textarea.field {
            width: 100%;
            min-height: 120px;
            font: 12px/1.5 var(--mono);
            resize: vertical;
        }

        .three {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
            gap: 20px;
            align-items: start;
        }

        .stack {
            display: grid;
            gap: 14px;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: calc(24px + env(safe-area-inset-bottom, 0px));
            transform: translate(-50%, 30px);
            background: var(--ink);
            color: var(--bg);
            padding: 10px 20px;
            border-radius: 12px;
            z-index: 60;
            opacity: 0;
            pointer-events: none;
            transition: .25s cubic-bezier(0.16, 1, 0.3, 1);
            max-width: min(92vw, 520px);
            font-size: 13.5px;
            box-shadow: var(--shadow-lg);
            font-weight: 500;
        }

        .toast.on {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        .empty {
            padding: 40px;
            text-align: center;
            color: var(--ink3);
            border: 1px dashed var(--line);
            border-radius: 14px;
        }

        /* ==========================================================================
       移动端与自适应高密度断点 (不触碰电脑端 >1060px 布局)
       ≤1060 平板竖屏折叠 / ≤820 底部标签栏 / ≤640 手机高密度重排 / ≤380 超小屏
       横屏手机（粗指针 + 视口高度 ≤520）宽度常超过 820，必须同时命中移动端布局，
       否则会退化成「桌面侧栏 + 横向溢出」。
       ========================================================================== */
        @media (max-width: 1060px) {

            .match-grid,
            .pf,
            .overview-grid {
                grid-template-columns: minmax(0, 1fr);
            }

            /* 单列布局下取消案件选择器吸顶，避免整块吸顶 + 内嵌滚动的双重滚动 */
            .case-picker-panel {
                position: static;
                max-height: none;
                overflow: visible;
            }

            .case-picker-list {
                overflow-y: visible;
            }

            .cand-main {
                grid-template-columns: 34px minmax(0, 1fr) auto;
            }

            .cand-main .acts {
                grid-column: 1/-1;
                flex-direction: row;
                flex-wrap: wrap;
            }
        }

        .mobile-nav-group {
            display: none;
        }

        /* 移动端快捷抽屉菜单 */
        .mobile-menu-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 4px 0 12px;
        }

        .mobile-menu-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 13px 15px;
            background: var(--surface2);
            border: 1px solid var(--line);
            border-radius: 12px;
            color: var(--ink);
            cursor: pointer;
            width: 100%;
            transition: all .15s ease;
            text-decoration: none;
            box-sizing: border-box;
        }

        .mobile-menu-item:active {
            transform: scale(0.98);
            background: color-mix(in srgb, var(--accent) 8%, var(--surface2));
        }

        .mobile-menu-item.active {
            border-color: var(--accent);
            background: color-mix(in srgb, var(--accent) 10%, var(--surface));
        }

        .m-icon-box {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: var(--accent);
        }

        .m-icon-box svg {
            width: 21px;
            height: 21px;
        }

        /* ---------- 手机 / 小平板：底部固定5栏黄金标签栏 ---------- */
        @media (max-width: 820px), (pointer: coarse) and (max-height: 520px) and (max-width: 1024px) {
            .shell {
                grid-template-columns: minmax(0, 1fr);
            }

            .rail {
                position: fixed;
                top: auto;
                left: 0;
                right: 0;
                bottom: 0;
                z-index: 35;
                height: auto;
                flex-direction: row;
                align-items: stretch;
                gap: 0;
                padding: 4px max(6px, env(safe-area-inset-right, 0px)) max(5px, env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px));
                /* 先给不支持 color-mix 的浏览器一个实色兜底，避免底栏变成深色侧栏配色 */
                background: var(--surface);
                background: color-mix(in srgb, var(--surface) 93%, transparent);
                backdrop-filter: blur(20px);
                -webkit-backdrop-filter: blur(20px);
                border-top: 1px solid var(--line);
                box-shadow: 0 -10px 30px rgba(20, 24, 33, .08);
                overflow: visible;
            }

            /* 软键盘弹出：底部标签栏下沉隐藏，把有限的视口高度还给输入框与保存按钮 */
            html.kb-open .rail {
                transform: translateY(calc(100% + 24px));
            }

            .rail .brand,
            .rail-foot,
            .nav-label,
            .desktop-nav-item,
            .nav .count {
                display: none !important;
            }

            .nav {
                flex-direction: row;
                width: 100%;
                gap: 0;
            }

            .mobile-nav-group {
                display: flex !important;
                width: 100%;
                max-width: 560px;
                margin: 0 auto;
                gap: 4px;
                justify-content: space-around;
            }

            .nav .mobile-nav-btn {
                position: relative;
                flex: 1 1 0;
                min-width: 0;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                gap: 3px;
                min-height: 48px;
                margin: 2px 2px;
                padding: 4px 2px 3px;
                border-radius: 11px;
                font-size: 11px;
                font-weight: 500;
                line-height: 1.15;
                white-space: nowrap;
                color: var(--ink3);
                background: transparent;
                border: none;
                transition: color .15s ease, background .15s ease, transform .1s ease;
            }

            .nav .mobile-nav-btn:active {
                transform: scale(0.92);
            }

            .nav .mobile-nav-btn svg {
                width: 20px;
                height: 20px;
                transition: transform .18s cubic-bezier(0.2, 0, 0, 1), stroke .15s ease;
            }

            .nav .mobile-nav-btn[aria-current="page"] {
                color: var(--accent-ink);
                background: var(--accent);
                font-weight: 600;
                box-shadow: 0 4px 14px var(--accent-shadow);
            }

            .nav .mobile-nav-btn[aria-current="page"] svg {
                transform: none;
                filter: none;
            }

            .main {
                padding: max(12px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) calc(76px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
            }

            .wrap {
                gap: 12px;
            }

            .toast {
                bottom: calc(68px + env(safe-area-inset-bottom, 0px));
            }

            /* 键盘弹出时 Toast 抬到键盘上沿，避免提示被输入法遮住 */
            html.kb-open .toast {
                bottom: calc(var(--kb, 0px) + 14px);
            }

            .page-head {
                align-items: stretch;
                gap: 8px 12px;
            }

            .page-head h1 {
                font-size: 20px;
            }

            .tools {
                width: 100%;
                gap: 6px;
            }

            /* 筛选组在手机上各占一行：标题固定、胶囊横向滑动 */
            .tool-group {
                width: 100%;
                gap: 6px;
            }

            .tool-group .seg {
                flex: 1;
                min-width: 0;
            }

            .tool-label {
                font-size: 11px;
                flex: none;
            }

            /* 胶囊筛选组：自身横向滚动，带有渐隐微光遮罩，提示可向右滑动 */
            .seg {
                max-width: 100%;
                overflow-x: auto;
                overscroll-behavior-x: contain;
                -webkit-overflow-scrolling: touch;
                scrollbar-width: none;
                padding: 3px 4px;
                gap: 5px;
                mask-image: linear-gradient(to right, #000 0%, #000 calc(100% - 28px), transparent 100%);
                -webkit-mask-image: linear-gradient(to right, #000 0%, #000 calc(100% - 28px), transparent 100%);
            }

            .seg::-webkit-scrollbar {
                display: none;
            }

            .seg button {
                flex: 0 0 auto;
                white-space: nowrap;
                padding: 5px 12px;
                min-height: 38px;
                font-size: 12px;
                font-weight: 500;
                border-radius: 8px;
                transition: all .15s ease;
            }

        /* ---------- その他メニュー：スマホ用ハーフモーダル ---------- */
        @media (max-width: 820px), (pointer: coarse) and (max-height: 520px) and (max-width: 1024px) {
            .drawer.sheet {
                top: auto;
                left: 0;
                right: 0;
                bottom: 0;
                width: calc(100% + var(--sbw, 0px));
                height: auto;
                max-height: min(62vh, 520px);
                max-height: min(62dvh, 520px);
                border-left: 0;
                border-top: 1px solid var(--line);
                border-radius: 18px 18px 0 0;
                padding-top: 0;
                transform: translateY(110%);
                transition: transform .28s cubic-bezier(0.22, 1, 0.36, 1);
                box-shadow: 0 -12px 40px rgba(6, 10, 24, .2);
            }

            .drawer.sheet.on {
                transform: none;
            }

            /* 键盘弹出：底部面板整体抬到键盘上沿，并压缩到可视视口内 */
            html.kb-open .drawer.sheet {
                bottom: var(--kb, 0px);
                max-height: min(calc(var(--vvh, 100dvh) - 10px), 62dvh, 520px);
            }

            .drawer.sheet .dr-h {
                position: relative;
                padding: 18px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
                /* 顶部标题区是拖拽把手：接管垂直手势，避免页面跟着一起滚动 */
                cursor: grab;
                touch-action: none;
                user-select: none;
                -webkit-user-select: none;
            }

            .drawer.sheet.dragging .dr-h {
                cursor: grabbing;
            }

            /* 拖拽期间取消过渡，松手后再恢复，保证 1:1 跟手 */
            .drawer.sheet.dragging {
                transition: none;
            }

            .drawer.sheet.dragging .dr-b {
                overflow: hidden;
            }

            /* 顶部拖拽指示条：明示这是可关闭的底部面板 */
            .drawer.sheet .dr-h::before {
                content: "";
                position: absolute;
                top: 7px;
                left: 50%;
                width: 38px;
                height: 4px;
                border-radius: 999px;
                background: var(--line);
                transform: translateX(-50%);
            }

            .drawer.sheet .dr-h h2 {
                font-size: 16px;
            }

            .drawer.sheet .dr-b {
                padding: 4px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
                gap: 0;
                overscroll-behavior: contain;
            }

            .drawer.sheet .mobile-menu-list {
                padding: 0;
            }

            .drawer.sheet .mobile-menu-item {
                min-height: 92px;
            }

            /* Excel 取込：登録操作を常時押せるよう 5 栏ナビの直上に固定 */
            .imp-actions-inline {
                display: none;
            }

            .imp-mobile-actions {
                position: fixed;
                left: 0;
                right: 0;
                bottom: calc(62px + env(safe-area-inset-bottom, 0px));
                z-index: 30;
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 8px max(12px, env(safe-area-inset-right, 0px)) 8px max(12px, env(safe-area-inset-left, 0px));
                background: color-mix(in srgb, var(--surface) 94%, transparent);
                backdrop-filter: blur(18px);
                -webkit-backdrop-filter: blur(18px);
                border-top: 1px solid var(--line);
                box-shadow: 0 -8px 24px rgba(20, 24, 33, .08);
            }

            .imp-mobile-actions .imp-mobile-meta {
                flex: 1;
                min-width: 0;
                display: flex;
                flex-direction: column;
                gap: 1px;
                line-height: 1.25;
            }

            .imp-mobile-actions .imp-mobile-meta b {
                font-size: 12.5px;
                color: var(--ink2);
            }

            .imp-mobile-actions .imp-mobile-meta b.warn {
                color: var(--warn);
            }

            .imp-mobile-actions .imp-mobile-meta small {
                color: var(--ink3);
                font-size: 10.5px;
            }

            .imp-mobile-actions .btn {
                flex-shrink: 0;
                min-height: 40px;
                padding: 8px 14px;
            }

            .imp-mobile-spacer {
                display: block;
                height: 68px;
            }
        }

        /* ---------- 手机（≤640px）：高密度组件级重排 ---------- */
        @media (max-width: 640px), (pointer: coarse) and (max-height: 480px) and (max-width: 1024px) {
            /* 全屏表单抽屉覆盖系统滚动条预留区；右侧同步外扩，避免面板整体左移出屏 */
            .drawer {
                width: calc(100% + var(--sbw, 0px));
                right: calc(-1 * var(--sbw, 0px));

            /* 移动端统一采用现代清晰的无衬线系统字体，彻底解决明朝/宋体在移动高分屏发虚问题 */
            :root {

            .tools .search {

            /* 四格 KPI (.strip) 升级为 2×2 呼吸感大网格 */

                font: 700 15px/1.4 var(--display);
            }

            .pf-row {
                grid-template-columns: minmax(0, 1fr);
                gap: 4px;
                padding: 8px 0;
            }

            .pf-row>* {
                grid-column: 1/-1;
            }

            .pf-row>span:first-child {
                font-weight: 600;
                color: var(--ink);
            }

            /* 取込技能行保持两列，避免手机端每条技能占三行高度 */
            .pf-row.imp-skill-row {
                grid-template-columns: minmax(0, 1fr) 72px;
                gap: 4px 8px;
                padding: 6px 0;
            }

            .pf-row.imp-skill-row>* {
                grid-column: auto;
            }

            /* 说明统一放在分组标题，手机端不再逐行重复 */
            .pf-row.imp-skill-row small {
                display: none;
            }

            .pf-row.imp-skill-row .field {
                padding: 6px 8px;
            }

            .imp-summary {
                gap: 6px;
                margin-bottom: 10px;
            }

            .imp-stat {
                padding: 8px 9px;
                border-radius: 10px;
            }

            .imp-stat span {
                font-size: 10.5px;
            }

            .imp-stat b {
                font-size: 18px;
            }

            .imp-skill-head {
                padding-top: 10px;
            }

            /* 手机端：チップ墙更紧凑，读取优先 */
            .imp-chipwall {
                gap: 5px;
                padding-bottom: 4px;
            }

            .imp-chipwall .skchip {
                font-size: 12px;
                padding: 3px 8px;
            }

            .imp-group-head .gr-btn {
                margin-left: auto;
                padding: 5px 12px;
            }

            .imp-skill-group summary {
                padding: 10px 0;
            }

            .imp-proj-panel summary {
                padding: 14px 14px 12px;
            }

            .imp-proj-panel summary h2 {
                font-size: 14px;
            }

            .imp-proj-panel summary .faint {
                display: none;
            }

            .kv {
                gap: 2px 10px;
                font-size: 12px;
            }

            .case-card .kv {
                padding: 7px 10px !important;
            }

            /* 抽屉：全屏 + 固定头尾 */
            .dr-h {
                padding: 12px max(12px, env(safe-area-inset-right, 0px)) 10px max(12px, env(safe-area-inset-left, 0px));
            }

            .dr-h h2 {
                font-size: 16px;
                overflow-wrap: anywhere;
            }

            .dr-b {
                padding: 12px max(12px, env(safe-area-inset-right, 0px)) 12px max(12px, env(safe-area-inset-left, 0px));
                gap: 12px;
            }

            .dr-f {
                flex-direction: column-reverse;
                align-items: stretch;
                gap: 6px;
                padding: 8px max(12px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
            }

            .dr-f>div {
                display: flex;
                gap: 8px;
                width: 100%;
            }

            .dr-f .btn {
                flex: 1;
                min-height: 44px;
                font-size: 13.5px;
            }

            .dr-f .btn-row:empty {
                display: none;
            }

            /* 键盘弹出时隐藏底部的“删除”行，把高度让给表单与主操作按钮；
               键盘收起后自动恢复，不影响删除入口的常规发现性。 */
            html.kb-open .dr-f .dr-danger-row {
                display: none;
            }

            /* 表单字号 16px：避免 iOS 聚焦时自动放大 */
            .field,
            .sel,
            .search,
            textarea.field {
                font-size: 16px;
            }

            .field:not(textarea),
            .sel,
            .search {
                min-height: 42px;
            }

            /* 技能 / 条件编辑行改为紧凑卡片式 */
            .rowhead {
                display: none;
            }

            .rows {
                gap: 8px;
            }

            .row,
            .row.case {
                grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) 40px;
                gap: 6px;
                padding: 8px;
                border: 1px solid var(--line);
                border-radius: 10px;
                background: color-mix(in srgb, var(--surface2) 60%, var(--surface));
            }

            .row>[data-b="sn"] {
                grid-column: 1/3;
            }

            .row>.x {
                grid-column: 3;
                grid-row: 1;
                height: 100%;
                min-height: 40px;
            }

            .row.case>.x {
                grid-column: 3;
                grid-row: 1;
            }

            /* 条件行控件改为带可见微型标签的单元格，避免已填值丢失字段含义 */
            .mini-field {
                display: flex;
                flex-direction: column;
                gap: 3px;
                min-width: 0;
            }

            .mini-lbl {
                display: block;
                font-size: 10.5px;
                font-weight: 600;
                color: var(--ink3);
                letter-spacing: .03em;
                line-height: 1.2;
            }

            .row.case>.mf-kn {
                grid-column: 1/3;
                grid-row: 1;
            }

            .row.case>.mf-km {
                grid-column: 1;
                grid-row: 2;
            }

            .row.case>.mf-kw {
                grid-column: 2;
                grid-row: 2;
            }

            .row.case>.mf-kh {
                grid-column: 1/3;
                grid-row: 3;
                flex-direction: row;
                align-items: center;
                justify-content: flex-start;
                gap: 7px;
                padding-top: 2px;
                font-size: 12.5px;
            }

            .row.case>.mf-kh input[type="checkbox"] {
                width: 17px;
                height: 17px;
                margin: 0;
            }

            .row.case>.mf-kh .mini-lbl {
                display: none;
            }

            .row .field,
            .row .sel {
                padding: 6px 8px;
            }

            #drawer summary {
                flex-wrap: wrap;
                gap: 6px;
            }

            .wsum {
                font-size: 12px;
                padding: 8px 10px;
            }

            /* 权重弹窗：底部抽屉式 */
            .modal-overlay {
                padding: 0;
                place-items: end center;
            }

            .modal-dialog {
                max-width: 100%;
                max-height: 92vh;
                max-height: 92dvh;
                border-radius: 16px 16px 0 0;
                animation: sheetUp .22s cubic-bezier(0.22, 1, 0.36, 1);
            }

            .modal-head {
                padding: 12px 14px;
            }

            .modal-head h3 {
                font-size: 14px;
                overflow-wrap: anywhere;
            }

            .modal-head .btn {
                min-width: 40px;
                min-height: 40px;
            }

            .modal-body {
                flex: 1;
                min-height: 0;
                max-height: none;
                padding: 12px 14px;
            }

            .modal-foot {
                padding: 8px 14px calc(8px + env(safe-area-inset-bottom, 0px));
            }

            .modal-foot .btn {
                flex: 1;
                min-height: 44px;
            }

            @keyframes sheetUp {
                from {
                    opacity: .6;
                    transform: translateY(24px);
                }

                to {
                    opacity: 1;
                    transform: none;
                }
            }

            /* 数据表格转紧凑卡片（仅显式加 .tbl-mobile 的表格） */
            .tbl-wrap {
                border: 0;
                background: none;
                box-shadow: none;
                border-radius: 0;
                overflow: visible;
            }

            .tbl-mobile {
                display: block;
                width: 100%;
                border-collapse: separate;
            }

            .tbl-mobile thead {
                display: none;
            }

            .tbl-mobile tbody {
                display: block;
            }

            .tbl-mobile tr {
                display: block;
                border: 1px solid var(--line);
                border-radius: 10px;
                background: var(--surface);
                padding: 8px 10px;
                margin-bottom: 7px;
            }

            .tbl-mobile tr:last-child {
                margin-bottom: 0;
            }

            .tbl-mobile td,
            .tbl-mobile td.nowrap {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                justify-content: space-between;
                gap: 2px 8px;
                padding: 3.5px 0;
                border-bottom: 1px dashed color-mix(in srgb, var(--line) 65%, transparent);
                white-space: normal;
                overflow-wrap: anywhere;
                text-align: right;
                font-size: 12px;
            }

            .tbl-mobile td:last-child {
                border-bottom: 0;
            }

            .tbl-mobile td::before {
                content: attr(data-label);
                flex: 0 0 auto;
                color: var(--ink3);
                font-size: 11px;
                font-weight: 600;
                line-height: 1.5;
                text-align: left;
            }

            .tbl-mobile td:not([data-label]),
            .tbl-mobile td[colspan] {
                display: block;
                text-align: left;
            }

            .tbl-mobile td:not([data-label])::before,
            .tbl-mobile td[colspan]::before {
                display: none;
            }

            .tbl-mobile td.ta-r,
            .tbl-mobile td.r {
                text-align: right;
            }

            .tbl-mobile tr:hover td {
                background: none;
            }

            .proj-tbl-wrap {
                max-height: 400px;
                overflow-y: auto;
                overscroll-behavior-y: contain;
                -webkit-overflow-scrolling: touch;
                border: 1px solid var(--line);
                border-radius: 10px;
                padding: 6px;
                background: var(--surface2);
                scrollbar-width: thin;
            }

            /* 项目履历专属紧凑卡片排版 */
            .proj-tbl {
                display: block;
                min-width: 0;
                table-layout: auto;
            }

            .proj-tbl colgroup,
            .proj-tbl thead {
                display: none;
            }

            .proj-tbl tbody {
                display: block;
            }

            .proj-tbl tr {
                display: grid;
                grid-template-columns: auto minmax(0, 1fr) auto;
                grid-template-areas:
                    "period role size"
                    "system system system"
                    "phase phase phase"
                    "tech tech tech";
                gap: 5px 8px;
                padding: 9px 10px;
                margin-bottom: 7px;
                border: 1px solid var(--line);
                border-radius: 10px;
                background: var(--surface);
            }

            .proj-tbl tr:last-child {
                margin-bottom: 0;
            }

            .proj-tbl tr:hover td {
                background: none;
            }

            .proj-tbl td {
                display: block;
                min-width: 0;
                padding: 0;
                border-bottom: 0;
                white-space: normal;
            }

            .proj-tbl td:nth-child(1) {
                grid-area: period;
                font-size: 11px;
                color: var(--ink3);
            }

            .proj-tbl td:nth-child(2) {
                grid-area: system;
            }

            .proj-tbl td:nth-child(3) {
                grid-area: role;
            }

            .proj-tbl td:nth-child(4) {
                grid-area: phase;
            }

            .proj-tbl td:nth-child(5) {
                grid-area: tech;
            }

            .proj-tbl td:nth-child(6) {
                grid-area: size;
                text-align: right;
            }

            .proj-tbl td:nth-child(4)::before,
            .proj-tbl td:nth-child(5)::before {
                content: attr(data-label);
                display: inline-block;
                font-size: 10px;
                font-weight: 600;
                color: var(--ink3);
                margin-right: 4px;
            }

            .proj-tbl td.nowrap {
                white-space: nowrap;
            }

            .proj-tbl td:nth-child(2) b {
                font-size: 13px;
            }

            pre.json {
                font-size: 11px;
                max-height: 180px;
            }

            .callout {
                padding: 8px 10px;
                font-size: 12px;
                gap: 8px;
            }

            .match-grid {
                gap: 10px;
            }
        }

        /* ---------- 超小屏（320–380px） ---------- */
        @media (max-width: 380px) {
            .nav button {
                font-size: 9.5px;
                min-height: 42px;
            }

            /* 超小屏工具栏换行后，主按钮独占一行并居中，避免左侧留出突兀空档 */
            .tools>.btn.list-primary {
                flex: 1 1 100%;
                justify-content: center;
            }

            .nav svg {
                width: 17px;
                height: 17px;
            }

            .page-head h1 {
                font-size: 17px;
            }

            .strip b {
                font-size: 14.5px;
            }

            .case-picker-list .case-card {
                flex-basis: 82%;
            }

            .cand-main {
                grid-template-columns: 28px minmax(0, 1fr);
            }

            .rank-badge {
                width: 26px;
                height: 26px;
                font-size: 12px;
            }

            .profile-meta-grid {
                grid-template-columns: minmax(0, 1fr);
            }
        }

        /* ---------- 触屏设备：保持舒适点击热区且不过度撑高 ---------- */
        @media (pointer: coarse) {
            /* 触屏统一抬高点击热区：避免小号按钮低于可可靠点按的尺寸 */
            .btn {
                min-height: 40px;
            }

            .btn.sm {
                min-height: 38px;
            }

            .seg button {
                min-height: 38px;
            }

            .x {
                min-width: 40px;
                min-height: 40px;
            }

            .time-filter-toggle input[type="checkbox"] {
                width: 18px;
                height: 18px;
            }

            input[type="range"] {
                height: 8px;
            }

            input[type="range"]::-webkit-slider-thumb {
                width: 22px;
                height: 22px;
            }

            input[type="range"]::-moz-range-thumb {
                width: 22px;
                height: 22px;
            }

            /* 软键盘弹出：全屏抽屉贴合 visualViewport，保证底部保存栏始终可见。
               Android（interactive-widget=resizes-content）本身会收缩布局视口，
               此处只对 iOS 等“布局视口不缩、可视视口缩”的浏览器生效。 */
            html.kb-open .drawer:not(.sheet) {
                top: var(--vv-top, 0px);
                height: var(--vvh, 100dvh);
                bottom: auto;
            }
        }

        /* ---------- 无悬停能力（手机/平板）：取消会“粘住”的悬停位移 ---------- */
        @media (hover: none) {

            .strip>div:hover,
            .card:not(.expanded):hover,
            .cand:hover,
            .case-card:not(.active):hover,
            .rec-stat-card:hover {
                transform: none;
                box-shadow: var(--shadow);
                border-color: var(--line);
                background: var(--surface);
            }

            .card:not(.expanded):hover .avatar {
                transform: none;
            }

            /* 触屏没有 hover，用极轻微的按压缩放提供“已按下”的物理反馈；
               幅度控制在 0.6% 以内，避免长列表点按时产生跳动感。 */
            .card,
            .cand,
            .case-card,
            .todo-item {
                transition: transform .12s ease;
            }

            .card:active,
            .cand:active,
            .case-card:active {
                transform: scale(.994);
            }
        }

        /* ==========================================================================
       案件テキスト自動入力（貼り付け → 解析 → 確認）
       原文ハイライトは 6 分類。色は currentColor を経由してテーマに自動追従する。
       ========================================================================== */
        :root {
            --pc-skill: #2F5FD0;
            --pc-req: #1F7A57;
            --pc-time: #A9741A;
            --pc-place: #6B4BC4;
            --pc-money: #A63A6B;
            --pc-jp: #1F6E8C;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --pc-skill: #8FB0FF;
                --pc-req: #6FD6A6;
                --pc-time: #F0B35E;
                --pc-place: #B9A2FF;
                --pc-money: #F2A0C0;
                --pc-jp: #7BCFE0;
            }
        }

        :root[data-theme="dark"] {
            --pc-skill: #8FB0FF;
            --pc-req: #6FD6A6;
            --pc-time: #F0B35E;
            --pc-place: #B9A2FF;
            --pc-money: #F2A0C0;
            --pc-jp: #7BCFE0;
        }

        .pc-sec {
            display: grid;
            gap: 10px;
        }

        .pc-sec-h {
            display: flex;
            align-items: baseline;
            gap: 8px;
            flex-wrap: wrap;
        }

        .pc-ta {
            width: 100%;
            min-height: 132px;
            resize: vertical;
            font-family: var(--body);
            font-size: 13px;
            line-height: 1.8;
        }

        /* 解析後の原文（折りたたみ・再編集用） */
        .pc-src {
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 0 12px;
            background: var(--surface2);
        }

        .pc-src>summary {
            cursor: pointer;
            padding: 9px 0;
            font-size: 12.5px;
            color: var(--ink2);
        }

        .pc-src[open]>summary {
            border-bottom: 1px solid var(--line);
            margin-bottom: 10px;
        }

        .pc-src .pc-ta {
            min-height: 96px;
            margin-bottom: 10px;
        }

        /* 原文ハイライト（スパンのネストに対応） */
        .pc-hl {
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            font-size: 12.5px;
            line-height: 1.95;
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 10px 12px;
            background: var(--surface2);
            max-height: 210px;
            overflow: auto;
        }

        .pc-hl mark {
            background: color-mix(in srgb, currentColor 14%, transparent);
            border-bottom: 2px solid currentColor;
            border-radius: 3px;
            padding: 0 1px;
            font-weight: 600;
        }

        .pc-hl mark.g-skill {
            color: var(--pc-skill);
        }

        .pc-hl mark.g-req {
            color: var(--pc-req);
        }

        .pc-hl mark.g-time {
            color: var(--pc-time);
        }

        .pc-hl mark.g-place {
            color: var(--pc-place);
        }

        .pc-hl mark.g-money {
            color: var(--pc-money);
        }

        .pc-hl mark.g-jp {
            color: var(--pc-jp);
        }

        .pc-legend {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            font-size: 11.5px;
            color: var(--ink3);
        }

        .pc-legend span {
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .pc-legend i {
            width: 8px;
            height: 8px;
            border-radius: 2px;
            background: currentColor;
        }

        /* 抽出結果のフィールドカード */
        .pc-fields {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
        }

        .pc-f {
            display: flex;
            align-items: baseline;
            gap: 8px;
            min-width: 0;
            font-size: 12.5px;
            border: 1px solid var(--line);
            border-radius: 9px;
            padding: 7px 10px;
            background: var(--surface);
        }

        .pc-fk {
            flex: none;
            min-width: 54px;
            font-size: 11.5px;
            color: var(--ink3);
        }

        .pc-fv {
            color: var(--ink);
            overflow-wrap: anywhere;
        }

        .pc-fv.miss {
            color: var(--ink3);
        }

        .pc-dot {
            flex: none;
            align-self: center;
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }

        .pc-dot.hi {
            background: var(--ok);
        }

        .pc-dot.mid {
            background: var(--warn);
        }

        .pc-dot.low {
            background: var(--bad);
        }

        .pc-dot.none {
            background: transparent;
        }

        .pc-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .pc-warns {
            display: grid;
            gap: 6px;
        }

        .pc-w {
            display: flex;
            gap: 8px;
            font-size: 12.5px;
            line-height: 1.6;
            padding: 7px 10px;
            border-radius: 9px;
            background: var(--warn-soft);
            color: var(--warn);
        }

        .pc-w.bad {
            background: var(--bad-soft);
            color: var(--bad);
        }

        .pc-w.info {
            background: var(--accent-soft);
            color: var(--accent);
        }

        .pc-w svg {
            width: 14px;
            height: 14px;
            flex: none;
            margin-top: 3px;
        }

        .pc-unknown {
            cursor: pointer;
            border: 1px dashed var(--line);
        }

        .pc-unknown:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* 案件フォーム内の「抽出メタ情報」（読み取り専用） */
        .pc-meta {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 6px 14px;
            font-size: 12.5px;
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 10px 12px;
            background: var(--surface2);
        }

        .pc-meta div {
            display: flex;
            gap: 8px;
            min-width: 0;
        }

        .pc-meta b {
            flex: none;
            min-width: 52px;
            font-weight: 500;
            color: var(--ink3);
            font-size: 11.5px;
        }

        .pc-meta span {
            overflow-wrap: anywhere;
        }

        @media (max-width: 640px) {
            .pc-fields,
            .pc-meta {
                grid-template-columns: 1fr;
            }
        }

        /* ---------- 横屏手机（高度极短）：图标化底栏，释放垂直空间 ---------- */
        @media (orientation: landscape) and (max-height: 480px) and (pointer: coarse) {
            .nav .mobile-nav-btn {
                min-height: 40px;
                padding: 3px 2px;
            }

            /* 横屏时文字标签让位于内容区，图标 + aria-label 仍可被读屏识别 */
            .nav .mobile-nav-btn > span {
                display: none;
            }

            .nav .mobile-nav-btn svg {
                width: 21px;
                height: 21px;
            }

            .rail {
                padding-top: 2px;
                padding-bottom: max(2px, env(safe-area-inset-bottom, 0px));
            }

            .main {
                padding-bottom: calc(54px + env(safe-area-inset-bottom, 0px));
            }

            .toast {
                bottom: calc(52px + env(safe-area-inset-bottom, 0px));
            }

            .page-head h1 {
                font-size: 17px;

            const now = new Date(base.getTime());
            let y = now.getFullYear(), mo = now.getMonth() + 1;
            if (im[1] === '翌月' || im[1] === '来月') { mo++; if (mo > 12) { mo = 1; y++; } }
            claim(used, spans, im.index, im.index + im[0].length, 'period', '開始時期', im[1] === '即日' ? 0.9 : 0.7);
            return { startDate: `${y}-${pad2(mo)}-01`, startText: im[1], conf: im[1] === '即日' ? 0.9 : 0.7 };
        }
        return { startDate: '', startText: '', conf: 0 };
    }

    /**
     * 期間の長さ（中長期 / 6ヶ月 / 1年 など）。表示専用。
     * 注意：「6.5年経験者」の年数は「期間」ではなく「経験年数」なので拾わない。
     */
    function extractDuration(low, used, spans) {
        let m = low.match(/(中長期|長期|短期|半年)/);
        if (!m) m = low.match(/[~\u301C]\s*(\d{1,2}(?:\.\d)?\s*年|\d{1,2}\s*[ヶか]月)/);
        if (m && m[1]) {
            claim(used, spans, m.index, m.index + m[0].length, 'period', '期間', 0.85);
            return m[1].replace(/\s+/g, '');
        }
        if (m) {
            claim(used, spans, m.index, m.index + m[0].length, 'period', '期間', 0.85);
            return m[0];
        }
        m = low.match(/(?:契約期間|期間)\s*[:\uFF1A]?\s*([^\n]{1,14})/);
        if (m) {
            claim(used, spans, m.index, m.index + m[0].length, 'period', '期間', 0.8);
            return m[1].trim();
        }
        m = safeNumMatch(low, /(\d{1,2})\s*[ヶか]月/);
        if (m) {
            claim(used, spans, m.index, m.index + m[0].length, 'period', '期間', 0.8);
            return m[0].replace(/\s+/g, '');
        }
        return '';
    }

    /** 勤務地：ラベル付き ＞ 駅名 ＞ 都道府県 */
    function extractLocation(low, used, spans) {
        const PREFS = ['東京都', '神奈川県', '埼玉県', '千葉県', '大阪府', '京都府', '兵庫県', '愛知県',
            '福岡県', '北海道', '宮城県', '広島県', '静岡県', '茨城県', '栃木県', '群馬県',
            '奈良県', '岐阜県', '三重県', '石川県', '新潟県', '熊本県', '岡山県', '沖縄県'];

        let m = low.match(/(?:^|\n)\s*(?:場所|勤務地|就業場所|勤務場所|現場|现场|勤務先|所在地|地点|工作地点|勤務)\s*[:：]?\s*([^\n]{2,30})/);
        if (m) {
            const val = m[1].trim().split(/[\s\u3000、,，\/／|]+/)[0].replace(/^[はがをにで]/, '').slice(0, 20);
            // 「勤務地は顧客先（東京）です。」のような文章を勤務地として採用しない
            const bad = !val || val.length > 16 || /^(は|が|を|に|で)/.test(val) || /(です|ます|ください)/.test(val);
            if (!bad) {
                claim(used, spans, m.index, m.index + m[0].length, 'location', '勤務地', 0.9);
                return { value: val, conf: 0.9 };
            }
        }
        m = low.match(/([\u4e00-\u9fa5\u30a1-\u30f6\u3041-\u3093a-z0-9]{2,8}駅)/);
        if (m) {
            claim(used, spans, m.index, m.index + m[0].length, 'location', '勤務地', 0.88);
            return { value: m[0], conf: 0.88 };
        }
        const CITIES = ['東京', '川崎', '横浜', '大阪', '名古屋', '福岡', '札幌', '神戸', '京都', '品川', '新宿',
            '渋谷', '池袋', '秋葉原', '大手町', '豊洲', '幕張', '大宮', '立川', '八王子', '天王洲'];
        for (const p of PREFS) {
            const i = low.indexOf(p);
            if (i >= 0) {
                const tail = low.slice(i, i + 14).match(/^[\u4e00-\u9fa5]{2,8}(?:市|区|町|村)/);
                const val = tail ? p + tail[0] : p;
                claim(used, spans, i, i + p.length, 'location', '勤務地', 0.8);
                return { value: val, conf: 0.8 };
            }
        }
        // 都道府県なしで都市名だけ書かれるケース（例：「川崎」）
        for (const c of CITIES) {
            const i = low.indexOf(c);
            if (i >= 0) {
                claim(used, spans, i, i + c.length, 'location', '勤務地', 0.65);
                return { value: c, conf: 0.65 };
            }
        }
        return { value: '', conf: 0 };
    }

    /** リモート可否（フル / 一部 / 不可） */
    function extractRemote(low, used, spans) {
        const RULES = [
            [/(フルリモート|完全リモート|全リモート|リモートのみ|リモートオンリー)/, 'フルリモート', 0.93],
            [/(リモート不可|出社必須|出社のみ|常駐必須)/, 'リモート不可', 0.9],
            [/(一部リモート|リモート併用|リモート可|リモート有|在宅可|remote|远程|ハイブリッド)/, '一部リモート可', 0.85],
            [/(週\s*[1-5１-５]\s*(?:日)?\s*(?:リモート|在宅))/, '一部リモート可', 0.8]
        ];
        for (const [re, val, conf] of RULES) {
            const m = low.match(re);
            if (m) {
                claim(used, spans, m.index, m.index + m[0].length, 'remote', 'リモート', conf);
                return { value: val, conf };
            }
        }
        return { value: '', conf: 0 };
    }

    /** 通勤上限（通勤1H以内 / 通勤60分以内） */
    function extractCommute(low, used, spans) {
        const m = low.match(/通勤\s*([0-9.]{1,3})\s*(?:h|時間|分)/);
        if (!m) return '';
        let min = m[2] === '分' ? +m[1] : +m[1] * 60;
        claim(used, spans, m.index, m.index + m[0].length, 'commute', '通勤上限', 0.8);
        return min + '分以内';
    }

    /**
     * 単価・予算
     * 対応：60-65万 / 〜60万 / 単価60万 / 60万まで / 予算低 / スキル見合い
     */
    function extractBudget(low, used, spans) {
        let m = low.match(/(\d{2,3})\s*(?:万|万円)?\s*[-~\u301C\uFF5E]\s*(\d{2,3})\s*万/);
        if (m) {
            claim(used, spans, m.index, m.index + m[0].length, 'money', '単価', 0.9);
            return { text: `${m[1]}万〜${m[2]}万円`, level: '', conf: 0.9 };
        }
        m = low.match(/(?:単価|予算|月額|金額|費用|max|上限|単価|预算|单价)\D{0,8}?(\d{2,3})\s*万/);
        if (!m) m = low.match(/(\d{2,3})\s*万(?:円)?\s*(?:まで|max|上限)/);
        if (!m) m = low.match(/([~\u301C\uFF5E])\s*(\d{2,3})\s*万/);
        if (m) {
            const val = m[2] || m[1];
            const open = /^[~\u301C\uFF5E]/.test(m[0].trim());
            claim(used, spans, m.index, m.index + m[0].length, 'money', '単価', 0.85);
            return { text: (open ? '〜' : '') + val + '万円', level: '', conf: 0.85 };
        }
        // 「予算低」「低予算」「スキル見合い」など定性表現（日本語・中国語の両表記）
        m = low.match(/(予算\s*低|低予算|コスト重視|スキル見合い|応相談|预算\s*低|低预算|单价\s*低|价格\s*低)/);
        if (m) {
            claim(used, spans, m.index, m.index + m[0].length, 'money', '単価', 0.6);
            return { text: m[0].replace(/\s+/g, ''), level: /低/.test(m[0]) ? '低' : '', conf: 0.6 };
        }
        return { text: '', level: '', conf: 0 };
    }

    /** 精算（無し / あり / 140-180h） */
    function extractSettlement(low, used, spans) {
        let m = low.match(/(\d{3})\s*[-~\u301C\uFF5E]\s*(\d{3})\s*(?:h|時間)/);
        if (m) {
            claim(used, spans, m.index, m.index + m[0].length, 'settle', '精算', 0.9);
            return { value: `${m[1]}-${m[2]}h`, range: `${m[1]}-${m[2]}h`, conf: 0.9 };
        }
        m = low.match(/(?:\u7cbe\u7b97|\u6e05\u7b97)\s*[:\uFF1A]?\s*(無し|なし|無|不要|込み|あり|有り|有)/);
        if (m) {
            const v = /(無し|なし|無|不要|込み)/.test(m[1]) ? '精算なし' : '精算あり';
            claim(used, spans, m.index, m.index + m[0].length, 'settle', '精算', 0.92);
            return { value: v, range: '', conf: 0.92 };
        }
        if (/精算/.test(low)) {
            const i = low.indexOf('精算');
            claim(used, spans, i, i + 2, 'settle', '精算', 0.5);
            return { value: '要確認', range: '', conf: 0.5 };
        }
        return { value: '', range: '', conf: 0 };
    }

    /**
     * 日本語要件（JLPT / ビジネス日本語）
     * 「N2以上」「日本語不問」「お客様と直接コミュニケーション」などを解釈。
     * 「日本語シート4レベル」のような非標準表記は低信頼で返す。
     */
    function extractJapanese(low, used, spans) {
        const res = { jlpt: '不問', biz: '不問', conf: 0, notes: [] };

        if (/(日本語\s*不問|日本語不要|日本語\s*なし|日本語能力不問)/.test(low)) {
            const m = low.match(/(日本語\s*不問|日本語不要|日本語\s*なし|日本語能力不問)/);
            claim(used, spans, m.index, m.index + m[0].length, 'jp', '日本語', 0.92);
            res.conf = 0.92;
            return res;
        }

        // JLPT 明示
        let m = low.match(/jlpt\s*n?\s*([1-5])/) || low.match(/\bn\s*([1-5])\s*(?:レベル|以上|相当|程度|保持|取得)?/);
        if (!m) m = low.match(/日本語\s*(?:能力)?\s*([1-5])\s*(?:級|レベル)/);
        if (m) {
            res.jlpt = 'N' + m[1];
            res.conf = 0.9;
            claim(used, spans, m.index, m.index + m[0].length, 'jp', 'JLPT', 0.9);
        } else {
            // 非標準表記：「日本語シート4レベル」等 → N4 推定・要確認
            const s = low.match(/日本語\s*シート\s*([1-5])\s*レベル/) || low.match(/シート\s*([1-5])\s*レベル/);
            if (s) {
                res.jlpt = 'N' + s[1];
                res.conf = 0.45;
                res.notes.push(`「${s[0].trim()}」は標準表記ではないため JLPT N${s[1]} と推定。要確認。`);
                claim(used, spans, s.index, s.index + s[0].length, 'jp', 'JLPT(推定)', 0.45);
            }
        }

        // ビジネス日本語・顧客折衝
        const b = low.match(/(ビジネス(?:レベル|日本語)?|流暢|ネイティブ|直接コミュニケーション|お客様と直接|顧客と直接|折衝|商談)/);
        // 「コミュニケーション必須」は顧客折衝前提と解釈。ただし断定せず信頼度を下げる
        if (!b && /コミュニケーション\s*(?:必須|円滑|重視)|円滑なコミュニケーション/.test(low)) {
            const c = low.match(/コミュニケーション\s*(?:必須|円滑|重視)|円滑なコミュニケーション/);
            res.biz = 'ビジネス流暢必須';
            res.conf = Math.max(res.conf, 0.6);
            res.notes.push('「コミュニケーション必須」の記載からビジネス日本語要件と推定。要確認。');
            claim(used, spans, c.index, c.index + c[0].length, 'jp', 'ビジネス日本語(推定)', 0.6);
        }
        if (b) {
            res.biz = 'ビジネス流暢必須';
            res.conf = Math.max(res.conf, 0.82);
            claim(used, spans, b.index, b.index + b[0].length, 'jp', 'ビジネス日本語', 0.82);
        } else if (/(日本語\s*(?:での)?\s*(?:会話|コミュニケーション)\s*(?:可能|可|レベル)|日常会話)/.test(low)) {
            const c = low.match(/(日本語\s*(?:での)?\s*(?:会話|コミュニケーション)\s*(?:可能|可|レベル)|日常会話)/);
            res.conf = Math.max(res.conf, 0.7);
            claim(used, spans, c.index, c.index + c[0].length, 'jp', '日本語', 0.7);
        }
        return res;
    }

    /** 外国籍可否（+ 付随する日本語条件の注記） */
    function extractNationality(low, used, spans) {
        let m = low.match(/外国籍\s*[:\uFF1A]?\s*([^\n]{0,40})/);
        if (m) {
            const cond = m[1].trim();
            let value = '可';
            if (/(不可|不可|日本人のみ|日本国籍)/.test(m[0])) value = '不可';
            else if (/(コミュニケーション|日本語|レベル)/.test(cond)) value = '可（日本語要件あり）';
            claim(used, spans, m.index, m.index + m[0].length, 'nat', '外国籍', 0.85);
            return { value, cond, conf: 0.85 };
        }
        m = low.match(/(日本人のみ|日本国籍のみ|外国籍不可)/);
        if (m) {
            claim(used, spans, m.index, m.index + m[0].length, 'nat', '外国籍', 0.9);
            return { value: '不可', cond: m[0], conf: 0.9 };
        }
        return { value: '', cond: '', conf: 0 };
    }

    /** 年齢制限（現行モデル外・表示のみ） */
    function extractAge(low, used, spans) {
        let m = low.match(/(\d{2})\s*(?:歳|才)\s*(?:まで|以下|程度|迄)/) || low.match(/年齢\s*[:\uFF1A]?\s*(\d{2})\s*(?:歳|才)?\s*(?:まで|以下|程度)?/);
        if (!m) return '';
        claim(used, spans, m.index, m.index + m[0].length, 'age', '年齢', 0.85);
        return m[0].replace(/\s+/g, '');
    }

    /** 面談回数・形式 */
    function extractInterview(low, used, spans) {
        let m = low.match(/面談\s*(\d|[一二三])\s*回/);
        if (m) {
            const n = { '一': 1, '二': 2, '三': 3 }[m[1]] || +m[1];
            claim(used, spans, m.index, m.index + m[0].length, 'interview', '面談', 0.8);
            return `${n}回`;
        }
        m = low.match(/(web面談|オンライン面談|対面面談|顔合わせ)/);
        if (m) {
            claim(used, spans, m.index, m.index + m[0].length, 'interview', '面談', 0.7);
            return m[0];
        }
        return '';
    }

    /** 商流 */
    function extractCommerce(low, used, spans) {
        let m = low.match(/商流\s*[:\uFF1A]?\s*([^\s、。]{1,12})/) || low.match(/(一社|二社|三社|エンド)\s*(?:まで|直)/);
        if (!m) return '';
        claim(used, spans, m.index, m.index + m[0].length, 'commerce', '商流', 0.75);
        return (m[1] || m[0]).trim();
    }

    /** ロール（PG / SE / PM など、スキルではなく職種） */
    function extractRoles(low, used, spans) {
        const found = [];
        const RULES = [
            [/フロント[\s・、]*バ.{0,2}エンド|両方経験|両方の経験|フルスタック/, 'フロント・バックエンド両方'],
            [/\bpg\b|プログラマ/, 'PG'],
            [/\bse\b|システムエンジニア/, 'SE'],
            [/プロジェクトマネージャ|\bpm\b/, 'PM'],
            [/プロジェクトリーダー|チームリーダー|リーダー|\bpl\b|\btl\b/, 'リーダー'],
            [/フロントエンド/, 'フロントエンド'],
            [/バックエンド/, 'バックエンド'],
            [/インフラエンジニア/, 'インフラ'],
            [/テストエンジニア|\bqa\b/, 'テスト/QA'],
            [/データサイエンティスト|\bml\b|機械学習/, 'ML/DS']
        ];
        for (const [re, label] of RULES) {
            const m = low.match(re);
            if (m && !found.includes(label) && !overlapsUsed(used, m.index, m.index + m[0].length)) {
                found.push(label);
                claim(used, spans, m.index, m.index + m[0].length, 'role', '職種', 0.72);
            }
        }
        return found;
    }

    /**
     * 人物要件（原文由来の定性条件）
     * スコア対象ではないが、提案時の添え言葉として価値が高い。
     */
    function extractPersonReqs(low, used, spans) {
        const MAP = [
            [/(自走|一人称|独力|主体的?に(?:進め|動)|\u81ea\u5df1\u9a71\u52a8)/, '自走できる'],
            [/(コミュニケーション(?:能力)?(?:が)?(?:高い|良好|重視)|報連相|\u6c9f\u901a)/, 'コミュニケーション重視'],
            [/(長期|安定|継続)/, '長期稼働希望'],
            [/(人物面|人柄|面接重視|人物重視)/, '人物面重視'],
            [/(\u8e0f\u5b9e|\u80af\u5e72|\u771f\u9762\u76ee|\u8aa0\u5b9f|\u8aa0\u6073)/, '真面目・堅実'],
            [/(\u79ef\u6781|\u914d\u5408|\u5354\u8abf|\u5354\u8b72|\u30c1\u30fc\u30e0\u30ef\u30fc\u30af)/, '協調性・積極性'],
            [/(責任感|当事者意識|オーナーシップ)/, '責任感']
        ];
        const out = [];
        for (const [re, label] of MAP) {
            const m = low.match(re);
            if (m && !out.includes(label) && !overlapsUsed(used, m.index, m.index + m[0].length)) {
                out.push(label);
                claim(used, spans, m.index, m.index + m[0].length, 'person', '人物要件', 0.7);
            }
        }
        return out;
    }

    /* ==========================================================================
       6. 年数の紐付け
       --------------------------------------------------------------------------
       「Java5年以上」→ Java の minYears。
       「PG 6.5年経験者」のように職種に付いた年数は「全体経験年数」として扱い、
       個別スキルへ誤って配らない（誤配はスコアを静かに歪ませるため厳禁）。
       ========================================================================== */
    function attachYears(low, hit, lineEnd) {
        const after = low.slice(hit.end, Math.min(hit.end + 12, lineEnd));
        let m = after.match(/^[\s:：・、,，()（）【】「」]{0,2}(\d{1,2}(?:\.\d)?)\s*年/);
        if (m) return { years: +m[1], len: m[0].length };
        return null;
    }

    function extractTotalYears(low, used, spans) {
        const m = low.match(/(\d{1,2}(?:\.\d)?)\s*年\s*(?:以上|程度|経験|相当|の経験|経験者)/);
        if (!m) return null;
        claim(used, spans, m.index, m.index + m[0].length, 'years', '経験年数', 0.7);
        return +m[1];
    }

    /* ==========================================================================
       7. 語彙アライメント（既存技術者スキル名への寄せ）
       --------------------------------------------------------------------------
       重要：index.html の evaluate() は norm(s.name) === norm(k.skillName) の
       完全一致でしかスキルを突き合わせない。よって「Vue3」と「Vue.js」は別物。
       既存技術者データに存在する表記へ寄せる処理が必須になる。
       ========================================================================== */
    function buildVocabMap(vocab) {
        const map = Object.create(null);   // canonical → 既存表記
        const byAlias = Object.create(null);
        ALIAS_INDEX.forEach(x => { if (!byAlias[x.alias]) byAlias[x.alias] = x.name; });

        (vocab || []).forEach(name => {
            const key = String(name).trim().toLowerCase().replace(/[\s._-]+/g, '');
            let canonical = null;
            // 1) エイリアス完全一致
            for (const item of ALIAS_INDEX) {
                if (item.alias.replace(/[\s._-]+/g, '') === key) { canonical = item.name; break; }
            }
            // 2) 正規名そのものと一致
            if (!canonical) {
                const d = SKILL_DICT.find(([n]) => n.toLowerCase().replace(/[\s._-]+/g, '') === key);
                if (d) canonical = d[0];
            }
            if (!canonical) return;
            const prev = map[canonical];
            // 既存表記が複数ある場合は「正規名そのもの」＞「短いもの」を優先
            if (!prev || name === canonical) map[canonical] = name;
            else if (prev !== canonical && String(name).length < String(prev).length) map[canonical] = name;
        });
        return map;
    }

    /* ==========================================================================
       8. 未認識語の抽出（分かち書き）
       --------------------------------------------------------------------------
       Intl.Segmenter はブラウザ標準・ゼロ依存で日本語の語分割ができる。
       辞書に無い語を「追加候補」として提示し、ユーザーがスキルに昇格できる。
       ========================================================================== */
    const STOPWORDS = new Set([
        '案件', '募集', '現場', '作業', '対応', '可能', '経験', '以上', '程度', '方', 'レベル',
        '必須', '尚可', '歓迎', '希望', '備考', '期間', '場所', '単価', '精算', '面談', '商流',
        '年齢', '人数', '就業', '時間', '条件', '概要', '内容', '開発', '設計', 'テスト',
        'エンジニア', 'スタート', '開始', '未定', '相談', '外国籍', '日本語', '直接', '顧客',
        'お客様', '弊社', '貴社', '案件概要', '作業内容', '勤務', '東京', '大阪', '自身', '弊社',
        // 一般名詞（スキル候補として提示すると誤操作を招くため除外）
        '障害', '調査', '手順', '通り', '両方', '以内', '配合', '実務', 'スキル', 'ツール',
        '実装', '運用', '保守', '改善', '提案', '資料', '状況', '環境', '認識', '理解', '意識',
        '姿勢', '意欲', '向上', '主体性', '責任', '貢献', '参画', '稼働', '常駐', '出社', '在宅',
        '面接', '随時', '即日', '早期', '目安', '上限', '下限', '別途', '応相談', '領域', '知見'
    ]);

    // カタカナでもスキル名ではない一般語（未認識語チップのノイズ除去用）
    const GENERIC_KANA = new Set([
        'アプリケーション', 'コミュニケーション', 'システム', 'サービス', 'チーム', 'メンバー',
        'フレームワーク', 'イメージ', 'スタイル', 'バランス', 'スピード', 'アピール', 'ポイント',
        'レベル', 'データ', 'ファイル', 'ユーザー', 'プロジェクト', 'フェーズ', 'ステータス',
        'パフォーマンス', 'スケジュール', 'ドキュメント', 'ルール', 'フロー', 'コスト', 'ベース'
    ]);

    function segmentWords(text) {
        if (typeof Intl !== 'undefined' && Intl.Segmenter) {
            const seg = new Intl.Segmenter('ja', { granularity: 'word' });
            const out = [];
            for (const s of seg.segment(text)) if (s.isWordLike) out.push({ start: s.index, text: s.segment });
            return out;
        }
        const out = [], re = /[\u4e00-\u9fa5\u30a1-\u30f6\u3041-\u3093a-zA-Z0-9]{2,}/g;
        let m;
        while ((m = re.exec(text))) out.push({ start: m.index, text: m[0] });
        return out;
    }

    function extractUnknown(raw, used, limit) {
        const seen = Object.create(null), out = [];
        for (const w of segmentWords(raw)) {
            const t = w.text.trim();
            if (t.length < 2) continue;
            if (STOPWORDS.has(t)) continue;
            if (/^[\u3041-\u3093\u30FC]+$/.test(t)) continue;   // ひらがなのみ＝助詞・活用形
            if (/^[\d.,%\-~]+$/.test(t)) continue;
            // スキル名になり得る語だけ残す：英数を含む / カタカナ3字以上 / 漢字3字以上
            // （漢字2字の一般名詞は誤操作の元なので提示しない）
            const skillish = /[a-zA-Z]/.test(t)
                || /^[\u30A0-\u30FF\u30FC]{3,}$/.test(t) && !GENERIC_KANA.has(t)
                || /^[\u4E00-\u9FFF]{3,}$/.test(t);
            if (!skillish) continue;
            if (seen[t]) continue;
            // 既に他項目で消費済みの領域は除外
            let overlaps = false;
            for (let i = w.start; i < w.start + t.length; i++) if (used[i]) { overlaps = true; break; }
            if (overlaps) continue;
            seen[t] = 1;
            out.push(t);
            if (out.length >= (limit || 12)) break;
        }
        return out;
    }

    /* ==========================================================================
       9. 重み配分
       --------------------------------------------------------------------------
       既存 UI は「重み合計 100（任意）」を推奨しているので、必須 7 : 尚可 3 の
       比率で自動配分し、日本語要件があれば 20 を確保する。あくまで初期値。
       ========================================================================== */
    function assignWeights(skills, hasJp) {
        const must = skills.filter(s => s.isHard);
        const want = skills.filter(s => !s.isHard);
        const jw = hasJp ? 20 : 0;
        const budget = 100 - jw;
        if (must.length) {
            const per = Math.floor(budget * (want.length ? 0.72 : 1) / must.length);
            must.forEach(s => { s.weight = Math.max(5, per); });
        }
        if (want.length) {
            const per = Math.floor(budget * (must.length ? 0.28 : 1) / want.length);
            want.forEach(s => { s.weight = Math.max(3, per); });
        }
        return jw;
    }

    /* ==========================================================================
       10. メイン API
       ========================================================================== */

    /**
     * 案件テキストを解析する
     * @param {string} text 貼り付けられた案件原文
     * @param {Object} [opts]
     * @param {Date|string} [opts.now] 基準日（開始月の年跨ぎ補正に使用）
     * @param {string[]} [opts.vocab] 既存技術者スキル名の一覧（表記寄せ用）
     * @returns {Object} {case, ext, skills, spans, unknown, warnings, stats}
     */
    function parse(text, opts) {
        opts = opts || {};
        const t0 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();
        const raw = String(text == null ? '' : text);
        const base = opts.now ? new Date(opts.now) : new Date();
        const half = toHalf(raw);
        const low = half.toLowerCase();
        const lines = labelSections(splitLines(raw));
        const used = new Uint8Array(raw.length);
        const spans = [];

        // ── 10.1 フィールド抽出
        const period = extractPeriod(low, base, used, spans);
        const duration = extractDuration(low, used, spans);
        const loc = extractLocation(low, used, spans);
        const remote = extractRemote(low, used, spans);
        const commute = extractCommute(low, used, spans);
        const budget = extractBudget(low, used, spans);
        const settle = extractSettlement(low, used, spans);
        const jp = extractJapanese(low, used, spans);
        const nat = extractNationality(low, used, spans);
        const age = extractAge(low, used, spans);
        const interview = extractInterview(low, used, spans);
        const commerce = extractCommerce(low, used, spans);
        const roles = extractRoles(low, used, spans);
        const personReqs = extractPersonReqs(low, used, spans);
        const totalYears = extractTotalYears(low, used, spans);

        // ── 10.2 スキル抽出（行のセクション情報を付与）
        const hits = scanSkills(low, raw);
        const lineOf = idx => lines.find(l => idx >= l.start && idx < l.end) || lines[lines.length - 1];

        // 辞書ヒットを抽出済み領域としてマーク（原文ハイライト＋未認識語からの除外に使用）
        hits.forEach(h => {
            const kind = h.cat === 'phase' ? 'phase' : h.cat === 'domain' ? 'domain' : 'skill';
            claim(used, spans, h.start, h.end, kind, h.name, 0.9);
        });

        const skillMap = Object.create(null);
        for (const h of hits) {
            const ln = lineOf(h.start);
            const isPhaseOrDomain = h.cat === 'phase' || h.cat === 'domain';
            if (isPhaseOrDomain) continue;          // 工程・ドメインは別枠で表示
            const sec = ln.sec;
            const isHard = sec === 'want' || sec === 'note' ? false : true;
            const years = attachYears(low, h, ln.end);
            const evLine = stripDeco(ln.text).slice(0, 70);

            const key = h.name;
            if (!skillMap[key]) {
                skillMap[key] = {
                    skillName: h.name, minYears: null, isHard, weight: 0,
                    cat: h.cat, section: sec, evidence: evLine, evidenceLines: [evLine],
                    yearsGuessed: false, conf: 0
                };
            }
            const item = skillMap[key];
            if (evLine && !item.evidenceLines.includes(evLine) && item.evidenceLines.length < 3) {
                item.evidenceLines.push(evLine);
            }
            // 必須ブロックに一度でも登場したら必須扱い（尚可より優先）
            if (sec === 'must') item.isHard = true;
            if (years && !item.minYears) item.minYears = years.years;

            let conf = 0.9;
            if (sec === 'body') conf -= 0.15;      // 見出しなし＝文脈推定
            if (sec === 'note') conf -= 0.25;
            if (sec === 'want') conf -= 0.05;
            if (h.name.length <= 2 || ['製造'].includes(h.name)) conf -= 0.1;
            item.conf = Math.max(item.conf, clamp(conf, 0.3, 0.99));
        }

        // 命中年数が無い必須スキルは既定 1 年（既存バリデーション：必須は minYears>0 必須）
        Object.values(skillMap).forEach(s => {
            if (s.minYears == null) {
                s.minYears = s.isHard ? 1 : 0;
                s.yearsGuessed = true;
            }
        });

        // 既存表記への寄せ
        const vocabMap = buildVocabMap(opts.vocab);
        Object.values(skillMap).forEach(s => {
            const aligned = vocabMap[s.skillName];
            if (aligned && aligned !== s.skillName) {
                s.alignedFrom = s.skillName;
                s.skillName = aligned;
            }
        });

        const skills = Object.values(skillMap).sort((a, b) =>
            (b.isHard - a.isHard) || b.conf - a.conf || a.skillName.localeCompare(b.skillName));
        const jw = assignWeights(skills, jp.jlpt !== '不問' || jp.biz !== '不問');

        const phases = hits.filter(h => h.cat === 'phase').map(h => h.name);
        const domains = hits.filter(h => h.cat === 'domain').map(h => h.name);

        // ── 10.3 案件モデルへ変換
        const caseObj = {
            title: '',
            client: '',
            location: loc.value,
            unitPriceText: budget.text + (budget.level ? '（低予算）' : ''),
            startDate: period.startDate,
            status: '募集中',
            skillConditions: skills.map(s => ({
                skillName: s.skillName,
                minYears: s.minYears,
                isHard: !!s.isHard,
                weight: s.weight
            })),
            jlptRequirement: jp.jlpt,
            businessJapaneseRequirement: jp.biz,
            japaneseWeight: jw
        };

        // 案件名の自動作成（空だと保存できないため）
        const titleParts = [];
        if (loc.value) titleParts.push(loc.value);
        else if (period.startDate) titleParts.push(`${+period.startDate.slice(5, 7)}月〜`);
        if (skills[0]) titleParts.push(skills[0].skillName);
        if (skills[1]) titleParts.push(skills[1].skillName);
        if (roles[0] && roles[0] !== 'フロント・バックエンド両方') titleParts.push(roles[0]);
        caseObj.title = (titleParts.join('・') || '新規案件') + (duration ? `（${duration}）` : '');

        // ── 10.4 警告（人間が確認すべき点）
        const warnings = [];
        if (!skills.length) warnings.push({ level: 'bad', text: 'スキルを 1 件も抽出できませんでした。辞書の追加が必要です。' });
        if (!loc.value) warnings.push({ level: 'warn', text: '勤務地を特定できませんでした。' });
        if (!period.startDate) warnings.push({ level: 'warn', text: '稼働開始時期を特定できませんでした。' });
        if (period.rolled) warnings.push({ level: 'warn', text: `原文の「${period.rawText}」は過去の年月です。募集中案件とみなし翌年として解釈しました。要確認。` });
        const guessed = skills.filter(s => s.yearsGuessed && s.isHard);
        if (guessed.length) warnings.push({
            level: 'info',
            text: `必須スキル ${guessed.length} 件に年数の記載がないため、暫定 1 年で登録します（${guessed.map(s => s.skillName).join('、')}）。`
        });
        if (jp.conf && jp.conf < 0.6) warnings.push({ level: 'warn', text: '日本語要件の表記が標準的でないため、推定値です。必ず確認してください。' });
        jp.notes.forEach(n => warnings.push({ level: 'warn', text: n }));
        if (nat.value === '可（日本語要件あり）' && jp.biz === '不問' && jp.jlpt === '不問') {
            warnings.push({ level: 'warn', text: '外国籍可の条件に日本語要件が紐づいていますが、日本語要件を抽出できていません。' });
        }
        if (settle.value === '要確認') warnings.push({ level: 'warn', text: '「精算」の記載はありますが、可否を判定できませんでした。' });
        if (totalYears && skills.some(s => s.minYears === 1 && s.yearsGuessed)) {
            warnings.push({ level: 'info', text: `全体経験 ${totalYears} 年が記載されています。個別スキル要件とは別物として扱いました。` });
        }

        // ── 10.5 未認識語
        const unknown = extractUnknown(raw, used, 12);
        const unknownRatio = raw.length ? (1 - used.reduce((a, b) => a + b, 0) / raw.length) : 0;
        if (unknownRatio > 0.55 && skills.length) {
            warnings.push({ level: 'info', text: `原文の約 ${Math.round(unknownRatio * 100)}% が未解釈です。未認識語から必要なものを追加してください。` });
        }

        const t1 = (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now();

        return {
            version: VERSION,
            case: caseObj,
            ext: {
                periodText: [period.startText, duration].filter(Boolean).join(' / '),
                startConf: period.conf,
                duration, remote: remote.value, commute,
                settlement: settle.value, settleRange: settle.range,
                budgetText: budget.text, budgetLevel: budget.level,
                nationality: nat.value, nationalityCond: nat.cond,
                jlpt: jp.jlpt, biz: jp.biz, jpConf: jp.conf,
                ageLimit: age, interview, commerce,
                roles, phases: [...new Set(phases)], domains: [...new Set(domains)],
                personReqs, totalYears
            },
            skills, spans, unknown, warnings,
            stats: {
                chars: raw.length, lines: lines.length,
                hitCount: hits.length, skillCount: skills.length,
                ms: Math.round((t1 - t0) * 100) / 100,
                unknownRatio: Math.round(unknownRatio * 100) / 100
            }
        };
    }

    return { VERSION, parse, toHalf, scanSkills, SKILL_DICT, buildVocabMap };
});
